<!DOCTYPE html>
<html lang="ar" dir="rtl" data-style="default" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>محتوى الأعضاء — CineAura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Outfit:wght@400;600;750;800&display=swap" rel="stylesheet">
<style>
/* ═════════════ BASE ═════════════ */
:root{
  --cyan:#01b4e4; --green:#90cea1; --green-ink:#90cea1;
  --text:#f4fbff; --muted:#9bb0c2;
  --line:rgba(145,196,220,.16);
  --sans:"Outfit","Cairo","Segoe UI",sans-serif;
  --ar:"Cairo","Outfit",sans-serif;
  --surface:rgba(9,22,36,.62); --hdr:rgba(7,18,30,.9);
  --input:rgba(4,14,24,.55); --sub:rgba(255,255,255,.05);
  --red:#ff6b6b; --amber:#f5a623;
  --shadow:0 24px 80px rgba(0,0,0,.42);
  --bg:linear-gradient(180deg,#08131e,#070f18 46%,#0a1826);
  --radius:16px; --radius-sm:12px;
}
html[data-theme="day"]{
  --text:#0d253f; --muted:#4a6578; --line:rgba(13,37,63,.12);
  --surface:rgba(255,255,255,.86); --hdr:rgba(255,255,255,.94);
  --input:rgba(255,255,255,.95); --sub:rgba(13,37,63,.05);
  --red:#d93025; --amber:#b06000;
  --shadow:0 18px 48px rgba(13,37,63,.1);
  --bg:linear-gradient(180deg,#f4f8fb,#e8f1f6 48%,#dceaf3);
}
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%;padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{
  min-height:100%;background:var(--bg);background-attachment:fixed;
  color:var(--text);font-family:var(--ar);font-size:15px;line-height:1.7;
  padding:calc(84px + env(safe-area-inset-top)) 16px 60px;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(520px 320px at 85% 6%,rgba(1,180,228,.14),transparent 70%),
    radial-gradient(480px 300px at 10% 90%,rgba(144,206,161,.10),transparent 70%);
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
input[type=text],input[type=search]{
  width:100%;background:var(--input);border:1px solid var(--line);
  border-radius:999px;padding:10px 16px;outline:none;color-scheme:dark;
}
html[data-theme="day"] input{color-scheme:light}
input:focus{border-color:rgba(1,180,228,.55);box-shadow:0 0 0 4px rgba(1,180,228,.12)}
.ic{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:middle}
.ic-fill{fill:currentColor;stroke:none}
/* ═════════════ HEADER ═════════════ */
.header{
  position:fixed;top:calc(14px + env(safe-area-inset-top,0px));
  inset-inline:12px;z-index:30;max-width:1500px;margin:auto;
}
.header-inner{
  display:flex;align-items:center;gap:12px;padding:10px 14px;
  border:1px solid var(--line);border-radius:var(--radius);
  background:var(--hdr);backdrop-filter:blur(22px) saturate(150%);
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.08);
}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none;color:inherit;flex:none}
.logo-mark{
  width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(160deg,rgba(1,180,228,.28),rgba(144,206,161,.12));
  border:1px solid rgba(1,180,228,.35);
}
.logo-mark svg{width:14px;height:14px;fill:var(--green)}
.logo-word{font-family:var(--sans);font-weight:750;font-size:18px;letter-spacing:-.04em}
.logo-word span{
  background:linear-gradient(90deg,var(--cyan),var(--green-ink));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.search-wrap{
  flex:1;max-width:620px;margin:0 auto;position:relative;
  display:flex;align-items:center;
}
.search-wrap .ic-search{
  position:absolute;inset-inline-start:14px;width:16px;height:16px;
  color:var(--muted);pointer-events:none;
}
.search-wrap input{padding-inline-start:40px;padding-inline-end:38px}
.search-wrap .clear-btn{
  position:absolute;inset-inline-end:10px;width:26px;height:26px;
  border-radius:50%;display:grid;place-items:center;
  color:var(--muted);background:var(--sub);
}
.search-wrap .clear-btn:hover{color:var(--text)}
.search-wrap .clear-btn .ic{width:14px;height:14px}
.btn-icon{
  width:38px;height:38px;border-radius:12px;
  border:1px solid var(--line);background:var(--sub);
  display:grid;place-items:center;font-size:16px;
  transition:.15s;flex:none;
}
.btn-icon:hover{border-color:rgba(1,180,228,.5);background:rgba(1,180,228,.08)}
.user-chip{
  display:flex;align-items:center;gap:8px;padding:5px 12px 5px 6px;
  border-radius:999px;border:1px solid var(--line);background:var(--sub);
  flex:none;font-size:13px;font-weight:600;
}
.user-avatar{
  width:28px;height:28px;border-radius:50%;
  background:linear-gradient(135deg,var(--cyan),var(--green-ink));
  display:grid;place-items:center;color:#fff;font-size:12px;font-weight:800;
}
/* ═════════════ BUTTONS ═════════════ */
.btn{
  border:1px solid var(--line);background:var(--sub);
  border-radius:10px;padding:8px 16px;
  font-weight:600;font-size:13.5px;transition:.18s;
  display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:inherit;
}
.btn:hover{border-color:rgba(1,180,228,.5);background:rgba(1,180,228,.08)}
.btn-sm{padding:5px 12px;font-size:12.5px;border-radius:9px}
.btn-primary{
  background:linear-gradient(90deg,#01b4e4,#2ec7ea 48%,#90cea1 160%);
  color:#032541;border:0;box-shadow:0 8px 24px rgba(1,180,228,.22);
}
.btn-primary:hover:not(:disabled){box-shadow:0 12px 30px rgba(1,180,228,.34)}
/* ═════════════ HUB VIEW ═════════════ */
.browse{max-width:1500px;margin:0 auto;position:relative;z-index:1}
.browse-hero{text-align:center;padding:16px 0 32px}
.browse-hero h1{
  font-size:clamp(24px,4vw,38px);font-weight:800;letter-spacing:-.02em;
  margin-bottom:8px;
  background:linear-gradient(90deg,var(--cyan),var(--green-ink));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.browse-hero p{color:var(--muted);font-size:15px;max-width:640px;margin:0 auto}
/* Sections */
.section{margin-bottom:42px}
.section-head{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;margin-bottom:14px;
}
.section-title-group{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.section-badge{
  width:36px;height:36px;border-radius:10px;
  display:grid;place-items:center;color:#fff;flex:none;
}
.section-badge .ic{width:18px;height:18px;stroke-width:2.2}
.section-title-group h2{font-size:20px;font-weight:700;letter-spacing:-.02em}
.section-count{
  font-size:11.5px;color:var(--muted);background:var(--sub);
  padding:2px 10px;border-radius:999px;flex:none;font-weight:600;
  font-variant-numeric:tabular-nums;
}
.section-tools{display:flex;gap:6px;align-items:center;flex:none}
.carousel-controls{display:flex;gap:6px}
.carousel-btn{
  width:34px;height:34px;border-radius:50%;
  border:1px solid var(--line);background:var(--sub);
  display:grid;place-items:center;color:var(--muted);
  transition:.15s;
}
.carousel-btn:hover{background:var(--surface);color:var(--text);border-color:var(--cyan)}
.carousel-btn .ic{width:16px;height:16px}
/* Carousel */
.carousel{position:relative}
.carousel-track{
  display:flex;gap:16px;
  overflow-x:auto;overflow-y:hidden;
  scroll-snap-type:x mandatory;
  padding-bottom:10px;
  scrollbar-width:thin;scrollbar-color:var(--line) transparent;
  -webkit-overflow-scrolling:touch;
}
.carousel-track::-webkit-scrollbar{height:8px}
.carousel-track::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.carousel-track::-webkit-scrollbar-track{background:transparent}
/* Card (unified across all 4 types) */
.video-card{
  flex:0 0 285px;scroll-snap-align:start;
  cursor:pointer;border-radius:var(--radius-sm);
  transition:transform .18s;
  outline-offset:4px;
}
.video-card:hover{transform:translateY(-3px)}
.card-thumb{
  aspect-ratio:16/9;border-radius:var(--radius-sm);overflow:hidden;
  position:relative;background:var(--sub);border:1px solid var(--line);
}
.thumb-gradient{
  width:100%;height:100%;position:relative;
  display:grid;place-items:center;
  background:
    radial-gradient(circle at 30% 20%,color-mix(in srgb,var(--c2) 55%,transparent),transparent 58%),
    linear-gradient(135deg,var(--c1),var(--c2));
}
.thumb-gradient::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(45deg,rgba(255,255,255,.035) 0 2px,transparent 2px 12px);
}
.thumb-gradient img{width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0;z-index:1}
.thumb-letter{
  font-family:var(--sans);font-size:54px;font-weight:800;
  color:rgba(255,255,255,.92);
  text-shadow:0 4px 24px rgba(0,0,0,.45);
  z-index:1;
}
.thumb-duration{
  position:absolute;bottom:6px;inset-inline-start:6px;z-index:2;
  background:rgba(0,0,0,.78);color:#fff;
  font-size:11px;font-weight:700;padding:2px 6px;border-radius:4px;
  font-variant-numeric:tabular-nums;
}
.rank-badge{
  position:absolute;top:6px;inset-inline-end:6px;z-index:2;
  background:linear-gradient(135deg,#f5a623,#ff6b6b);
  color:#fff;font-size:11px;font-weight:800;
  padding:2px 8px;border-radius:999px;
  box-shadow:0 2px 10px rgba(0,0,0,.3);
}
.card-play-overlay{
  position:absolute;inset:0;z-index:1;
  display:grid;place-items:center;
  background:rgba(0,0,0,.3);
  opacity:0;transition:.2s;
}
.card-play-overlay .ic{width:46px;height:46px;fill:#fff;stroke:none;opacity:.95;filter:drop-shadow(0 4px 16px rgba(0,0,0,.5))}
.video-card:hover .card-play-overlay{opacity:1}
.card-title{
  font-size:14.5px;font-weight:700;line-height:1.4;
  margin:10px 0 6px;min-height:2.8em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;
}
.card-stats{
  display:flex;gap:10px;flex-wrap:wrap;
  font-size:12px;color:var(--muted);margin-bottom:6px;
}
.stat{display:inline-flex;align-items:center;gap:4px}
.stat .ic{width:13px;height:13px}
.card-pub{
  display:flex;align-items:center;gap:6px;
  font-size:12px;color:var(--muted);
}
.mini-avatar{
  width:20px;height:20px;border-radius:50%;
  display:grid;place-items:center;flex:none;
  font-size:10px;font-weight:800;color:#fff;
}
.card-pub-name{font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:140px}
.card-date{margin-inline-start:auto;white-space:nowrap;font-size:11.5px}
/* Loading / Empty */
.section-loading,.section-empty{
  flex:0 0 100%;
  display:flex;align-items:center;justify-content:center;gap:10px;
  min-height:180px;color:var(--muted);font-size:14px;
  border:1px dashed var(--line);border-radius:var(--radius-sm);
  background:var(--sub);
}
.spinner{
  width:20px;height:20px;border:2.5px solid var(--line);
  border-top-color:var(--cyan);border-radius:50%;
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
/* ═════════════ TOAST ═════════════ */
#toast{
  position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));inset-inline:0;
  margin:auto;width:max-content;max-width:90vw;z-index:100;
  background:var(--hdr);border:1px solid var(--line);border-radius:12px;
  padding:10px 18px;box-shadow:var(--shadow);
  opacity:0;transform:translateY(10px);transition:.25s;
  pointer-events:none;font-size:14px;font-weight:600;
}
#toast.on{opacity:1;transform:none}
/* ═════════════ RESPONSIVE ═════════════ */
@media (max-width:760px){
  body{padding-top:calc(76px + env(safe-area-inset-top))}
  .header-inner{flex-wrap:wrap}
  .search-wrap{order:5;flex-basis:100%;max-width:none;margin:0}
  .user-chip .user-name{display:none}
  .user-chip{padding:5px}
  .video-card{flex:0 0 240px}
  .section-head{gap:8px}
  .section-title-group h2{font-size:17px}
  .section-count{display:none}
}
@media (max-width:480px){
  .video-card{flex:0 0 82vw}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
  html{scroll-behavior:auto}
}
</style>

/* Floating theme button + panel */
#artheme-btn{position:fixed!important;bottom:22px!important;left:22px!important;z-index:2147483646!important;width:52px!important;height:52px!important;padding:0!important;margin:0!important;border-radius:50%!important;border:1px solid var(--line)!important;background:var(--hdr)!important;color:var(--text)!important;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:var(--shadow),0 10px 28px rgba(0,0,0,.35)!important;cursor:pointer!important;display:grid!important;place-items:center!important;font:inherit!important;transition:transform .2s,border-color .2s}
#artheme-btn:hover{transform:translateY(-2px);border-color:var(--cyan)!important}
#artheme-btn svg{width:22px;height:22px}
#artheme-btn .at-dot{position:absolute;top:6px;right:6px;width:10px;height:10px;border-radius:50%;background:var(--cyan);box-shadow:0 0 0 2px var(--hdr)}
#artheme-panel{position:fixed!important;bottom:84px!important;left:22px!important;z-index:2147483647!important;width:min(400px,calc(100vw - 44px))!important;max-height:min(78vh,620px)!important;overflow-y:auto!important;overscroll-behavior:contain;padding:16px!important;margin:0!important;border-radius:var(--radius)!important;background:var(--hdr)!important;border:1px solid var(--line)!important;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:var(--shadow),0 28px 70px rgba(0,0,0,.45)!important;color:var(--text)!important;font-family:var(--ar)!important;display:none!important}
#artheme-panel.open{display:block!important}
#artheme-panel .at-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
#artheme-panel .at-head h3{margin:0;font-size:15px;font-weight:700;color:var(--text)}
#artheme-panel .at-close{width:32px;height:32px;padding:0;border-radius:50%;border:0;background:var(--sub);color:var(--text);cursor:pointer;display:grid;place-items:center;font:inherit;font-size:20px;line-height:1}
#artheme-panel .at-mode{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;margin-bottom:14px;border-radius:12px;background:var(--input);border:1px solid var(--line)}
#artheme-panel .at-mode button{min-height:38px;padding:0 8px;border:0;border-radius:9px;background:transparent;color:var(--text);font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
#artheme-panel .at-mode button[aria-checked="true"]{background:var(--cyan);color:#fff}
#artheme-panel .at-mode svg{width:15px;height:15px}
#artheme-panel .at-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px}
#artheme-panel .at-card{display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--sub);color:var(--text);font:inherit;cursor:pointer;text-align:start;transition:border-color .15s,transform .15s}
#artheme-panel .at-card:hover{border-color:var(--cyan);transform:translateY(-1px)}
#artheme-panel .at-card[aria-checked="true"]{border-color:var(--cyan);box-shadow:0 0 0 2px color-mix(in srgb,var(--cyan) 30%,transparent)}
#artheme-panel .at-prev{height:46px;border-radius:6px;overflow:hidden;display:grid;grid-template-rows:12px 1fr;border:1px solid var(--line);background:var(--input)}
#artheme-panel .at-prev-bar{display:flex;align-items:center;gap:3px;padding:0 5px;background:var(--hdr)}
#artheme-panel .at-prev-dot{width:5px;height:5px;border-radius:50%;background:var(--at-accent,var(--cyan))}
#artheme-panel .at-prev-body{display:grid;place-items:center;color:var(--muted);font-size:12px;font-weight:700}
#artheme-panel .at-name{font-size:11.5px;font-weight:700;color:var(--text)}
#artheme-panel .at-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
#artheme-panel .at-reset{padding:8px 14px;border-radius:9px;border:1px solid color-mix(in srgb,var(--red) 40%,transparent);background:color-mix(in srgb,var(--red) 10%,transparent);color:var(--red);font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
#artheme-panel .at-cur{font-size:12px;color:var(--muted)}
@media(max-width:480px){
  #artheme-btn{bottom:14px!important;left:14px!important;width:46px!important;height:46px!important}
  #artheme-panel{bottom:72px!important;left:12px!important;width:calc(100vw - 24px)!important}
}

<!-- ═════════════ HUB LOGIC ═════════════ -->
<script>
(function () {
  'use strict';

  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const iconSvg = (name, cls = 'ic') => `<svg class="${cls}"><use href="#i-${name}"/></svg>`;

  function fmtNum(n) {
    const num = Number(n) || 0;
    if (num >= 1e6) { const v = num / 1e6; return (v >= 10 ? Math.round(v) : v.toFixed(1)).toString().replace(/\.0$/, '') + 'M'; }
    if (num >= 1e3) { const v = num / 1e3; return (v >= 10 ? Math.round(v) : v.toFixed(1)).toString().replace(/\.0$/, '') + 'K'; }
    return String(Math.round(num));
  }
  function fmtSize(bytes) {
    const b = Number(bytes) || 0;
    if (b >= 1048576) return (b / 1048576).toFixed(1) + ' MB';
    if (b >= 1024) return Math.round(b / 1024) + ' KB';
    return b + ' B';
  }
  function readMinutes(text) {
    const words = String(text || '').split(/\s+/).filter(Boolean).length;
    return Math.max(1, Math.ceil(words / 200));
  }
  function toast(msg) {
    const el = $('toast');
    el.textContent = msg;
    el.classList.add('on');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => el.classList.remove('on'), 2400);
  }

  /* ─────────────────── SECTIONS ─────────────────── */
  const SECTIONS = [
    { id: 'videos',    title: 'أكثر 50 فيديو مشاهدة',  icon: 'film',    color: '#01b4e4', c1: '#0a4f6e', c2: '#01b4e4', href: './video.html' },
    { id: 'articles',  title: 'أكثر 50 مقالة قراءة',   icon: 'message', color: '#f5a623', c1: '#7a3d00', c2: '#f5a623', href: './articles.html' },
    { id: 'questions', title: 'أكثر 50 سؤال مشاهدة',   icon: 'star',    color: '#a78bfa', c1: '#3b1f7a', c2: '#a78bfa', href: './answers.html' },
    { id: 'documents', title: 'أكثر 50 مستند مشاهدة',  icon: 'globe',   color: '#90cea1', c1: '#1e5a3a', c2: '#90cea1', href: './documents.html' }
  ];

  /* ─────────────────── FETCHERS ─────────────────── */
  async function fetchVideos() {
    try {
      const V = window.CineAuraVideos;
      if (!V || !V.call) return [];
      const res = await V.call('content_search', {
        p_member: V.memberId ? V.memberId() : '',
        p_sort: 'minutes',
        p_limit: 50
      });
      if (!res.ok || !Array.isArray(res.data?.items)) return [];
      // استبعاد الفيديوهات العمودية من الشبكة الأفقية
      return res.data.items.filter(x => !x.portrait);
    } catch { return []; }
  }

  async function fetchArticles() {
    try {
      const C = window.CineAura;
      if (!C || !C.supabaseRequest) return [];
      const res = await C.supabaseRequest(
        '/rest/v1/community_articles?' +
        'select=id,member_id,title,description,views,created_at,publish_at,status,visibility,places,thumb' +
        '&status=eq.published&visibility=eq.public&order=views.desc&limit=50'
      );
      if (!res.ok || !Array.isArray(res.data)) return [];
      return res.data.filter(row => {
        const st = String(row.status || 'published').trim().toLowerCase();
        if (st !== 'published') return false;
        if (row.publish_at) {
          const w = Date.parse(row.publish_at);
          if (!Number.isFinite(w) || w > Date.now()) return false;
        }
        const places = String(row.places ?? 'content').trim().toLowerCase();
        if (places && !places.split(/[+,|\s]+/).some(p => p === 'content' || p === 'both')) return false;
        return true;
      });
    } catch { return []; }
  }

  async function fetchQuestions() {
    try {
      const C = window.CineAura;
      if (!C || !C.supabaseRequest) return [];
      // نحاول views ثم answers_count ثم created_at (حسب المخطط المتاح)
      for (const order of ['views.desc,created_at.desc', 'answers_count.desc,created_at.desc', 'created_at.desc']) {
        const res = await C.supabaseRequest(`/rest/v1/community_questions?select=*&order=${order}&limit=50`);
        if (res.ok && Array.isArray(res.data)) return res.data;
      }
      return [];
    } catch { return []; }
  }

  async function fetchDocuments() {
    try {
      const C = window.CineAura;
      if (!C || !C.supabaseRequest) return [];
      const res = await C.supabaseRequest(
        '/rest/v1/community_documents?' +
        'select=*&visibility=eq.public&order=views.desc,created_at.desc&limit=50'
      );
      return res.ok && Array.isArray(res.data) ? res.data : [];
    } catch { return []; }
  }

  /* ─────────────────── CARDS ─────────────────── */
  function thumbBlock(section, item, rank) {
    const initial = (item.title || '?').charAt(0).toUpperCase();
    const thumb = item.thumb || '';
    return `
      <div class="card-thumb">
        <div class="thumb-gradient" style="--c1:${section.c1};--c2:${section.c2}">
          ${thumb
            ? `<img src="${esc(thumb)}" alt="" loading="lazy" onerror="this.style.display='none'">`
            : `<span class="thumb-letter">${esc(initial)}</span>`}
        </div>
        ${rank < 3 ? `<span class="rank-badge">#${rank}</span>` : ''}
        ${badgeText(section.id, item)}
        <div class="card-play-overlay">${iconSvg('play')}</div>
      </div>`;
  }

  function badgeText(kind, item) {
    if (kind === 'videos') {
      const dur = Number(item.duration || 0);
      if (dur > 0) {
        const m = Math.floor(dur / 60), s = dur % 60;
        return `<span class="thumb-duration">${m}:${String(s).padStart(2, '0')}</span>`;
      }
      return '';
    }
    if (kind === 'articles') return `<span class="thumb-duration">${readMinutes(item.description || '')} د</span>`;
    if (kind === 'questions') return `<span class="thumb-duration">${Number(item.answers_count || 0)} إجابة</span>`;
    if (kind === 'documents') return `<span class="thumb-duration">${esc(String(item.kind || 'ملف').toUpperCase())}</span>`;
    return '';
  }

  function statRow(kind, item) {
    if (kind === 'videos') {
      return `
        <span class="stat">${iconSvg('eye')}${fmtNum(item.minutes || item.views || 0)}</span>
        <span class="stat">${iconSvg('like', 'ic ic-fill')}${fmtNum(item.likes || 0)}</span>`;
    }
    if (kind === 'articles') {
      return `<span class="stat">${iconSvg('eye')}${fmtNum(item.views || 0)}</span>`;
    }
    if (kind === 'questions') {
      return `
        <span class="stat">${iconSvg('eye')}${fmtNum(item.views || 0)}</span>
        <span class="stat">${iconSvg('message')}${fmtNum(item.answers_count || 0)}</span>`;
    }
    if (kind === 'documents') {
      return `
        <span class="stat">${iconSvg('eye')}${fmtNum(item.views || 0)}</span>
        <span class="stat">⬇ ${fmtNum(item.downloads || 0)}</span>`;
    }
    return '';
  }

  function pubRow(kind, item) {
    const name =
      kind === 'videos' ? (item.owner || item.owner_username || '') :
      kind === 'articles' ? (item.member_id ? 'ناشر #' + String(item.member_id).slice(0, 6) : 'ناشر') :
      kind === 'questions' ? (item.member_id ? 'سائل #' + String(item.member_id).slice(0, 6) : 'سائل') :
      kind === 'documents' ? fmtSize(item.size_bytes) :
      '';
    const avatar =
      kind === 'videos' ? '🎬' :
      kind === 'articles' ? '✍' :
      kind === 'questions' ? '❓' :
      kind === 'documents' ? '📄' : '•';
    return `
      <div class="card-pub">
        <span class="mini-avatar" style="background:${kind === 'videos' ? '#01b4e4' : kind === 'articles' ? '#f5a623' : kind === 'questions' ? '#a78bfa' : '#90cea1'}">${avatar}</span>
        <span class="card-pub-name">${esc(name)}</span>
      </div>`;
  }

  function detailHref(kind, item) {
    if (kind === 'videos')   return `./video.html?id=${encodeURIComponent(item.id)}`;
    if (kind === 'articles') return `./articles.html?id=${encodeURIComponent(item.id)}`;
    if (kind === 'questions') return `./answers.html?id=${encodeURIComponent(item.id)}`;
    if (kind === 'documents') return `./documents.html?id=${encodeURIComponent(item.id)}`;
    return '#';
  }

  function cardHtml(section, item, rank) {
    const href = detailHref(section.id, item);
    return `
      <article class="video-card" tabindex="0" role="link" aria-label="${esc(item.title || '')}"
               onclick="location.href='${href}'"
               onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();location.href='${href}'}">
        ${thumbBlock(section, item, rank)}
        <h3 class="card-title">${esc(item.title || 'بدون عنوان')}</h3>
        <div class="card-stats">${statRow(section.id, item)}</div>
        ${pubRow(section.id, item)}
      </article>`;
  }

  /* ─────────────────── RENDER ─────────────────── */
  function sectionShell(section) {
    return `
      <section class="section" data-section="${section.id}" aria-labelledby="h-${section.id}">
        <div class="section-head">
          <div class="section-title-group">
            <span class="section-badge" style="background:${section.color}">${iconSvg(section.icon)}</span>
            <h2 id="h-${section.id}">${esc(section.title)}</h2>
            <span class="section-count" data-count="${section.id}">…</span>
          </div>
          <div class="section-tools">
            <a class="btn btn-sm" href="${section.href}">عرض الكل →</a>
            <div class="carousel-controls">
              <button class="carousel-btn" data-dir="-1" aria-label="السابق">${iconSvg('chev-r')}</button>
              <button class="carousel-btn" data-dir="1" aria-label="التالي">${iconSvg('chev-l')}</button>
            </div>
          </div>
        </div>
        <div class="carousel">
          <div class="carousel-track" id="track-${section.id}" aria-busy="true">
            <div class="section-loading"><div class="spinner"></div><span>جارٍ التحميل…</span></div>
          </div>
        </div>
      </section>`;
  }

  async function loadSection(section) {
    const track = $('track-' + section.id);
    const countEl = document.querySelector(`[data-count="${section.id}"]`);
    if (!track) return;

    const fetcher = {
      videos: fetchVideos,
      articles: fetchArticles,
      questions: fetchQuestions,
      documents: fetchDocuments
    }[section.id];

    let items = [];
    try { items = await fetcher(); } catch { items = []; }

    track.removeAttribute('aria-busy');
    if (countEl) countEl.textContent = `${items.length} عنصر`;

    if (!items.length) {
      track.innerHTML = `<div class="section-empty">لا توجد عناصر بعد</div>`;
      return;
    }

    track.innerHTML = items.map((item, i) => cardHtml(section, item, i + 1)).join('');
  }

  function wireCarousels() {
    document.querySelectorAll('.carousel-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const section = btn.closest('.section');
        const track = section.querySelector('.carousel-track');
        if (!track) return;
        const amount = track.clientWidth * 0.85;
        const dir = +btn.dataset.dir;
        const isRTL = getComputedStyle(track).direction === 'rtl';
        track.scrollBy({ left: isRTL ? -dir * amount : dir * amount, behavior: 'smooth' });
      });
    });
  }

  function wireSearch() {
    const input = $('searchInput');
    const clear = $('searchClear');
    if (!input) return;
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        const q = input.value.trim();
        if (q) location.href = './search.html?q=' + encodeURIComponent(q);
      }
    });
    if (clear) {
      input.addEventListener('input', () => { clear.hidden = !input.value; });
      clear.addEventListener('click', () => { input.value = ''; clear.hidden = true; input.focus(); });
    }
  }

  async function init() {
    const container = $('sectionsContainer');
    if (!container) return;
    container.innerHTML = SECTIONS.map(sectionShell).join('');
    wireCarousels();
    wireSearch();
    // تحميل الأقسام بالتوازي
    await Promise.all(SECTIONS.map(loadSection));
  }

  document.addEventListener('DOMContentLoaded', init);
})();
</script>

<!-- ═════════════ THEME SYSTEM ═════════════ -->
<script id="artheme-js">
(function () {
  'use strict';
  if (window.__arthemeInited) return;
  window.__arthemeInited = true;

  try {
    var qs = new URLSearchParams(location.search);
    if (qs.get('reset-theme') === '1') {
      try { localStorage.removeItem('cineaura:style'); } catch (e) {}
      try { localStorage.removeItem('cineaura:theme'); } catch (e) {}
      qs.delete('reset-theme');
      var clean = location.pathname + (qs.toString() ? '?' + qs.toString() : '') + location.hash;
      location.replace(clean); return;
    }
  } catch (e) {}

  var THEMES = [
    { id:'default',   name:'CineAura',   accent:'#01b4e4' },
    { id:'facebook',  name:'Facebook',   accent:'#1877f2' },
    { id:'youtube',   name:'YouTube',    accent:'#ff0000' },
    { id:'instagram', name:'Instagram',  accent:'#d62976' },
    { id:'netflix',   name:'Netflix',    accent:'#e50914' },
    { id:'prime',     name:'Prime',      accent:'#00a8e1' },
    { id:'appletv',   name:'Apple TV+',  accent:'#2997ff' },
    { id:'win7',      name:'Windows 7',  accent:'#2a7bd8' },
    { id:'win8',      name:'Windows 8',  accent:'#0078d7' },
    { id:'win10',     name:'Windows 10', accent:'#0078d4' },
    { id:'win11',     name:'Windows 11', accent:'#0067c0' },
    { id:'macos',     name:'macOS',      accent:'#007aff' },
    { id:'android',   name:'Android',    accent:'#3ddc84' },
    { id:'ios',       name:'iOS',        accent:'#007aff' }
  ];
  var VALID = THEMES.map(function (t) { return t.id; });
  var STYLE_KEY = 'cineaura:style', MODE_KEY = 'cineaura:theme';
  var okS = function (v) { return VALID.indexOf(v) !== -1; };
  var okM = function (v) { return v === 'day' || v === 'night'; };
  var read = function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } };
  var save = function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} };
  var del  = function (k) { try { localStorage.removeItem(k); } catch (e) {} };

  function boot() {
    var root = document.documentElement;
    var s = read(STYLE_KEY), m = read(MODE_KEY);
    if (s && okS(s)) root.setAttribute('data-style', s);
    else if (s) del(STYLE_KEY);
    else if (!root.getAttribute('data-style')) root.setAttribute('data-style', 'default');

    if (m && okM(m)) root.setAttribute('data-theme', m);
    else if (m) del(MODE_KEY);
    else if (!root.getAttribute('data-theme')) {
      try { root.setAttribute('data-theme', matchMedia('(prefers-color-scheme: light)').matches ? 'day' : 'night'); }
      catch (e) { root.setAttribute('data-theme', 'night'); }
    }

    var hdrBtn = document.getElementById('themeBtn');
    function syncHdr() {
      if (!hdrBtn) return;
      var day = root.getAttribute('data-theme') === 'day';
      hdrBtn.textContent = day ? '☾' : '☀︎';
      hdrBtn.title = day ? 'التبديل إلى الوضع الليلي' : 'التبديل إلى الوضع النهاري';
    }
    syncHdr();
    if (hdrBtn) {
      hdrBtn.onclick = function () {
        var next = root.getAttribute('data-theme') === 'day' ? 'night' : 'day';
        root.setAttribute('data-theme', next);
        save(MODE_KEY, next);
        syncHdr();
        syncUI();
      };
    }

    var frag = document.createElement('div');
    frag.innerHTML =
      '<button type="button" id="artheme-btn" aria-label="تغيير المظهر" aria-expanded="false" aria-controls="artheme-panel">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
          '<circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/>' +
          '<circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/>' +
          '<circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/>' +
          '<circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/>' +
          '<path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/>' +
        '</svg>' +
        '<span class="at-dot" aria-hidden="true"></span>' +
      '</button>' +
      '<div id="artheme-panel" role="dialog" aria-label="إعدادات المظهر">' +
        '<div class="at-head"><h3>المظهر</h3><button type="button" class="at-close" aria-label="إغلاق">&times;</button></div>' +
        '<div class="at-mode" role="radiogroup" aria-label="وضع الألوان">' +
          '<button type="button" role="radio" data-mode="day" aria-checked="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>نهاري</button>' +
          '<button type="button" role="radio" data-mode="night" aria-checked="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>ليلي</button>' +
        '</div>' +
        '<div class="at-grid" role="radiogroup" aria-label="نمط الثيم"></div>' +
        '<div class="at-foot"><button type="button" class="at-reset">إعادة تعيين</button><span class="at-cur"></span></div>' +
      '</div>';
    while (frag.firstChild) document.body.appendChild(frag.firstChild);

    var btn = document.getElementById('artheme-btn');
    var panel = document.getElementById('artheme-panel');
    var grid = panel.querySelector('.at-grid');

    THEMES.forEach(function (t) {
      var card = document.createElement('button');
      card.type = 'button'; card.className = 'at-card';
      card.setAttribute('role', 'radio');
      card.setAttribute('aria-checked', 'false');
      card.dataset.style = t.id;
      card.style.setProperty('--at-accent', t.accent);
      card.innerHTML =
        '<span class="at-prev" aria-hidden="true">' +
          '<span class="at-prev-bar"><span class="at-prev-dot"></span><span class="at-prev-dot"></span><span class="at-prev-dot"></span></span>' +
          '<span class="at-prev-body">Aa</span>' +
        '</span>' +
        '<span class="at-name"></span>';
      card.querySelector('.at-name').textContent = t.name;
      grid.appendChild(card);
    });

    function curS() { return root.getAttribute('data-style') || 'default'; }
    function curM() { return root.getAttribute('data-theme') || 'night'; }

    function syncUI() {
      var s = curS(), m = curM();
      grid.querySelectorAll('.at-card').forEach(function (c) {
        c.setAttribute('aria-checked', c.dataset.style === s ? 'true' : 'false');
      });
      panel.querySelectorAll('.at-mode button').forEach(function (b) {
        b.setAttribute('aria-checked', b.dataset.mode === m ? 'true' : 'false');
      });
      var t = THEMES.filter(function (x) { return x.id === s; })[0];
      var dot = btn.querySelector('.at-dot');
      if (t && dot) dot.style.background = t.accent;
      var cur = panel.querySelector('.at-cur');
      if (cur) cur.textContent = 'الحالي: ' + (t ? t.name : 'CineAura') + ' · ' + (m === 'day' ? 'نهاري' : 'ليلي');
      syncHdr();
    }

    function applyStyle(id) {
      if (!okS(id)) return;
      root.setAttribute('data-style', id);
      save(STYLE_KEY, id);
      syncUI();
    }
    function applyMode(mode) {
      if (!okM(mode)) return;
      root.setAttribute('data-theme', mode);
      save(MODE_KEY, mode);
      syncUI();
    }
    function resetAll() {
      del(STYLE_KEY); del(MODE_KEY);
      root.setAttribute('data-style', 'default');
      root.setAttribute('data-theme', 'night');
      syncUI();
    }

    grid.addEventListener('click', function (e) {
      var card = e.target.closest('.at-card');
      if (card) applyStyle(card.dataset.style);
    });
    panel.querySelector('.at-mode').addEventListener('click', function (e) {
      var b = e.target.closest('button[data-mode]');
      if (b) applyMode(b.dataset.mode);
    });
    panel.querySelector('.at-reset').addEventListener('click', resetAll);

    var open = false;
    function openP()  { open = true;  panel.classList.add('open');  btn.setAttribute('aria-expanded', 'true');  syncUI(); }
    function closeP() { open = false; panel.classList.remove('open'); btn.setAttribute('aria-expanded', 'false'); }
    btn.addEventListener('click', function () { open ? closeP() : openP(); });
    panel.querySelector('.at-close').addEventListener('click', closeP);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && open) closeP(); });
    document.addEventListener('click', function (e) {
      if (!open) return;
      if (panel.contains(e.target) || btn.contains(e.target)) return;
      closeP();
    });

    syncUI();

    window.CineAuraTheme = {
      set: applyStyle, setMode: applyMode, reset: resetAll,
      list: THEMES.slice(),
      current: function () { return { style: curS(), mode: curM() }; }
    };
  }

  try { boot(); } catch (err) { console.error('[artheme] init failed:', err); }
})();
</script>

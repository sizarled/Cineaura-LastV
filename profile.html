<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- YouTube needs the site in the Referer of its player (else error 153): this policy wins over
       a stricter one a host or a CDN may add (Referrer-Policy: no-referrer or same-origin) -->
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <script src="js/prefs.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n-title="common.profileTitle">Profile — CineAura</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230d253f'/%3E%3Cpolygon points='26,18 48,32 26,46' fill='%2390cea1'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/profile.css" />
  <link rel="stylesheet" href="css/videos.css" />
  <link rel="stylesheet" href="css/market.css" />
  <link rel="stylesheet" href="css/facebook.css" />
  <link rel="stylesheet" href="css/mobile.css" />
  <link rel="stylesheet" href="css/documents.css" />
  <link rel="stylesheet" href="css/community.css" />
  <link rel="stylesheet" href="css/artheme.css" />
</head>
<body class="page-inner" data-auth-gate="note">
  <div class="bg-orbs" aria-hidden="true">
    <div class="orb orb-cyan"></div>
    <div class="orb orb-green"></div>
  </div>
  <div class="grain" aria-hidden="true"></div>
  <div class="site-wrap">
    <header class="header scrolled" id="site-header">
      <div class="header-inner">
        <a class="logo" href="./">
          <span class="logo-mark" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M4 2.5L13 8L4 13.5V2.5Z" fill="#90cea1"/></svg>
          </span>
          <span class="logo-word">Cine<span>Aura</span></span>
        </a>
        <nav class="nav" aria-label="Primary">
          <a href="./#movies" data-i18n="nav.movies">Movies</a>
          <a href="./#series" data-i18n="nav.series">Series</a>
          <a href="./#iptv" data-i18n="nav.iptv">IPTV</a>
          <a href="./#plans" data-i18n="nav.plansShort">Plans</a>
        </nav>
        <div class="auth auth-guest" id="auth-guest">
          <a class="btn btn-sm btn-ghost" href="./login.html" data-i18n="nav.signin">Sign In</a>
          <a class="btn btn-sm btn-primary" href="./register.html" data-i18n="nav.signup">Sign Up</a>
        </div>
        <div class="auth auth-user" id="auth-user">
          <div class="header-bell-wrap">
            <button class="header-bell-btn" id="header-bell-btn" type="button" aria-label="Notifications" data-i18n-aria="prof.notif">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
              <span class="header-bell-dot" id="header-bell-dot" hidden></span>
            </button>
            <div class="glass header-bell-panel" id="header-bell-panel" hidden></div>
          </div>
          <a class="btn btn-sm btn-primary" href="./dashboard.html" data-i18n="nav.dashboard">Dashboard</a>
          <button class="btn btn-sm btn-danger" id="logout-btn" type="button" data-i18n="nav.logout">Log Out</button>
        </div>
        <button class="hamburger" id="hamburger" type="button" data-i18n-aria="nav.openMenu" aria-label="Open menu"><span></span><span></span><span></span></button>
      </div>
    </header>
    <div class="mobile-menu" id="mobile-menu">
      <a href="./login.html" data-i18n="nav.signin">Sign In</a>
      <a href="./register.html" data-i18n="nav.signup">Sign Up</a>
      <a href="./dashboard.html" data-i18n="nav.dashboard">Dashboard</a>
    </div>
    <main class="page-main" id="prof-root"></main>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <button id="artheme-btn" class="auth-allow" type="button" aria-label="Appearance" data-i18n-aria="set.theme" aria-controls="artheme-panel" aria-haspopup="dialog" aria-expanded="false" title="Appearance">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/></svg>
    <span class="at-dot" aria-hidden="true"></span>
  </button>
  <aside id="artheme-panel" class="auth-allow" role="dialog" aria-labelledby="artheme-heading" aria-hidden="true" inert>
    <div class="at-head"><h3 id="artheme-heading" data-i18n="set.theme">Appearance</h3><button type="button" class="at-close" aria-label="Close" data-i18n-aria="common.close">&times;</button></div>
    <div class="at-mode" role="radiogroup" aria-label="Color mode">
      <button type="button" role="radio" data-mode="day" aria-checked="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg><span data-i18n="set.light">Light</span></button>
      <button type="button" role="radio" data-mode="night" aria-checked="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg><span data-i18n="set.dark">Dark</span></button>
    </div>
    <div class="at-grid" role="radiogroup" aria-label="Theme style" data-i18n-aria="set.style"></div>
    <div class="at-foot"><button type="button" class="at-reset">Reset</button><span class="at-cur" aria-live="polite"></span></div>
  </aside>
  <script src="js/i18n.js"></script>
  <script src="js/lang.js"></script>
  <script src="js/common.js"></script>
  <script src="js/streamtape.js"></script>
  <script src="js/post-rich.js"></script>
  <script src="js/videos.js"></script>
  <script src="js/content-studio.js"></script>
  <script src="js/market-forms.js"></script>
  <script src="js/community.js"></script>
  <script src="js/documents.js"></script>
  <script src="js/profile.js"></script>
  <script src="js/appearance-picker.js"></script>
</body>
</html>

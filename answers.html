<!DOCTYPE html>
<html lang="ar" dir="rtl" data-style="default" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الأسئلة والأجوبة — CineAura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Outfit:wght@400;600;750&display=swap" rel="stylesheet">
<style>
:root{--cyan:#01b4e4;--green:#90cea1;--text:#f4fbff;--muted:#9bb0c2;--line:rgba(145,196,220,.16);--sans:"Outfit","Cairo","Segoe UI",sans-serif;--ar:"Cairo","Outfit",sans-serif;--surface:rgba(9,22,36,.62);--hdr:rgba(7,18,30,.82);--input:rgba(4,14,24,.55);--sub:rgba(255,255,255,.05);--red:#ff6b6b;--shadow:0 24px 80px rgba(0,0,0,.42);--bg:linear-gradient(180deg,#08131e,#070f18 46%,#0a1826);--radius:18px}
html[data-theme="day"]{--text:#0d253f;--muted:#4a6578;--line:rgba(13,37,63,.12);--surface:rgba(255,255,255,.86);--hdr:rgba(255,255,255,.94);--input:rgba(255,255,255,.95);--sub:rgba(13,37,63,.05);--red:#d93025;--shadow:0 18px 48px rgba(13,37,63,.1);--bg:linear-gradient(180deg,#f4f8fb,#e8f1f6 48%,#dceaf3)}
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{min-height:100%;background:var(--bg);background-attachment:fixed;color:var(--text);font-family:var(--ar);font-size:15px;line-height:1.7;padding:104px 16px 60px}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(520px 320px at 85% 8%,rgba(1,180,228,.16),transparent 70%),radial-gradient(480px 300px at 10% 90%,rgba(144,206,161,.12),transparent 70%)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.header{position:fixed;top:calc(18px + env(safe-area-inset-top,0px));inset-inline:16px;z-index:20;max-width:1240px;margin:auto}
.header-inner{display:flex;align-items:center;gap:10px;padding:10px 16px;border:1px solid var(--line);border-radius:var(--radius);background:var(--hdr);backdrop-filter:blur(22px) saturate(150%);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.08)}
.logo{display:flex;align-items:center;gap:10px;margin-inline-end:auto}
.logo-mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(160deg,rgba(1,180,228,.28),rgba(144,206,161,.12));border:1px solid rgba(1,180,228,.35)}
.logo-mark svg{width:14px;height:14px;fill:var(--green)}
.logo-word{font-family:var(--sans);font-weight:750;font-size:18px;letter-spacing:-.04em}
.logo-word span{background:linear-gradient(90deg,var(--cyan),var(--green));-webkit-background-clip:text;background-clip:text;color:transparent}
.page-title{color:var(--muted);font-weight:600;font-size:14px}
.btn{border:1px solid var(--line);background:var(--sub);border-radius:12px;padding:8px 16px;font-weight:600;transition:.2s}
.btn:hover{border-color:rgba(1,180,228,.5);background:rgba(1,180,228,.08)}
.btn-primary{background:linear-gradient(90deg,#01b4e4,#2ec7ea 48%,#90cea1 160%);color:#032541;border:0;box-shadow:0 8px 24px rgba(1,180,228,.22)}
.btn-primary:hover{box-shadow:0 12px 30px rgba(1,180,228,.34);background:linear-gradient(90deg,#01b4e4,#2ec7ea 48%,#90cea1 160%)}
.btn-sm{padding:5px 12px;font-size:12.5px;border-radius:9px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);backdrop-filter:blur(22px) saturate(150%);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.08)}
input[type=text],input[type=url],input[type=number],input[type=datetime-local],select,textarea{width:100%;background:var(--input);border:1px solid var(--line);border-radius:12px;padding:9px 12px;outline:none;color-scheme:dark}
html[data-theme="day"] input,html[data-theme="day"] select,html[data-theme="day"] textarea{color-scheme:light}
input:focus,select:focus,textarea:focus{border-color:rgba(1,180,228,.5);box-shadow:0 0 0 4px rgba(1,180,228,.12)}
textarea{resize:vertical;min-height:84px}
label.f{display:block;font-size:13px;color:var(--muted);font-weight:600;margin:12px 0 5px}
label.f:first-of-type{margin-top:0}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.row{display:flex;gap:8px}.row>*{min-width:0}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.check input{accent-color:var(--cyan);width:17px;height:17px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(144,206,161,.12);color:var(--green);border:1px solid rgba(144,206,161,.18);border-radius:999px;padding:2px 10px;font-size:13px}
.chip button{border:0;background:none;color:inherit;font-size:16px;line-height:1}
.mini{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;background:var(--sub);border-radius:12px}
.seg button{border:0;background:none;border-radius:9px;padding:7px 4px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:inset 0 0 0 1px rgba(1,180,228,.5)}
.sub{margin-top:14px;padding-top:4px;display:none}.sub.show{display:block}
dialog{border:1px solid var(--line);border-radius:var(--radius);background:var(--hdr);color:var(--text);padding:22px;width:min(560px,94vw);max-height:90vh;overflow:auto;margin:auto;box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(3,10,18,.6);backdrop-filter:blur(4px)}
dialog h3{margin-bottom:12px}
.dlg-act{display:flex;gap:8px;justify-content:flex-start;margin-top:16px}
#toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));inset-inline:0;margin:auto;width:max-content;max-width:90vw;z-index:50;background:var(--hdr);border:1px solid var(--line);border-radius:12px;padding:10px 18px;box-shadow:var(--shadow);opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none}
#toast.on{opacity:1;transform:none}
.hidden{display:none!important}

/* ══════════ Q&A page ══════════ */
.wrap{max-width:940px;margin:0 auto;position:relative}
.qa-top{padding:14px 16px;display:grid;gap:12px;margin-bottom:18px}
.search{position:relative}
.search>svg{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;pointer-events:none}
.search input{padding-inline-start:38px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.fbtn{border:1px solid var(--line);background:var(--sub);border-radius:999px;padding:5px 14px;font-size:13px;font-weight:600;color:var(--muted);transition:.2s}
.fbtn:hover{color:var(--text);border-color:color-mix(in srgb,var(--cyan) 45%,transparent)}
.fbtn.on{background:color-mix(in srgb,var(--cyan) 16%,transparent);border-color:color-mix(in srgb,var(--cyan) 52%,transparent);color:color-mix(in srgb,var(--cyan) 82%,var(--text))}

.qgrid{display:grid;gap:14px}
.qcard{padding:18px;cursor:pointer;transition:border-color .2s,transform .2s,box-shadow .2s}
.qcard:hover{border-color:color-mix(in srgb,var(--cyan) 48%,transparent);transform:translateY(-2px)}
.qcard h2{font-size:17.5px;line-height:1.5;margin:8px 0 0}
.qcard .excerpt{color:var(--muted);font-size:13.5px;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;border:1px solid color-mix(in srgb,var(--cyan) 30%,transparent);background:color-mix(in srgb,var(--cyan) 12%,transparent);color:color-mix(in srgb,var(--cyan) 78%,var(--text))}
.tag.g{border-color:color-mix(in srgb,var(--green) 34%,transparent);background:color-mix(in srgb,var(--green) 14%,transparent);color:color-mix(in srgb,var(--green) 74%,var(--text))}
.tag.m{border-color:var(--line);background:var(--sub);color:var(--muted)}
.qmeta{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:12.5px;color:var(--muted);margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.qmeta .who{display:inline-flex;align-items:center;gap:7px;color:var(--text);font-weight:600}
.stat{display:inline-flex;align-items:center;gap:5px}
.stat svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.lvl{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px;background:color-mix(in srgb,var(--cyan) 16%,transparent);color:color-mix(in srgb,var(--cyan) 82%,var(--text));border:1px solid color-mix(in srgb,var(--cyan) 32%,transparent)}
.pts{font-size:11px;font-weight:700;color:color-mix(in srgb,var(--green) 72%,var(--text))}

.avatar{--h:200;width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;flex:none;font-size:10px;font-weight:700;color:#fff;letter-spacing:.02em;background:linear-gradient(135deg,hsl(var(--h) 72% 46%),hsl(calc(var(--h) + 45) 72% 58%));box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.avatar.lg{width:46px;height:46px;font-size:15px}

.empty{text-align:center;padding:52px 24px;color:var(--muted)}
.empty svg{width:46px;height:46px;stroke:var(--muted);fill:none;stroke-width:1.6;margin-bottom:12px}

/* question detail */
.back-btn{margin-bottom:14px}
.qfull{padding:22px clamp(16px,3vw,28px)}
.qfull-head{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.qfull-head h1{font-size:clamp(20px,2.6vw,26px);line-height:1.45;margin-top:8px}
.qfull .qmeta{margin-top:16px}
.qbody{margin-top:18px;font-size:16px;line-height:2}
.qbody p{margin:0 0 12px}
.ans-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:26px 0 14px}
.ans-head h2{font-size:18px}
.ans-head h2 span{color:var(--muted);font-size:15px;font-weight:600}
.ans-list{display:grid;gap:12px}
.answer{display:flex;gap:12px;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);backdrop-filter:blur(22px) saturate(150%);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.answer .body{flex:1;min-width:0}
.answer .who{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.answer .who b{color:var(--text);font-size:13.5px}
.answer .txt{margin-top:8px;font-size:15px;line-height:1.95;white-space:pre-wrap;word-break:break-word}
.answer .vis{font-size:10.5px;font-weight:700;padding:1px 8px;border-radius:999px;border:1px solid color-mix(in srgb,var(--cyan) 34%,transparent);background:color-mix(in srgb,var(--cyan) 13%,transparent);color:color-mix(in srgb,var(--cyan) 80%,var(--text))}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;align-items:center}
.act{border:1px solid var(--line);background:var(--sub);border-radius:9px;padding:4px 10px;font-size:12.5px;font-weight:600;display:inline-flex;gap:5px;align-items:center;color:var(--muted);transition:.18s}
.act svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.act:hover{color:var(--text);border-color:color-mix(in srgb,var(--cyan) 42%,transparent)}
.act.like.on{color:var(--cyan);border-color:color-mix(in srgb,var(--cyan) 55%,transparent);background:color-mix(in srgb,var(--cyan) 14%,transparent)}
.act.dis.on{color:var(--red);border-color:color-mix(in srgb,var(--red) 55%,transparent);background:color-mix(in srgb,var(--red) 12%,transparent)}
.act.rep.on{color:var(--red);border-color:color-mix(in srgb,var(--red) 45%,transparent);background:color-mix(in srgb,var(--red) 10%,transparent)}
.act:disabled{cursor:default;opacity:.75}
.act .date{margin-inline-start:auto;color:var(--muted);font-weight:500;font-size:11.5px;border:0;background:none;padding:0}

/* attachments */
.ans-att{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.afile{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:var(--sub);text-decoration:none;color:var(--text);font-size:12.5px;max-width:100%}
.afile:hover{border-color:color-mix(in srgb,var(--cyan) 48%,transparent)}
.afile .ico{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;background:var(--input);color:var(--cyan);flex:none}
.afile .ico svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.afile .nm{max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.afile small{color:var(--muted);font-size:10.5px}

.att-drop{display:block;padding:18px;text-align:center;border:2px dashed var(--line);border-radius:12px;color:var(--muted);font-size:13px;cursor:pointer;transition:border-color .2s,background .2s,color .2s}
.att-drop:hover,.att-drop.over{border-color:var(--cyan);background:color-mix(in srgb,var(--cyan) 8%,transparent);color:var(--text)}
.att-list{display:grid;gap:8px;margin-top:10px}
.att-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--sub)}
.att-item .ico{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:var(--input);flex:none;color:var(--cyan)}
.att-item .ico svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.att-item .info{flex:1;min-width:0}
.att-item .nm{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.att-item .sz{font-size:10.5px;color:var(--muted)}
.att-item .rm{border:0;background:transparent;color:var(--red);cursor:pointer;padding:5px;border-radius:6px;font-size:17px;line-height:1;display:grid;place-items:center}
.att-item .rm:hover{background:color-mix(in srgb,var(--red) 15%,transparent)}
.att-badge{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;padding:0 6px;border-radius:999px;background:var(--cyan);color:#fff;font-size:10.5px;font-weight:700}

@media(max-width:720px){
  .page-title{display:none}
  .answer{padding:14px}
  .qfull-head{flex-direction:column}
  .qfull-head .btn{width:100%}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="header"><div class="header-inner">
  <div class="logo"><span class="logo-mark"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span><span class="logo-word">Cine<span>Aura</span></span></div>
  <span class="page-title">الأسئلة والأجوبة</span>
  <button class="btn" id="themeBtn" aria-label="تبديل النهار والليل">☀︎</button>
  <button class="btn btn-primary" id="askBtn">اطرح سؤالًا</button>
</div></header>

<main class="wrap">

  <!-- ═══════════ LIST VIEW ═══════════ -->
  <section id="viewList">
    <div class="card qa-top">
      <div class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" id="qSearch" placeholder="ابحث في الأسئلة…" aria-label="بحث">
      </div>
      <div class="filters" id="fieldFilters"></div>
    </div>
    <div class="qgrid" id="qList"></div>
  </section>

  <!-- ═══════════ DETAIL VIEW ═══════════ -->
  <section id="viewDetail" class="hidden">
    <button class="btn back-btn" id="backBtn">→ العودة إلى الأسئلة</button>
    <article class="card qfull" id="qFull"></article>
    <div class="ans-head">
      <h2>الإجابات <span id="ansCount"></span></h2>
    </div>
    <div class="ans-list" id="answersList"></div>
  </section>

</main>

<!-- ═══════════ ANSWER DIALOG ═══════════ -->
<dialog id="ansDlg">
  <h3>إجابتك على السؤال</h3>

  <label class="f" for="ansText">نص الإجابة</label>
  <textarea id="ansText" rows="5" placeholder="اكتب إجابتك بوضوح…"></textarea>

  <label class="f">المرفقات <span class="att-badge" id="ansAttCount">0</span></label>
  <label class="att-drop" id="ansDrop">
    <input type="file" id="ansFile" multiple hidden accept="image/*,video/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.md,.csv,.rtf,.zip,.rar,.7z,.tar,.gz,.tgz,.bz2,.xz">
    <span>اسحب الملفات هنا أو اضغط للاختيار</span>
    <small style="display:block;margin-top:4px;color:var(--muted)">صور · فيديو · مستندات · ملفات مضغوطة</small>
  </label>
  <div class="att-list" id="ansAttList"></div>

  <label class="f">ظهور الإجابة</label>
  <div class="seg" id="ansVisSeg">
    <button class="on" data-v="public">عام</button>
    <button data-v="excl">حصري</button>
    <button data-v="priv">خاص</button>
  </div>
  <p class="hint" id="ansVisHint">تظهر الإجابة للجميع.</p>

  <div class="sub" id="ansExclSub">
    <label class="check"><input type="checkbox" id="aFol"> المتابعون فقط</label>
    <label class="f" for="aCSel">الدولة</label>
    <select id="aCSel"><option value="">إضافة دولة…</option></select>
    <div class="chips" id="aCChips"></div>
    <label class="f" for="aLSel">اللغة</label>
    <select id="aLSel"><option value="">إضافة لغة…</option></select>
    <div class="chips" id="aLChips"></div>
    <label class="f">المستوى LV (0 – 10)</label>
    <div class="row"><input type="number" id="aLvMin" min="0" max="10" value="0" aria-label="أدنى مستوى"><input type="number" id="aLvMax" min="0" max="10" value="10" aria-label="أعلى مستوى"></div>
    <label class="f" for="aTier">Balance tier (هذه الفئة فما فوق)</label>
    <select id="aTier"><option value="">بدون شرط</option></select>
  </div>

  <div class="sub" id="ansPrivSub">
    <label class="f" for="aUIn">إضافة مستخدم</label>
    <div class="row"><input type="text" id="aUIn" placeholder="@اسم_المستخدم"><button class="btn btn-sm" id="aUAdd">إضافة</button></div>
    <div class="chips" id="aUChips"></div>
    <label class="f" for="aPIn">كلمات سر الانضمام التلقائي</label>
    <div class="row"><input type="text" id="aPIn" dir="ltr" placeholder="كلمة سر" autocomplete="off"><button class="btn btn-sm" id="aPAdd">إضافة</button></div>
    <div class="mini"><button class="btn btn-sm" id="aPGen">توليد كلمة سر</button></div>
    <div class="chips" id="aPChips"></div>
    <p class="hint">من يدخل إحدى الكلمات ينضم تلقائيًا إلى القائمة.</p>
  </div>

  <div class="dlg-act">
    <button class="btn btn-primary" id="ansSend">نشر الإجابة</button>
    <button class="btn" id="ansCancel">إلغاء</button>
  </div>
</dialog>

<div id="toast" role="status"></div>

<script>
/* ══════════════ helpers ══════════════ */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),2400)}
function fmtDate(d){try{return new Date(d).toLocaleDateString("ar",{day:"numeric",month:"long",year:"numeric"})}catch(e){return d}}
function fmtSize(b){if(b<1024)return b+" بايت";if(b<1048576)return (b/1024).toFixed(1)+" ك.ب";if(b<1073741824)return (b/1048576).toFixed(1)+" م.ب";return (b/1073741824).toFixed(1)+" ج.ب"}
function hueOf(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%360;return h}
function avatarHTML(u,cls){
  const h=hueOf(u.name);
  const ini=u.name.replace(/^@/,"").split(/[\s_\-]+/).filter(Boolean).map(x=>x[0]).join("").slice(0,2).toUpperCase();
  return `<span class="avatar ${cls||""}" style="--h:${h}" aria-hidden="true">${esc(ini)}</span>`;
}
const ATT_PATHS={

let current=null, filterField="الكل", searchTerm="";

/* ══════════════ list view ══════════════ */
function excerptOf(html){const d=document.createElement("div");d.innerHTML=html;return (d.textContent||"").trim()}
function tagsFor(q){
  let h=`<span class="tag">${esc(q.field)}</span>`;
  if(q.niche)h+=`<span class="tag g">${esc(q.niche)}</span>`;
  if(q.micro)h+=`<span class="tag m">${esc(q.micro)}</span>`;
  if(q.nano)h+=`<span class="tag m">${esc(q.nano)}</span>`;
  return h;
}
function buildFilters(){
  const fields=["الكل",...new Set(QUESTIONS.map(q=>q.field))];
  $("fieldFilters").innerHTML=fields.map(f=>`<button class="fbtn${f===filterField?" on":""}" data-f="${esc(f)}">${esc(f)}</button>`).join("");
}
function renderList(){
  const term=searchTerm.trim().toLowerCase();
  const list=QUESTIONS.filter(q=>{
    const okF=filterField==="الكل"||q.field===filterField;
    const okS=!term||(q.title+" "+excerptOf(q.body)+" "+q.user.name).toLowerCase().includes(term);
    return okF&&okS;
  });
  if(!list.length){
    $("qList").innerHTML=`<div class="card empty">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <p>لا توجد أسئلة مطابقة لبحثك.</p></div>`;
    return;
  }
  $("qList").innerHTML=list.map(q=>`
    <article class="card qcard" data-id="${q.id}" tabindex="0" role="button" aria-label="${esc(q.title)}">
      <div class="tags">${tagsFor(q)}</div>
      <h2>${esc(q.title)}</h2>
      <p class="excerpt">${esc(excerptOf(q.body))}</p>
      <div class="qmeta">
        <span class="who">${avatarHTML(q.user)} ${esc(q.user.name)} <span class="lvl">LV ${q.user.level}</span> <span class="pts">${q.user.points} نقطة</span></span>
        <span class="stat">${ICON.users} ${q.followers} متابع</span>
        <span class="stat">${ICON.chat} ${q.answers.length} إجابة</span>
        <span class="stat">${ICON.cal} ${fmtDate(q.date)}</span>
      </div>
    </article>`).join("");
}
$("qList").addEventListener("click",e=>{
  const card=e.target.closest(".qcard");
  if(card)openQuestion(card.dataset.id);
});
$("qList").addEventListener("keydown",e=>{
  const card=e.target.closest(".qcard");
  if(card&&(e.key==="Enter"||e.key===" ")){e.preventDefault();openQuestion(card.dataset.id)}
});
$("fieldFilters").addEventListener("click",e=>{
  const b=e.target.closest(".fbtn");if(!b)return;
  filterField=b.dataset.f;
  $("fieldFilters").querySelectorAll(".fbtn").forEach(x=>x.classList.toggle("on",x===b));
  renderList();
});
$("qSearch").addEventListener("input",e=>{searchTerm=e.target.value;renderList()});

/* ══════════════ detail view ══════════════ */
function openQuestion(id){
  current=QUESTIONS.find(q=>q.id===id);
  if(!current)return;
  renderDetail();
  $("viewList").classList.add("hidden");
  $("viewDetail").classList.remove("hidden");
  window.scrollTo({top:0,behavior:"instant"});
}
function showList(){
  $("viewDetail").classList.add("hidden");
  $("viewList").classList.remove("hidden");
  current=null;
  renderList();
  window.scrollTo({top:0,behavior:"instant"});
}
$("backBtn").onclick=showList;

function renderDetail(){
  const q=current;
  $("qFull").innerHTML=`
    <div class="qfull-head">
      <div style="min-width:0;flex:1">
        <div class="tags">${tagsFor(q)}</div>
        <h1>${esc(q.title)}</h1>
      </div>
      <button class="btn btn-primary" id="ansBtn">✎ أجب على السؤال</button>
    </div>
    <div class="qmeta">
      <span class="who">${avatarHTML(q.user)} ${esc(q.user.name)} <span class="lvl">LV ${q.user.level}</span> <span class="pts">${q.user.points} نقطة</span></span>
      <span class="stat">${ICON.users} ${q.followers} متابع</span>
      <span class="stat">${ICON.chat} ${q.answers.length} إجابة</span>
      <span class="stat">${ICON.cal} ${fmtDate(q.date)}</span>
    </div>
    <div class="qbody">${q.body}</div>`;
  renderAnswers();
}
$("qFull").addEventListener("click",e=>{
  if(e.target.closest("#ansBtn"))openAnswerDlg();
});

function attachmentsHTML(list){
  if(!list||!list.length)return "";
  return `<div class="ans-att">${list.map(f=>`
    <a class="afile" href="${f.url||"#"}" ${f.url?"download":'onclick="event.preventDefault()"'}>
      <span class="ico">${attIcon(f.type)}</span>
      <span class="nm">${esc(f.name)}</span>
      <small>${fmtSize(f.size)}</small>
    </a>`).join("")}</div>`;
}
function renderAnswers(){
  const q=current;
  $("ansCount").textContent=`(${q.answers.length})`;
  if(!q.answers.length){
    $("answersList").innerHTML=`<div class="card empty"><p>لا توجد إجابات بعد. كن أول من يجيب!</p></div>`;
    return;
  }
  $("answersList").innerHTML=q.answers.map(a=>`
    <article class="answer" data-id="${a.id}">
      ${avatarHTML(a.user,"lg")}
      <div class="body">
        <div class="who">
          <b>${esc(a.user.name)}</b>
          <span class="lvl">LV ${a.user.level}</span>
          <span class="pts">${a.user.points} نقطة</span>
          ${a.visibility==="excl"?'<span class="vis">حصري</span>':a.visibility==="priv"?'<span class="vis">خاص</span>':""}
          <span style="margin-inline-start:auto;font-size:11.5px">${fmtDate(a.date)}</span>
        </div>
        <div class="txt">${esc(a.text)}</div>
        ${attachmentsHTML(a.attachments)}
        <div class="acts">
          <button class="act like${a.liked?" on":""}" data-act="like" aria-pressed="${!!a.liked}">${ICON.up}<span>${a.likes}</span></button>
          <button class="act dis${a.disliked?" on":""}" data-act="dislike" aria-pressed="${!!a.disliked}">${ICON.down}<span>${a.dislikes}</span></button>
          <button class="act rep${a.reported?" on":""}" data-act="report" aria-pressed="${!!a.reported}">${ICON.flag}<span>${a.reports}</span></button>
        </div>
      </div>
    </article>`).join("");
}
$("answersList").addEventListener("click",e=>{
  const btn=e.target.closest("[data-act]");
  if(!btn||!current)return;
  const card=btn.closest(".answer");
  const a=current.answers.find(x=>x.id===card.dataset.id);
  if(!a)return;
  const act=btn.dataset.act;
  if(act==="like"){
    if(a.liked){a.liked=false;a.likes=Math.max(0,a.likes-1)}
    else{a.liked=true;a.likes++;if(a.disliked){a.disliked=false;a.dislikes=Math.max(0,a.dislikes-1)}}
  }else if(act==="dislike"){
    if(a.disliked){a.disliked=false;a.dislikes=Math.max(0,a.dislikes-1)}
    else{a.disliked=true;a.dislikes++;if(a.liked){a.liked=false;a.likes=Math.max(0,a.likes-1)}}
  }else if(act==="report"){
    if(a.reported){toast("أرسلت بلاغًا عن هذه الإجابة مسبقًا");return}
    a.reported=true;a.reports++;
    toast("تم إرسال البلاغ، شكرًا لمساعدتك");
  }
  renderAnswers();
});

function fileType(f){
  const m=f.type||"",n=(f.name||"").toLowerCase();
  if(m.startsWith("image/"))return "image";
  if(m.startsWith("video/"))return "video";
  if(/\.(zip|rar|7z|tar|gz|tgz|bz2|xz)$/.test(n))return "archive";
  return "doc";
}

  const list=$("ansAttList");
  list.innerHTML=AS.files.map(f=>`
    <div class="att-item" data-id="${f.id}">
      <span class="ico">${attIcon(f.type)}</span>
      <span class="info"><span class="nm">${esc(f.name)}</span><span class="sz">${fmtSize(f.size)}</span></span>
      <button class="rm" title="حذف" aria-label="حذف">×</button>
    </div>`).join("");
  list.querySelectorAll(".rm").forEach(b=>{
    b.onclick=()=>{
      const id=b.closest(".att-item").dataset.id;
      const i=AS.files.findIndex(x=>x.id===id);
      if(i>-1)AS.files.splice(i,1);
      renderAnsAtt();
    };
  });
}
function addAnsFile(file){
  if(file.size>25*1024*1024)toast("الملف كبير (>25 م.ب) — قد يتأخر التحميل");
  const id="f"+Date.now()+Math.random().toString(36).slice(2,7);
  const r=new FileReader();
  r.onload=()=>{
    AS.files.push({id,name:file.name,size:file.size,type:fileType(file),url:r.result});
    renderAnsAtt();
  };
  r.readAsDataURL(file);
}
$("ansFile").onchange=e=>{
  const fs=e.target.files;
  if(fs)for(const f of fs)addAnsFile(f);
  e.target.value="";
};
const ansDrop=$("ansDrop");
["dragenter","dragover"].forEach(ev=>ansDrop.addEventListener(ev,e=>{e.preventDefault();ansDrop.classList.add("over")}));
["dragleave","drop"].forEach(ev=>ansDrop.addEventListener(ev,e=>{e.preventDefault();ansDrop.classList.remove("over")}));
ansDrop.addEventListener("drop",e=>{
  const fs=e.dataTransfer.files;
  if(fs)for(const f of fs)addAnsFile(f);
});

function openAnswerDlg(){
  AS.vis="public";AS.countries=[];AS.langs=[];AS.users=[];AS.pass=[];AS.files=[];
  $("ansText").value="";
  $("aFol").checked=false;
  $("aLvMin").value=0;$("aLvMax").value=10;$("aTier").value="";
  $("ansVisSeg").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x.dataset.v==="public"));
  $("ansExclSub").classList.remove("show");
  $("ansPrivSub").classList.remove("show");
  $("ansVisHint").textContent=HINTS.public;
  chips($("aCChips"),AS.countries);chips($("aLChips"),AS.langs);
  chips($("aUChips"),AS.users);chips($("aPChips"),AS.pass);
  renderAnsAtt();
  $("ansDlg").showModal();
  setTimeout(()=>$("ansText").focus(),50);
}
$("ansCancel").onclick=()=>$("ansDlg").close();

$("ansSend").onclick=()=>{
  const txt=$("ansText").value.trim();
  if(!txt&&!AS.files.length)return toast("اكتب إجابتك أو أرفق ملفًا");
  if(AS.vis==="priv"&&!AS.users.length&&!AS.pass.length)return toast("أضف مستخدمًا أو كلمة سر واحدة على الأقل");
  const ans={
    id:"a"+Date.now(),
    user:{name:"@أنت",level:5,points:980},
    text:txt||"‏(مرفقات مرفقة)",
    likes:0,dislikes:0,reports:0,
    date:new Date().toISOString(),
    visibility:AS.vis,
    attachments:AS.files.map(f=>({name:f.name,size:f.size,type:f.type,url:f.url}))
  };
  current.answers.unshift(ans);
  $("ansDlg").close();
  renderDetail();
  toast("تم نشر إجابتك بنجاح");
};

/* ══════════════ theme ══════════════ */
$("themeBtn").onclick=()=>{
  const h=document.documentElement,d=h.dataset.theme==="day";
  h.dataset.theme=d?"night":"day";
  $("themeBtn").textContent=d?"☀︎":"☾";
  try{localStorage.setItem("cineaura:theme",h.dataset.theme)}catch(e){}
};
if(matchMedia("(prefers-color-scheme: light)").matches){
  document.documentElement.dataset.theme="day";
  $("themeBtn").textContent="☾";
}

$("askBtn").onclick=()=>toast("افتح صفحة «محرر الأسئلة» لطرح سؤال جديد");

/* ══════════════ init ══════════════ */
buildFilters();
renderList();
</script>

<style id="artheme-contrast">
html { --green-ink: var(--green); }
html[data-style="default"][data-theme="day"]   { --green-ink: #2a6b3e; }
html[data-style="facebook"][data-theme="day"]  { --green-ink: #2a6b1f; }
html[data-style="youtube"][data-theme="day"]   { --green-ink: #1a6b28; }
html[data-style="instagram"][data-theme="day"] { --green-ink: #2a5c1a; }
html[data-style="netflix"][data-theme="day"]   { --green-ink: #1e6b32; }
html[data-style="prime"][data-theme="day"]     { --green-ink: #1a6b5e; }
html[data-style="appletv"][data-theme="day"]   { --green-ink: #1e6b32; }
html[data-style="macos"][data-theme="day"]     { --green-ink: #1e6b32; }
html[data-style="android"][data-theme="day"]   { --green-ink: #2a5c2a; }
html[data-style="ios"][data-theme="day"]       { --green-ink: #1e6b32; }
.logo-word span {
  background-image: linear-gradient(90deg, var(--cyan), var(--green));
  background-image: linear-gradient(90deg, var(--cyan), var(--green-ink));
  -webkit-background-clip: text !important;
  background-clip: text !important;
  color: transparent !important;
}
.chip {
  background: color-mix(in srgb, var(--green) 16%, transparent);
  border-color: color-mix(in srgb, var(--green) 32%, transparent);
}
.chip button { color: inherit; opacity: .85; }
.chip button:hover { opacity: 1; }
.seg button.on {
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--cyan) 60%, transparent);
}
.hint { color: color-mix(in srgb, var(--muted) 85%, var(--text)); }
.page-title { color: color-mix(in srgb, var(--muted) 85%, var(--text)); }
.att-badge { background: var(--cyan); }
</style>

<script id="artheme-js">
(function () {
  'use strict';
  if (window.__arthemeInited) return;
  window.__arthemeInited = true;

  try {
    var qs = new URLSearchParams(location.search);
    if (qs.get('reset-theme') === '1') {
      try { localStorage.removeItem('cineaura:style'); } catch (e) {}
      try { localStorage.removeItem('cineaura:theme'); } catch (e) {}
      qs.delete('reset-theme');
      var clean = location.pathname + (qs.toString() ? '?' + qs.toString() : '') + location.hash;
      location.replace(clean); return;
    }
  } catch (e) {}

  var THEMES = [
    { id:'default',   name:'CineAura',   accent:'#01b4e4' },
    { id:'facebook',  name:'Facebook',   accent:'#1877f2' },
    { id:'youtube',   name:'YouTube',    accent:'#ff0000' },
    { id:'instagram', name:'Instagram',  accent:'#d62976' },
    { id:'netflix',   name:'Netflix',    accent:'#e50914' },
    { id:'prime',     name:'Prime',      accent:'#00a8e1' },
    { id:'appletv',   name:'Apple TV+',  accent:'#2997ff' },
    { id:'win7',      name:'Windows 7',  accent:'#2a7bd8' },
    { id:'win8',      name:'Windows 8',  accent:'#0078d7' },
    { id:'win10',     name:'Windows 10', accent:'#0078d4' },
    { id:'win11',     name:'Windows 11', accent:'#0067c0' },
    { id:'macos',     name:'macOS',      accent:'#007aff' },
    { id:'android',   name:'Android',    accent:'#3ddc84' },
    { id:'ios',       name:'iOS',        accent:'#007aff' }
  ];
  var VALID = THEMES.map(function (t) { return t.id; });
  var STYLE_KEY = 'cineaura:style';
  var MODE_KEY  = 'cineaura:theme';
  var okS = function (v) { return VALID.indexOf(v) !== -1; };
  var okM = function (v) { return v === 'day' || v === 'night'; };
  var read = function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } };
  var save = function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} };
  var del  = function (k) { try { localStorage.removeItem(k); } catch (e) {} };

  function boot() {
    var root = document.documentElement;

    var s = read(STYLE_KEY), m = read(MODE_KEY);
    if (s && okS(s)) { root.setAttribute('data-style', s); }
    else if (s) { del(STYLE_KEY); }
    else if (!root.getAttribute('data-style')) { root.setAttribute('data-style', 'default'); }

    if (m && okM(m)) { root.setAttribute('data-theme', m); }
    else if (m) { del(MODE_KEY); }
    else if (!root.getAttribute('data-theme')) {
      try { root.setAttribute('data-theme',
        matchMedia('(prefers-color-scheme: light)').matches ? 'day' : 'night'); }
      catch (e) { root.setAttribute('data-theme', 'night'); }
    }

    var hdrBtn = document.getElementById('themeBtn');
    function syncHdr() {
      if (!hdrBtn) return;
      var day = root.getAttribute('data-theme') === 'day';
      hdrBtn.textContent = day ? '☾' : '☀︎';
      hdrBtn.title = day ? 'التبديل إلى الوضع الليلي' : 'التبديل إلى الوضع النهاري';
    }
    syncHdr();
    if (hdrBtn) {
      hdrBtn.onclick = function () {
        var next = root.getAttribute('data-theme') === 'day' ? 'night' : 'day';
        root.setAttribute('data-theme', next);
        save(MODE_KEY, next);
        syncHdr();
        syncUI();
      };
    }

    var frag = document.createElement('div');
    frag.innerHTML =
      '<button type="button" id="artheme-btn" aria-label="تغيير المظهر" aria-expanded="false" aria-controls="artheme-panel">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
          '<circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/>' +
          '<circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/>' +
          '<circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/>' +
          '<circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/>' +
          '<path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/>' +
        '</svg>' +
        '<span class="at-dot" aria-hidden="true"></span>' +
      '</button>' +
      '<div id="artheme-panel" role="dialog" aria-label="إعدادات المظهر">' +
        '<div class="at-head"><h3>المظهر</h3><button type="button" class="at-close" aria-label="إغلاق">&times;</button></div>' +
        '<div class="at-mode" role="radiogroup" aria-label="وضع الألوان">' +
          '<button type="button" role="radio" data-mode="day" aria-checked="false">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>' +
            'نهاري</button>' +
          '<button type="button" role="radio" data-mode="night" aria-checked="false">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>' +
            'ليلي</button>' +
        '</div>' +
        '<div class="at-grid" role="radiogroup" aria-label="نمط الثيم"></div>' +
        '<div class="at-foot">' +
          '<button type="button" class="at-reset">إعادة تعيين</button>' +
          '<span class="at-cur"></span>' +
        '</div>' +
      '</div>';
    while (frag.firstChild) document.body.appendChild(frag.firstChild);

    var btn   = document.getElementById('artheme-btn');
    var panel = document.getElementById('artheme-panel');
    var grid  = panel.querySelector('.at-grid');

    THEMES.forEach(function (t) {
      var card = document.createElement('button');
      card.type = 'button'; card.className = 'at-card';
      card.setAttribute('role', 'radio');
      card.setAttribute('aria-checked', 'false');
      card.dataset.style = t.id;
      card.style.setProperty('--at-accent', t.accent);
      card.innerHTML =
        '<span class="at-prev" aria-hidden="true">' +
          '<span class="at-prev-bar">' +
            '<span class="at-prev-dot"></span><span class="at-prev-dot"></span><span class="at-prev-dot"></span>' +
          '</span>' +
          '<span class="at-prev-body">Aa</span>' +
        '</span>' +
        '<span class="at-name"></span>';
      card.querySelector('.at-name').textContent = t.name;
      grid.appendChild(card);
    });

    function curS() { return root.getAttribute('data-style') || 'default'; }
    function curM() { return root.getAttribute('data-theme') || 'night'; }

    function syncUI() {
      var s = curS(), m = curM();
      grid.querySelectorAll('.at-card').forEach(function (c) {
        c.setAttribute('aria-checked', c.dataset.style === s ? 'true' : 'false');
      });
      panel.querySelectorAll('.at-mode button').forEach(function (b) {
        b.setAttribute('aria-checked', b.dataset.mode === m ? 'true' : 'false');
      });
      var t = THEMES.filter(function (x) { return x.id === s; })[0];
      var dot = btn.querySelector('.at-dot');
      if (t && dot) dot.style.background = t.accent;
      var cur = panel.querySelector('.at-cur');
      if (cur) cur.textContent = 'الحالي: ' + (t ? t.name : 'CineAura') + ' · ' + (m === 'day' ? 'نهاري' : 'ليلي');
      syncHdr();
    }

    function applyStyle(id) {
      if (!okS(id)) return;
      root.setAttribute('data-style', id);
      save(STYLE_KEY, id);
      syncUI();
    }
    function applyMode(mode) {
      if (!okM(mode)) return;
      root.setAttribute('data-theme', mode);
      save(MODE_KEY, mode);
      syncUI();
    }
    function resetAll() {
      del(STYLE_KEY); del(MODE_KEY);
      root.setAttribute('data-style', 'default');
      root.setAttribute('data-theme', 'night');
      syncUI();
    }

    grid.addEventListener('click', function (e) {
      var card = e.target.closest('.at-card');
      if (card) applyStyle(card.dataset.style);
    });
    panel.querySelector('.at-mode').addEventListener('click', function (e) {
      var b = e.target.closest('button[data-mode]');
      if (b) applyMode(b.dataset.mode);
    });
    panel.querySelector('.at-reset').addEventListener('click', resetAll);

    var open = false;
    function openP()  { open = true;  panel.classList.add('open');  btn.setAttribute('aria-expanded', 'true');  syncUI(); }
    function closeP() { open = false; panel.classList.remove('open'); btn.setAttribute('aria-expanded', 'false'); }
    btn.addEventListener('click', function () { open ? closeP() : openP(); });
    panel.querySelector('.at-close').addEventListener('click', closeP);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && open) closeP(); });
    document.addEventListener('click', function (e) {
      if (!open) return;
      if (panel.contains(e.target) || btn.contains(e.target)) return;
      closeP();
    });

    syncUI();

    window.CineAuraTheme = {
      set: applyStyle, setMode: applyMode, reset: resetAll,
      list: THEMES.slice(),
      current: function () { return { style: curS(), mode: curM() }; }
    };
  }

  try { boot(); }
  catch (err) { console.error('[artheme] init failed:', err); }
})();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl" data-style="default" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>عرض المقال — CineAura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Outfit:wght@400;600;750&display=swap" rel="stylesheet">
<style>
/* ── المتغيرات الأساسية ── */
:root{--cyan:#01b4e4;--green:#90cea1;--text:#f4fbff;--muted:#9bb0c2;--line:rgba(145,196,220,.16);--sans:"Outfit","Cairo","Segoe UI",sans-serif;--ar:"Cairo","Outfit",sans-serif;--surface:rgba(9,22,36,.62);--hdr:rgba(7,18,30,.82);--input:rgba(4,14,24,.55);--sub:rgba(255,255,255,.05);--red:#ff6b6b;--shadow:0 24px 80px rgba(0,0,0,.42);--bg:linear-gradient(180deg,#08131e,#070f18 46%,#0a1826);--radius:18px}
html[data-theme="day"]{--text:#0d253f;--muted:#4a6578;--line:rgba(13,37,63,.12);--surface:rgba(255,255,255,.86);--hdr:rgba(255,255,255,.94);--input:rgba(255,255,255,.95);--sub:rgba(13,37,63,.05);--red:#d93025;--shadow:0 18px 48px rgba(13,37,63,.1);--bg:linear-gradient(180deg,#f4f8fb,#e8f1f6 48%,#dceaf3)}

*{box-sizing:border-box;margin:0;padding:0}
html{height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);scroll-behavior:smooth}
body{min-height:100%;background:var(--bg);background-attachment:fixed;color:var(--text);font-family:var(--ar);font-size:16px;line-height:1.8;padding:104px 16px 48px}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(520px 320px at 85% 8%,rgba(1,180,228,.16),transparent 70%),radial-gradient(480px 300px at 10% 90%,rgba(144,206,161,.12),transparent 70%)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
a{color:var(--cyan);text-decoration:none}

/* ── الهيدر ── */
.header{position:fixed;top:calc(18px + env(safe-area-inset-top,0px));inset-inline:16px;z-index:20;max-width:1240px;margin:auto}
.header-inner{display:flex;align-items:center;gap:10px;padding:10px 16px;border:1px solid var(--line);border-radius:var(--radius);background:var(--hdr);backdrop-filter:blur(22px) saturate(150%);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.08)}
.logo{display:flex;align-items:center;gap:10px;margin-inline-end:auto}
.logo-mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(160deg,rgba(1,180,228,.28),rgba(144,206,161,.12));border:1px solid rgba(1,180,228,.35)}
.logo-mark svg{width:14px;height:14px;fill:var(--green)}
.logo-word{font-family:var(--sans);font-weight:750;font-size:18px;letter-spacing:-.04em}
.logo-word span{background:linear-gradient(90deg,var(--cyan),var(--green));-webkit-background-clip:text;background-clip:text;color:transparent}
.btn{border:1px solid var(--line);background:var(--sub);border-radius:12px;padding:8px 16px;font-weight:600;transition:.2s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:rgba(1,180,228,.5);background:rgba(1,180,228,.08)}
.btn-primary{background:linear-gradient(90deg,#01b4e4,#2ec7ea 48%,#90cea1 160%);color:#032541;border:0;box-shadow:0 8px 24px rgba(1,180,228,.22)}
.btn-primary:hover{box-shadow:0 12px 30px rgba(1,180,228,.34);background:linear-gradient(90deg,#01b4e4,#2ec7ea 48%,#90cea1 160%)}

/* ── التخطيط ── */
.layout{max-width:1240px;margin:auto;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start;position:relative}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);backdrop-filter:blur(22px) saturate(150%);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.08)}
.article-main{padding:clamp(20px,4vw,48px);overflow:hidden}
.article-sidebar{display:grid;gap:16px;position:sticky;top:100px}

/* ── محتوى المقال ── */
.art-meta{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin-bottom:14px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;background:rgba(144,206,161,.12);color:var(--green);border:1px solid rgba(144,206,161,.18);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600}
.art-title{font-size:clamp(28px,4vw,42px);line-height:1.3;font-weight:700;margin-bottom:16px;letter-spacing:-.02em}
.art-desc{font-size:18px;color:var(--muted);margin-bottom:24px;line-height:1.6;border-inline-start:3px solid var(--cyan);padding-inline-start:14px}
.art-cover{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:14px;margin-bottom:28px;border:1px solid var(--line)}
.art-body{font-size:17px;line-height:2;word-break:break-word}
.art-body h2{font-size:26px;margin:28px 0 12px}
.art-body h3{font-size:22px;margin:22px 0 10px}
.art-body p{margin-bottom:16px}
.art-body a{font-weight:600;text-decoration:underline;text-underline-offset:3px}
.art-body blockquote{border-inline-start:3px solid var(--cyan);background:rgba(1,180,228,.08);padding:14px 18px;border-radius:10px;margin:20px 0;font-style:italic}
.art-body img,.art-body video,.art-body iframe{max-width:100%;border-radius:12px;display:block;margin:20px auto}
.art-body iframe{width:100%;aspect-ratio:16/9;border:0}
.art-body ul,.art-body ol{padding-inline-start:26px;margin-bottom:16px}

/* ── أزرار التفاعل (المقال) ── */
.action-bar{display:flex;flex-wrap:wrap;gap:10px;padding:20px 0;margin:30px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.act-btn{display:inline-flex;align-items:center;gap:8px;background:var(--sub);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:14px;font-weight:600;color:var(--muted);transition:.2s}
.act-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.act-btn:hover{border-color:var(--cyan);color:var(--text);background:rgba(1,180,228,.08)}
.act-btn.active{background:rgba(1,180,228,.16);border-color:var(--cyan);color:var(--cyan)}
.act-btn.danger:hover{border-color:var(--red);background:rgba(255,80,80,.1);color:var(--red)}

/* ── كرت الناشر ── */
.author-box{display:flex;align-items:flex-start;gap:16px;padding:20px;background:var(--sub);border:1px solid var(--line);border-radius:16px;margin-bottom:30px}
.author-avatar{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid var(--cyan);flex-shrink:0}
.author-info{flex:1}
.author-name-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.author-name{font-weight:700;font-size:18px;color:var(--text)}
.author-badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:rgba(1,180,228,.15);color:var(--cyan);border:1px solid rgba(1,180,228,.3)}
.author-rank{font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;background:linear-gradient(90deg,rgba(255,215,0,.15),rgba(255,140,0,.15));color:#ffb347;border:1px solid rgba(255,179,71,.3)}
.author-bio{font-size:14px;color:var(--muted);line-height:1.6;margin-top:6px}
.btn-follow{background:var(--cyan);color:#032541;border:0;padding:6px 16px;border-radius:999px;font-weight:700;font-size:13px;margin-top:8px;cursor:pointer}

/* ── التعليقات ── */
.comments-section{margin-top:20px}
.comments-title{font-size:20px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.comments-title .cnt{font-size:14px;color:var(--muted);font-weight:400}
.comment-form{display:flex;gap:10px;margin-bottom:24px}
.comment-form input{flex:1;background:var(--input);border:1px solid var(--line);border-radius:12px;padding:12px 16px;outline:none}
.comment-form input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(1,180,228,.12)}
.comment-list{display:grid;gap:16px}
.comment-item{display:flex;gap:12px}
.comment-avatar{width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;color:var(--muted);flex-shrink:0}
.comment-avatar.you{background:var(--cyan);color:#fff;border-color:var(--cyan)}
.comment-body{flex:1;min-width:0}
.comment-content{background:var(--sub);padding:12px 16px;border-radius:12px;border:1px solid var(--line)}
.comment-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:10px}
.comment-user{font-weight:700;font-size:14px}
.comment-date{font-size:12px;color:var(--muted);flex-shrink:0}
.comment-text{font-size:14px;line-height:1.6;word-break:break-word}
.comment-actions{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px;padding-top:8px;border-top:1px solid var(--line)}
.c-act{display:inline-flex;align-items:center;gap:4px;background:transparent;border:1px solid transparent;border-radius:8px;padding:4px 8px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;transition:.15s;font-family:inherit}
.c-act svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.c-act:hover{background:var(--input);color:var(--text);border-color:var(--line)}
.c-act:focus-visible{outline:2px solid var(--cyan);outline-offset:1px}
.c-act[data-action="agree"].active{color:#1f9d55;background:rgba(31,157,85,.12);border-color:rgba(31,157,85,.35)}
.c-act[data-action="disagree"].active{color:var(--red);background:rgba(255,80,80,.1);border-color:rgba(255,120,120,.35)}
.c-act.danger:hover{color:var(--red);border-color:var(--red);background:rgba(255,80,80,.08)}
.c-act .count{font-variant-numeric:tabular-nums;font-size:11px;padding:0 5px;background:var(--input);border-radius:4px;min-width:18px;text-align:center;line-height:1.5;font-weight:700}
.c-act[data-action="agree"].active .count{background:rgba(31,157,85,.2);color:#1f9d55}
.c-act[data-action="disagree"].active .count{background:rgba(255,80,80,.2);color:var(--red)}
.comment-replies{margin-top:12px;padding-inline-start:16px;border-inline-start:2px solid var(--line);display:grid;gap:12px}
.comment-replies:empty{display:none}
.comment-replies .comment-avatar{width:32px;height:32px;font-size:13px}
.comment-replies .comment-content{padding:10px 14px}
.comment-replies .comment-user{font-size:13px}
.comment-replies .comment-text{font-size:13px}
.reply-form{display:flex;gap:8px;margin-top:10px;animation:slideDown .2s ease}
.reply-form input{flex:1;background:var(--input);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;outline:none;min-width:0}
.reply-form input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(1,180,228,.1)}
.reply-form button{padding:6px 14px;border-radius:10px;font-size:13px;font-weight:600;border:0;background:var(--cyan);color:#fff;cursor:pointer;flex-shrink:0}
.reply-form button:hover{filter:brightness(.92)}
@keyframes slideDown{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* ── بوابة المقالات (حصري / خاص) ── */
.gate-container { text-align: center; padding: 40px 20px; background: var(--sub); border: 1px solid var(--line); border-radius: 16px; margin: 20px 0 30px; }
.gate-container h2 { font-size: 24px; margin-bottom: 10px; color: var(--text); }
.gate-container > p { color: var(--muted); margin-bottom: 24px; font-size: 15px; max-width: 500px; margin-inline: auto; }
.chk-list { list-style: none; padding: 0; display: grid; gap: 10px; max-width: 480px; margin: 0 auto 24px; }
.chk-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 12px; background: var(--input); border: 1px solid var(--line); text-align: start; transition: all 0.3s ease; }
.chk-item .icon { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--line); flex-shrink: 0; font-weight: bold; }
.chk-item .icon.spin { border: 2px solid var(--line); border-top-color: var(--cyan); background: transparent; color: transparent; animation: spin 0.8s linear infinite; }
.chk-item.ok { border-color: #1f9d55; background: rgba(31, 157, 85, 0.05); }
.chk-item.ok .icon { background: #1f9d55; color: white; }
.chk-item.no { border-color: var(--red); background: rgba(229, 72, 77, 0.05); }
.chk-item.no .icon { background: var(--red); color: white; }
.chk-item .tx { flex: 1; }
.chk-item .tx strong { display: block; font-size: 14px; color: var(--text); }
.chk-item .tx span { font-size: 12px; color: var(--muted); }
@keyframes spin { to { transform: rotate(360deg); } }

.gate-result { max-width: 480px; margin: 0 auto; }
.btn-read { width: 100%; padding: 14px; border-radius: 12px; background: var(--cyan); color: #fff; border: none; font-size: 16px; font-weight: 700; cursor: pointer; margin-bottom: 12px; transition: .2s; }
.btn-read:hover { filter: brightness(0.9); }
.btn-remind { width: 100%; padding: 14px; border-radius: 12px; background: var(--sub); color: var(--text); border: 1px solid var(--line); font-size: 16px; font-weight: 700; cursor: pointer; transition: .2s; }
.btn-remind:hover { background: var(--input); }

/* ── نموذج كلمة السر (المقال الخاص) ── */
.priv-wrap { max-width: 420px; margin: 0 auto; }
.priv-section { text-align: start; }
.priv-section h3 { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 10px; }
.priv-form { display: flex; gap: 8px; }
.priv-form input { flex: 1; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--input); color: var(--text); outline: none; font-family: inherit; font-size: 14px; }
.priv-form input:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(1,180,228,.12); }
.priv-form button { padding: 12px 24px; border-radius: 10px; background: var(--cyan); color: #fff; border: none; font-weight: 700; cursor: pointer; font-family: inherit; font-size: 14px; white-space: nowrap; }
.priv-form button:hover { filter: brightness(.9); }
.priv-err { color: var(--red); font-size: 13px; margin-top: 8px; min-height: 20px; font-weight: 600; }
.priv-divider { display: flex; align-items: center; gap: 12px; margin: 22px 0; color: var(--muted); font-size: 12px; }
.priv-divider::before, .priv-divider::after { content: ''; flex: 1; height: 1px; background: var(--line); }
.btn-join { width: 100%; padding: 12px; border-radius: 10px; background: var(--sub); color: var(--text); border: 1px solid var(--line); font-weight: 700; cursor: pointer; font-family: inherit; font-size: 14px; transition: .2s; }
.btn-join:hover { border-color: var(--cyan); background: rgba(1,180,228,.08); }
.btn-join:disabled { opacity: .55; cursor: not-allowed; }
.user-tag { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; background: var(--input); border: 1px solid var(--line); font-size: 12px; color: var(--muted); margin-bottom: 18px; }
.user-tag strong { color: var(--cyan); font-weight: 700; }

/* لوحة المحاكاة */
.sim-panel { margin-top: 30px; padding: 16px; border-radius: 12px; background: var(--hdr); border: 1px dashed var(--line); font-size: 13px; color: var(--muted); max-width: 480px; margin-inline: auto; text-align: start; }
.sim-panel summary { cursor: pointer; font-weight: 600; color: var(--cyan); text-align: center; }
.sim-panel .sim-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; justify-content: center; align-items: center; }
.sim-panel label { display: flex; align-items: center; gap: 4px; }
.sim-panel input[type="number"], .sim-panel input[type="text"] { width: 70px; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--input); color: var(--text); font-size: 12px; font-family: inherit; }
.sim-panel select { padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--input); color: var(--text); font-size: 12px; font-family: inherit; }
.sim-panel button { padding: 6px 16px; border-radius: 8px; border: none; background: var(--cyan); color: #fff; cursor: pointer; font-weight: 600; font-family: inherit; }

/* ── المقالات المقترحة ── */
.side-title{font-size:16px;font-weight:700;margin-bottom:14px;color:var(--green);padding-inline-start:10px;border-inline-start:3px solid var(--green)}
.sug-card{display:flex;gap:12px;padding:10px;border-radius:12px;transition:.2s;text-decoration:none;color:inherit;border:1px solid transparent}
.sug-card:hover{background:var(--sub);border-color:var(--line)}
.sug-img{width:80px;height:60px;border-radius:8px;object-fit:cover;flex-shrink:0;background:var(--input)}
.sug-info{display:flex;flex-direction:column;justify-content:center}
.sug-title{font-size:14px;font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:4px}
.sug-meta{font-size:12px;color:var(--muted)}

/* ── التوست ── */
#toast{position:fixed;bottom:24px;inset-inline:0;margin:auto;width:max-content;max-width:90vw;z-index:50;background:var(--hdr);border:1px solid var(--line);border-radius:12px;padding:10px 18px;box-shadow:var(--shadow);opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none;font-weight:600}
#toast.on{opacity:1;transform:none}

@media(max-width:980px){
  .layout{grid-template-columns:1fr}
  .article-sidebar{position:static}
}
@media(max-width:520px){
  .comment-actions{gap:2px}
  .c-act{padding:4px 6px;font-size:11px}
  .c-act svg{width:12px;height:12px}
  .priv-form{flex-direction:column}
  .priv-form button{width:100%}
}
</style>
</head>
<body>

<header class="header"><div class="header-inner">
  <a href="#" class="logo"><span class="logo-mark"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span><span class="logo-word">Cine<span>Aura</span></span></a>
  <button class="btn" id="themeBtn" aria-label="تبديل النهار والليل">☀︎</button>
  <button class="btn btn-primary" onclick="window.location.href='article editor.html'">كتابة مقال</button>
</div></header>

<main class="layout">
  <article class="card article-main" id="mainArticle">
    <div style="text-align:center;padding:50px;color:var(--muted)">جاري تحميل المقال...</div>
  </article>

  <aside class="article-sidebar">
    <div class="card" style="padding:20px">
      <h3 class="side-title">مقالات مقترحة</h3>
      <div id="suggestedList"></div>
    </div>
  </aside>
</main>

<div id="toast" role="status"></div>

<!-- ═══════════════ THEMES ═══════════════ -->
<style id="artheme-css">
html[data-style="facebook"]{--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--ar:var(--sans);--cyan:#2d88ff;--green:#42b72a;--text:#e4e6eb;--muted:#b0b3b8;--line:#3e4042;--surface:#242526;--hdr:#242526;--input:#3a3b3c;--sub:#3a3b3c;--red:#ff6b70;--shadow:0 1px 2px rgba(0,0,0,.35);--bg:#18191a;--radius:8px}
html[data-style="facebook"][data-theme="day"]{--cyan:#1877f2;--text:#050505;--muted:#65676b;--line:#ced0d4;--surface:#ffffff;--hdr:#ffffff;--input:#f0f2f5;--sub:#f0f2f5;--red:#fa383e;--shadow:0 1px 2px rgba(0,0,0,.2);--bg:#f0f2f5}
html[data-style="youtube"]{--sans:Roboto,"Segoe UI",Arial,sans-serif;--ar:var(--sans);--cyan:#ff0000;--green:#2ba640;--text:#f1f1f1;--muted:#aaa;--line:#303030;--surface:#212121;--hdr:#0f0f0f;--input:#121212;--sub:#272727;--red:#ff0000;--shadow:0 1px 3px rgba(0,0,0,.45);--bg:#0f0f0f;--radius:12px}
html[data-style="youtube"][data-theme="day"]{--text:#0f0f0f;--muted:#606060;--line:#e5e5e5;--surface:#ffffff;--hdr:#ffffff;--input:#ffffff;--sub:#f2f2f2;--bg:#ffffff}
html[data-style="instagram"]{--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--ar:var(--sans);--cyan:#0095f6;--green:#78de45;--text:#f5f5f5;--muted:#a8a8a8;--line:#363636;--surface:#121212;--hdr:#000000;--input:#262626;--sub:#262626;--red:#ed4956;--shadow:0 0 0 1px #363636;--bg:#000000;--radius:3px}

    }
    function applyStyle(id) { if (!okS(id)) return; root.setAttribute('data-style', id); save(STYLE_KEY, id); syncUI(); }
    function applyMode(mode) { if (!okM(mode)) return; root.setAttribute('data-theme', mode); save(MODE_KEY, mode); syncUI(); }
    function resetAll() { del(STYLE_KEY); del(MODE_KEY); root.setAttribute('data-style', 'default'); root.setAttribute('data-theme', 'night'); syncUI(); }
    grid.addEventListener('click', function (e) { var card = e.target.closest('.at-card'); if (card) applyStyle(card.dataset.style); });
    panel.querySelector('.at-mode').addEventListener('click', function (e) { var b = e.target.closest('button[data-mode]'); if (b) applyMode(b.dataset.mode); });
    panel.querySelector('.at-reset').addEventListener('click', resetAll);
    var open = false;
    function openP() { open = true; panel.classList.add('open'); btn.setAttribute('aria-expanded', 'true'); syncUI(); }
    function closeP() { open = false; panel.classList.remove('open'); btn.setAttribute('aria-expanded', 'false'); }
    btn.addEventListener('click', function () { open ? closeP() : openP(); });
    panel.querySelector('.at-close').addEventListener('click', closeP);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && open) closeP(); });
    document.addEventListener('click', function (e) { if (!open) return; if (panel.contains(e.target) || btn.contains(e.target)) return; closeP(); });
    syncUI();
  }
  try { boot(); } catch (err) { console.error('[artheme] init failed:', err); }
})();
</script>

let checkAbort = 0;

async function runExclusiveCheck(data) {
  const currentCheckId = ++checkAbort;
  const list = document.getElementById('chkList');
  const result = document.getElementById('gateResult');
  if (!list || !result) return;

  list.innerHTML = '';
  result.innerHTML = '';

  const user = {
    isFollowing: document.getElementById('simFol').checked,
    country: document.getElementById('simCountry').value,
    lang: document.getElementById('simLang').value,
    lv: parseInt(document.getElementById('simLv').value, 10),
    tier: document.getElementById('simTier').value
  };

  const criteria = data.criteria;
  const ck = [];

  if (criteria.followersOnly) ck.push({ label: "المتابعون فقط", met: user.isFollowing, req: "يجب أن تتابع الناشر" });
  if (criteria.countries && criteria.countries.length) ck.push({ label: "الدولة", met: criteria.countries.includes(user.country), req: criteria.countries.join('، ') });
  if (criteria.languages && criteria.languages.length) ck.push({ label: "اللغة", met: criteria.languages.includes(user.lang), req: criteria.languages.join('، ') });
  if (criteria.lvMin > 0 || criteria.lvMax < 10) ck.push({ label: "المستوى LV", met: user.lv >= criteria.lvMin && user.lv <= criteria.lvMax, req: `من ${criteria.lvMin} إلى ${criteria.lvMax}` });
  if (criteria.tier) {
    const uIdx = TIERS.indexOf(user.tier);
    const rIdx = TIERS.indexOf(criteria.tier);
    ck.push({ label: "Balance tier", met: uIdx >= rIdx && uIdx !== -1, req: `${criteria.tier} فما فوق` });
  }

  ck.forEach((item, i) => {
    list.innerHTML += `
      <li class="chk-item" id="chk_${i}">
        <div class="icon spin"></div>
        <div class="tx">
          <strong>${item.label}</strong>
          <span>المطلوب: ${item.req}</span>
        </div>
      </li>
    `;
  });

  let allMet = true;

  for (let i = 0; i < ck.length; i++) {
    await new Promise(r => setTimeout(r, 600));
    if (currentCheckId !== checkAbort) return;
    
    const li = document.getElementById(`chk_${i}`);
    const item = ck[i];
    allMet = allMet && item.met;
    
    li.className = `chk-item ${item.met ? 'ok' : 'no'}`;
    li.querySelector('.icon').className = 'icon';
    li.querySelector('.icon').innerHTML = item.met ? '✓' : '✕';
  }

  await new Promise(r => setTimeout(r, 400));
  if (currentCheckId !== checkAbort) return;

  if (allMet) {
    result.innerHTML = `
      <div style="color:#1f9d55; font-weight:700; margin-bottom:16px;">✓ تتطابق جميع الشروط معك!</div>
      <button class="btn-read" onclick="unlockArticle()">قراءة المقال</button>
    `;
  } else {
    result.innerHTML = `
      <div style="color:var(--red); font-weight:700; margin-bottom:16px;">لا تنطبق عليك شروط الناشر، فالمقال غير متاح لك حاليًا.</div>
      <button class="btn-remind" onclick="this.textContent='سيصلك تذكير ✓'; this.style.color='#1f9d55'; this.style.borderColor='#1f9d55'; toast('سنذكّرك عند تطابق الشروط')">ذكّرني عندما أطابق الشروط</button>
    `;
  }
}

          <button type="button" class="btn-join" id="joinBtn" onclick="requestJoin()">طلب الانضمام</button>
        </div>
      </div>
      
      <details class="sim-panel">
        <summary>أدوات المحاكاة (للتجربة فقط)</summary>
        <div class="sim-grid">
          <label>سجل الدخول كـ: <input type="text" id="simUser2" value="${currentUser}" size="10"></label>
          <button type="button" onclick="switchUser()">تغيير المستخدم</button>
        </div>
        <p style="text-align:center;margin-top:10px;font-size:11px;line-height:1.5">
          المستخدمون المضافون: <strong style="color:var(--cyan)">${data.allowedUsers.join('، ')}</strong><br>
          كلمات السر: <strong style="color:var(--cyan)">${data.passwords.join('، ')}</strong>
        </p>
      </details>
    </div>
  `;
}

function tryPassword() {
  const data = mockArticles[articleId];
  const input = document.getElementById('privPass');
  const err = document.getElementById('privErr');
  if (!input || !err) return;
  
  const pass = input.value.trim();
  if (!pass) {
    err.textContent = 'أدخل كلمة السر أولاً.';
    err.style.color = 'var(--red)';
    return;
  }
  
  if (data.passwords && data.passwords.includes(pass)) {
    // نجاح - أضف المستخدم للقائمة
    if (!data.allowedUsers.includes(currentUser)) {
      data.allowedUsers.push(currentUser);
    }
    err.textContent = '✓ كلمة السر صحيحة! جاري فتح المقال...';
    err.style.color = '#1f9d55';
    setTimeout(() => unlockArticle(), 600);
  } else {
    err.textContent = 'كلمة السر غير صحيحة. تحقق منها أو اطلب من الناشر إضافتك.';
    err.style.color = 'var(--red)';
    input.value = '';
    input.focus();
  }
}

function requestJoin() {
  const btn = document.getElementById('joinBtn');
  if (!btn || btn.disabled) return;
  btn.disabled = true;
  btn.textContent = '✓ تم إرسال طلبك إلى الناشر';
  btn.style.color = '#1f9d55';
  btn.style.borderColor = '#1f9d55';
  toast('تم إرسال طلب الانضمام، سيتم إشعارك عند الموافقة.');
}

function switchUser() {
  const inp = document.getElementById('simUser2');
  if (!inp) return;
  let newUser = inp.value.trim();
  if (!newUser) return;
  if (!newUser.startsWith('@')) newUser = '@' + newUser;
  const url = new URL(location.href);
  url.searchParams.set('user', newUser);
  location.href = url.toString();
}

// ═══════════════ مقالات مقترحة ═══════════════
function renderSuggested(currentId) {
  const list = document.getElementById('suggestedList');
  list.innerHTML = '';
  Object.keys(mockArticles).forEach(id => {
    if (id === currentId) return;
    const art = mockArticles[id];
    list.innerHTML += `
      <a href="?id=${id}&user=${encodeURIComponent(currentUser)}" class="sug-card">
        <img src="${art.cover}" class="sug-img" alt="">
        <div class="sug-info">
          <div class="sug-title">${art.title}</div>
          <div class="sug-meta">${art.category} • ${art.date}</div>
        </div>
      </a>
    `;
  });
}

function updateCommentCount() {
  const total = document.querySelectorAll('#commentsList .comment-item').length;
  const el = document.getElementById('commentCount');
  if (el) el.textContent = `(${total})`;
}

function addComment() {
  const input = document.getElementById('commentInput');
  const text = input.value.trim();
  if (!text) return;
  const list = document.getElementById('commentsList');
  const html = buildComment({
    id: 'c' + Date.now(),
    user: 'أنت',
    initial: 'أ',
    date: 'الآن',
    text, agree: 0, disagree: 0, isYou: true
  });
  list.insertAdjacentHTML('afterbegin', html);
  input.value = '';
  toast('تم نشر تعليقك!');
  updateCommentCount();
}

document.addEventListener('click', function (e) {
  const btn = e.target.closest('.c-act');
  if (!btn) return;
  const action = btn.dataset.action;
  const commentEl = btn.closest('.comment-item');
  if (!commentEl) return;

  if (action === 'agree' || action === 'disagree') {
    handleReaction(commentEl, action);
  } else if (action === 'reply') {
    toggleReplyForm(commentEl);
  } else if (action === 'report') {
    if (confirm('هل تريد الإبلاغ عن هذا التعليق؟')) {
      btn.disabled = true;
      btn.style.opacity = '.4';
      toast('تم إرسال البلاغ إلى الإدارة.');
    }
  }
});

function handleReaction(commentEl, action) {
  const agreeBtn = commentEl.querySelector(':scope > .comment-body > .comment-content .c-act[data-action="agree"]');
  const disagreeBtn = commentEl.querySelector(':scope > .comment-body > .comment-content .c-act[data-action="disagree"]');
  if (!agreeBtn || !disagreeBtn) return;
  const target = action === 'agree' ? agreeBtn : disagreeBtn;
  const other = action === 'agree' ? disagreeBtn : agreeBtn;
  const targetCount = target.querySelector('.count');
  const otherCount = other.querySelector('.count');
  const wasActive = target.classList.contains('active');

  if (wasActive) {
    target.classList.remove('active');
    target.setAttribute('aria-pressed', 'false');
    targetCount.textContent = Math.max(0, parseInt(targetCount.textContent, 10) - 1);
  } else {
    target.classList.add('active');
    target.setAttribute('aria-pressed', 'true');
    targetCount.textContent = parseInt(targetCount.textContent, 10) + 1;
    if (other.classList.contains('active')) {
      other.classList.remove('active');
      other.setAttribute('aria-pressed', 'false');
      otherCount.textContent = Math.max(0, parseInt(otherCount.textContent, 10) - 1);
    }
  }
}

function toggleReplyForm(commentEl) {
  let topLevel = commentEl;
  while (topLevel.parentElement && topLevel.parentElement.classList.contains('comment-replies')) {
    topLevel = topLevel.parentElement.closest('.comment-item');
  }
  const body = topLevel.querySelector(':scope > .comment-body');
  const replies = body.querySelector(':scope > .comment-replies');
  const existing = body.querySelector(':scope > .reply-form');

  document.querySelectorAll('.reply-form').forEach(f => f.remove());
  if (existing) return;

  const user = commentEl.querySelector('.comment-user').textContent;
  const form = document.createElement('form');
  form.className = 'reply-form';
  form.innerHTML = `
    <input type="text" placeholder="رد على ${user}..." required autocomplete="off">
    <button type="submit">رد</button>
  `;
  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    const text = form.querySelector('input').value.trim();
    if (!text) return;
    replies.insertAdjacentHTML('beforeend', buildComment({
      id: 'r' + Date.now(), user: 'أنت', initial: 'أ', date: 'الآن',
      text, agree: 0, disagree: 0, isYou: true
    }));
    form.remove();
    toast('تم نشر الرد!');
    updateCommentCount();
  });
  body.insertBefore(form, replies);
  form.querySelector('input').focus();
}

function handleVote(type) {
  const helpfulBtn = document.getElementById('btn-helpful');
  const notBtn = document.getElementById('btn-not-helpful');
  if (type === 'helpful') {
    if (helpfulBtn.classList.contains('active')) { helpfulBtn.classList.remove('active'); toast('تم إلغاء التصويت'); }
    else { helpfulBtn.classList.add('active'); notBtn.classList.remove('active'); toast('شكراً! تم التصويت كمقال مفيد.'); }
  } else {
    if (notBtn.classList.contains('active')) { notBtn.classList.remove('active'); toast('تم إلغاء التصويت'); }
    else { notBtn.classList.add('active'); helpfulBtn.classList.remove('active'); toast('شكراً لملاحظاتك!'); }
  }
}

function handleAction(type) {
  const btn = document.getElementById('btn-save');
  if (type === 'save') {
    btn.classList.toggle('active');
    toast(btn.classList.contains('active') ? 'تمت الإضافة إلى قائمتك' : 'تمت الإزالة من القائمة');
  } else if (type === 'share') {
    if (navigator.share) { navigator.share({ title: document.title, url: window.location.href }).catch(()=>{}); }
    else { navigator.clipboard.writeText(window.location.href); toast('تم نسخ رابط المقال!'); }
  } else if (type === 'report') {
    if (confirm('هل أنت متأكد من رغبتك في الإبلاغ عن هذا المقال؟')) { toast('تم إرسال البلاغ للإدارة. شكراً لك.'); }
  }
}

document.addEventListener('DOMContentLoaded', () => {
  const data = mockArticles[articleId] || mockArticles['1'];
  renderArticle(data);
  renderSuggested(articleId);
});
</script>
</body>
</html>

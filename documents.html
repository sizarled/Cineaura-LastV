<!DOCTYPE html>
<html lang="ar" dir="rtl" data-style="default" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>المستندات — CineAura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Outfit:wght@400;600;750&display=swap" rel="stylesheet">
<style>
:root{--cyan:#01b4e4;--green:#90cea1;--text:#f4fbff;--muted:#9bb0c2;--line:rgba(145,196,220,.16);--sans:"Outfit","Cairo","Segoe UI",sans-serif;--ar:"Cairo","Outfit",sans-serif;--surface:rgba(9,22,36,.62);--hdr:rgba(7,18,30,.82);--input:rgba(4,14,24,.55);--sub:rgba(255,255,255,.05);--red:#ff6b6b;--shadow:0 24px 80px rgba(0,0,0,.42);--bg:linear-gradient(180deg,#08131e,#070f18 46%,#0a1826);--radius:18px}
html[data-theme="day"]{--text:#0d253f;--muted:#4a6578;--line:rgba(13,37,63,.12);--surface:rgba(255,255,255,.86);--hdr:rgba(255,255,255,.94);--input:rgba(255,255,255,.95);--sub:rgba(13,37,63,.05);--red:#d93025;--shadow:0 18px 48px rgba(13,37,63,.1);--bg:linear-gradient(180deg,#f4f8fb,#e8f1f6 48%,#dceaf3)}
*{box-sizing:border-box;margin:0;padding:0}
html{min-height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);scroll-behavior:smooth}
body{min-height:100vh;background:var(--bg);background-attachment:fixed;color:var(--text);font-family:var(--ar);font-size:15px;line-height:1.7;padding:104px 16px 64px}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(560px 340px at 88% 6%,rgba(1,180,228,.14),transparent 70%),radial-gradient(520px 320px at 8% 92%,rgba(144,206,161,.11),transparent 70%)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
img{max-width:100%}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.hide{display:none!important}

/* ===== header ===== */
.header{position:fixed;top:calc(18px + env(safe-area-inset-top,0px));inset-inline:16px;z-index:20;max-width:1240px;margin:auto}
.header-inner{display:flex;align-items:center;gap:10px;padding:10px 16px;border:1px solid var(--line);border-radius:var(--radius);background:var(--hdr);backdrop-filter:blur(22px) saturate(150%);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.08)}
.logo{display:flex;align-items:center;gap:10px;margin-inline-end:auto}
.logo-mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(160deg,rgba(1,180,228,.28),rgba(144,206,161,.12));border:1px solid rgba(1,180,228,.35)}
.logo-mark svg{width:14px;height:14px;fill:var(--green)}
.logo-word{font-family:var(--sans);font-weight:750;font-size:18px;letter-spacing:-.04em}
.logo-word span{background:linear-gradient(90deg,var(--cyan),var(--green));-webkit-background-clip:text;background-clip:text;color:transparent}
.page-title{color:var(--muted);font-weight:600;font-size:14px}
.btn{border:1px solid var(--line);background:var(--sub);border-radius:12px;padding:8px 16px;font-weight:600;transition:.2s}
.btn:hover{border-color:rgba(1,180,228,.5);background:rgba(1,180,228,.08)}
.btn-primary{background:linear-gradient(90deg,#01b4e4,#2ec7ea 48%,#90cea1 160%);color:#032541;border:0;box-shadow:0 8px 24px rgba(1,180,228,.22)}
.btn-primary:hover{box-shadow:0 12px 30px rgba(1,180,228,.34)}
.btn-danger{border-color:rgba(255,120,120,.28);background:rgba(255,80,80,.08);color:var(--red)}
.btn-sm{padding:6px 12px;font-size:12.5px;border-radius:9px}
.wrap{max-width:1240px;margin:auto}

/* ===== hero + search ===== */
.hero{text-align:center;padding:8px 0 6px}
.hero h1{font-size:clamp(26px,4.2vw,40px);line-height:1.2;letter-spacing:-.02em;margin-bottom:6px}
.hero p{color:var(--muted);font-size:14.5px;margin-bottom:22px}
.search{position:relative;max-width:680px;margin:0 auto}
.search input{width:100%;height:56px;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:15.5px;padding-inline:52px 46px;outline:none;box-shadow:var(--shadow);backdrop-filter:blur(18px);transition:border-color .2s,box-shadow .2s}
.search input:focus{border-color:color-mix(in srgb,var(--cyan) 55%,var(--line));box-shadow:0 0 0 4px color-mix(in srgb,var(--cyan) 14%,transparent),var(--shadow)}
.search input::placeholder{color:var(--muted)}
.search .s-ic{position:absolute;inset-inline-start:18px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--muted);display:grid;place-items:center}
.search .s-ic svg{width:20px;height:20px}
.search .s-clear{position:absolute;inset-inline-end:13px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;border:0;background:var(--sub);color:var(--muted);display:none;place-items:center;font-size:18px;line-height:1}
.search.has .s-clear{display:grid}
.search .s-clear:hover{color:var(--text);background:color-mix(in srgb,var(--red) 16%,transparent)}
.quick{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.quick button{border:1px solid var(--line);background:var(--sub);border-radius:999px;padding:7px 16px;font-size:13px;font-weight:600;color:var(--muted);transition:.18s;display:inline-flex;align-items:center;gap:7px}
.quick button:hover{color:var(--text);border-color:color-mix(in srgb,var(--cyan) 45%,var(--line))}
.quick button .dot{width:7px;height:7px;border-radius:50%;background:var(--cyan)}

/* ===== field sections ===== */
.field-sec{margin-top:36px;scroll-margin-top:100px}
.field-head{display:flex;align-items:flex-end;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.fh-tx{flex:1;min-width:0}
.field-head h2{font-size:20px;font-weight:700;line-height:1.3}
.fh-sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.fh-arrow{display:flex;gap:6px}
.arr{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--sub);color:var(--muted);display:grid;place-items:center;transition:.18s}
.arr:hover{color:var(--text);border-color:color-mix(in srgb,var(--cyan) 45%,var(--line));background:color-mix(in srgb,var(--cyan) 10%,transparent)}
.arr svg{width:17px;height:17px}
.row{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x proximity;padding:4px 2px 16px;scrollbar-width:thin}
.row::-webkit-scrollbar{height:8px}
.row::-webkit-scrollbar-track{background:transparent}
.row::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
.row::-webkit-scrollbar-thumb:hover{background:color-mix(in srgb,var(--cyan) 40%,var(--line))}

/* ===== document card ===== */
.dcard{appearance:none;flex:0 0 252px;scroll-snap-align:start;display:flex;flex-direction:column;text-align:start;font:inherit;color:inherit;border:1px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden;padding:0;transition:transform .2s,border-color .2s,box-shadow .2s;cursor:pointer;backdrop-filter:blur(14px)}
.dcard:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--cyan) 50%,var(--line));box-shadow:var(--shadow)}
.dcard.sm{flex:0 0 214px}
.dc-cover{position:relative;display:block;aspect-ratio:16/9;background:var(--sub);overflow:hidden}
.dc-cover img{width:100%;height:100%;object-fit:cover;display:block}
.fmt-fallback{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;color:#fff;background:linear-gradient(150deg,color-mix(in srgb,var(--fc) 92%,#fff),color-mix(in srgb,var(--fc) 62%,#000))}
.fmt-fallback::before{content:"";position:absolute;inset:0;background:radial-gradient(120px 80px at 20% 10%,rgba(255,255,255,.22),transparent 70%)}
.fmt-fallback svg{width:34px;height:34px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;opacity:.92;position:relative}
.ff-t{font-size:14px;font-weight:800;letter-spacing:.09em;opacity:.96;position:relative}
.dc-badge{position:absolute;top:8px;inset-inline-start:8px;font-size:10px;font-weight:800;letter-spacing:.06em;padding:3px 8px;border-radius:7px;background:color-mix(in srgb,var(--fc) 82%,#000);color:#fff;border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(4px)}
.dc-rank{position:absolute;bottom:8px;inset-inline-end:8px;font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:7px;background:rgba(0,0,0,.58);color:#fff;backdrop-filter:blur(4px);letter-spacing:.02em}
.dc-body{display:flex;flex-direction:column;gap:6px;padding:12px 13px 13px;flex:1;min-width:0}
.dc-title{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14px;font-weight:700;line-height:1.45;min-height:2.9em}
.dc-desc{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:11.5px;color:var(--muted);line-height:1.55}
.dc-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11px;color:var(--muted);margin-top:auto}
.dc-field{color:var(--green-ink);font-weight:700}
.dc-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:8px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
.dc-author{font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52%}
.dc-stats{display:flex;gap:9px;white-space:nowrap}
.dc-stats span{display:inline-flex;align-items:center;gap:4px}
.dc-stats svg{width:13px;height:13px}
.no-res{text-align:center;padding:60px 20px;color:var(--muted)}
.no-res b{display:block;font-size:18px;color:var(--text);margin-bottom:6px}

/* ===== back ===== */
.back{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--sub);color:var(--muted);border-radius:11px;padding:7px 14px;font-size:13px;font-weight:600;margin-bottom:16px;transition:.18s}
.back:hover{color:var(--text);border-color:color-mix(in srgb,var(--cyan) 45%,var(--line));background:color-mix(in srgb,var(--cyan) 10%,transparent)}
.back svg{width:15px;height:15px}

/* ===== VIEWER LAYOUT ===== */
.view-layout { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
.v-main { flex: 1 1 600px; min-width: 0; display: flex; flex-direction: column; gap: 16px; max-width: 100%; }
aside { flex: 0 0 320px; width: 320px; max-width: 100%; }
@media(max-width: 980px) { .view-layout { flex-direction: column; } aside { flex: 1 1 auto; width: 100%; } }

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);backdrop-filter:blur(20px) saturate(150%);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.07);max-width:100%;overflow:hidden;word-break:break-word;overflow-wrap:break-word}
.v-card{padding:22px clamp(16px,3.2vw,28px)}
.v-h2{font-size:17px;font-weight:700;margin-bottom:12px;line-height:1.3}
.v-title{font-size:clamp(22px,3.4vw,32px);line-height:1.3;letter-spacing:-.02em;margin-bottom:8px;word-break:break-word}
.v-desc{color:var(--muted);font-size:15px;line-height:1.75;margin-bottom:14px;word-break:break-word}
.v-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green-ink);border:1px solid color-mix(in srgb,var(--green) 32%,transparent);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600}
.chip.field{background:color-mix(in srgb,var(--cyan) 14%,transparent);color:color-mix(in srgb,var(--cyan) 75%,var(--text));border-color:color-mix(in srgb,var(--cyan) 34%,transparent)}

/* ===== Author Profile Card (NEW) ===== */
.author-card{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--sub);margin-bottom:16px}
.author-info{display:flex;align-items:flex-start;gap:14px;flex:1;min-width:200px}
.author-av{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;font-size:22px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--cyan),var(--green));box-shadow:0 4px 12px rgba(0,0,0,.15)}
.author-details{display:flex;flex-direction:column;gap:4px;min-width:0}
.author-name-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.author-name{font-weight:700;font-size:16px;color:var(--text)}
.author-handle{font-size:13px;color:var(--muted)}
.author-rank{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:rgba(255,193,7,.15);color:#ffc107;white-space:nowrap}
html[data-theme="day"] .author-rank{background:rgba(255,143,0,.15);color:#d97706}
.author-bio{font-size:13.5px;color:var(--muted);line-height:1.6;margin-top:4px;word-break:break-word}
.btn-follow{flex-shrink:0;padding:8px 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:600;cursor:pointer;transition:.2s;color:var(--text);display:inline-flex;align-items:center;gap:6px}
.btn-follow:hover{border-color:var(--cyan);color:var(--cyan);background:color-mix(in srgb,var(--cyan) 8%,transparent)}
.btn-follow.on{background:var(--cyan);color:#fff;border-color:var(--cyan)}
.btn-follow svg{width:16px;height:16px}

/* ===== Download Box ===== */
.download-box{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--sub);margin-bottom:16px}
.dl-info{display:flex;align-items:center;gap:14px;flex:1;min-width:200px;max-width:100%}
.dl-ic{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;color:#fff}
.dl-ic svg{width:24px;height:24px}
.dl-text{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.dl-name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr;text-align:right}
.dl-meta{font-size:12px;color:var(--muted);margin-top:2px;direction:ltr;text-align:right}
.dl-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;flex-shrink:0;font-size:14px}
.dl-btn svg{width:18px;height:18px}

/* ===== Rating Box ===== */
.rating-box{padding:18px;border:1px solid var(--line);border-radius:14px;background:var(--sub);display:flex;flex-direction:column;gap:16px}
.rate-top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.rate-head h3{font-size:15px;font-weight:700;margin-bottom:4px;color:var(--text)}
.rate-head p{font-size:12.5px;color:var(--muted);margin:0}
.rate-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rate-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:600;color:var(--text);transition:.2s}
.rate-btn:hover{border-color:var(--cyan)}
.rate-btn svg{width:16px;height:16px}
.rate-btn.up.on{background:var(--green);color:#fff;border-color:var(--green)}
.rate-btn.down.on{background:var(--red);color:#fff;border-color:var(--red)}
.rep-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;font-size:13px;border-radius:10px}
.rep-btn svg{width:15px;height:15px}
.rate-progress{display:flex;align-items:center;gap:12px}
.rate-bar{flex:1;height:8px;border-radius:99px;background:var(--input);overflow:hidden}
.rate-fill{height:100%;background:var(--green);border-radius:99px;transition:width .4s}
.rate-pct{font-size:12.5px;color:var(--muted);font-weight:600;white-space:nowrap}

/* ===== Index List ===== */
.idx-list{list-style:none;display:flex;flex-direction:column;gap:4px;padding:0;margin:0}
.idx-list li{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:10px;background:var(--surface);border:1px solid transparent;transition:.15s}
.idx-list li:hover{border-color:var(--line);background:var(--sub)}
.idx-num{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--sub);font-size:12px;font-weight:700;color:var(--green-ink);flex-shrink:0}
.idx-title{flex:1;font-size:14.5px;font-weight:600;color:var(--text);word-break:break-word;min-width:0}
.idx-page{font-size:12px;font-weight:600;color:var(--muted);background:var(--sub);padding:2px 10px;border-radius:6px;flex-shrink:0;direction:ltr}

/* related sidebar */
.rel-list{display:grid;gap:8px}
.rel-item{display:flex;gap:11px;align-items:center;padding:8px;border-radius:12px;border:1px solid transparent;background:none;text-align:start;font:inherit;color:inherit;width:100%;cursor:pointer;transition:.16s}
.rel-item:hover{background:var(--sub);border-color:var(--line)}
.rel-thumb{width:58px;height:58px;border-radius:10px;flex:none;overflow:hidden;position:relative;background:var(--sub)}
.rel-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.rel-fmt{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(150deg,color-mix(in srgb,var(--fc) 92%,#fff),color-mix(in srgb,var(--fc) 62%,#000));color:#fff;font-size:10.5px;font-weight:800;letter-spacing:.05em}
.rel-info{flex:1;min-width:0}
.rel-title{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12.5px;font-weight:600;line-height:1.45;word-break:break-word}
.rel-meta{font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* section head with count */
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.sec-head .hint{margin:0}

/* comments */
.cm-count{font-size:12px;font-weight:700;color:var(--muted);background:var(--sub);border:1px solid var(--line);border-radius:999px;padding:1px 10px;margin-inline-start:6px;vertical-align:middle}
.cm-form{display:flex;gap:10px;align-items:flex-start;margin-bottom:6px}
.cm-av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:800;font-size:14px;color:#032541;background:linear-gradient(135deg,var(--cyan),var(--green));text-transform:uppercase}
.cm-av.me{background:linear-gradient(135deg,var(--green),var(--cyan))}
.cm-form-body{flex:1;min-width:0}
.cm-form textarea{width:100%;min-height:54px;background:var(--input);border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:none;resize:vertical;font-size:14px}
.cm-form textarea:focus{border-color:color-mix(in srgb,var(--cyan) 55%,var(--line));box-shadow:0 0 0 4px color-mix(in srgb,var(--cyan) 12%,transparent)}
.cm-form-act{display:flex;justify-content:flex-end;margin-top:7px}
.cm-list{margin-top:6px}
.cm{display:flex;gap:12px;padding:15px 0;border-top:1px solid var(--line)}
.cm:first-child{border-top:0;padding-top:8px}
.cm.mine .cm-av{box-shadow:0 0 0 2px color-mix(in srgb,var(--cyan) 45%,transparent)}
.cm-body{flex:1;min-width:0}
.cm-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.cm-head b{font-weight:700}
.cm-you{font-size:10.5px;font-weight:700;color:color-mix(in srgb,var(--cyan) 75%,var(--text));background:color-mix(in srgb,var(--cyan) 14%,transparent);border-radius:6px;padding:1px 7px}
.cm-head time{color:var(--muted);font-size:11.5px}
.cm-text{font-size:14px;line-height:1.7;margin:4px 0 9px;word-break:break-word}
.cm-actions{display:flex;gap:5px;flex-wrap:wrap}
.cm-act{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:none;border-radius:9px;padding:4px 10px;font-size:12px;font-weight:600;color:var(--muted);transition:.15s}
.cm-act:hover{background:var(--sub);color:var(--text)}
.cm-act svg{width:13px;height:13px}
.cm-act.agree.on{color:var(--green-ink);border-color:color-mix(in srgb,var(--green) 55%,var(--line));background:color-mix(in srgb,var(--green) 13%,transparent)}
.cm-act.disagree.on{color:var(--red);border-color:color-mix(in srgb,var(--red) 55%,var(--line));background:color-mix(in srgb,var(--red) 10%,transparent)}
.cm-replies{margin-top:12px;padding-inline-start:16px;border-inline-start:2px solid var(--line);display:grid;gap:12px}
.cm-replies .cm{border-top:0;padding:0}
.cm-reply-box{margin-top:9px;display:flex;gap:8px;align-items:flex-start}
.cm-reply-box textarea{flex:1;min-height:42px;background:var(--input);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;outline:none;resize:vertical}

dialog{border:1px solid var(--line);border-radius:var(--radius);background:var(--hdr);color:var(--text);padding:22px;width:min(460px,92vw);margin:auto;box-shadow:var(--shadow)}

.rep-opts{display:grid;gap:6px;margin-top:10px}
.rep-opt{display:flex;gap:9px;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:10px;font-size:13.5px;cursor:pointer;transition:.15s}
.rep-opt:hover{background:var(--sub)}
.rep-opt:has(input:checked){border-color:color-mix(in srgb,var(--cyan) 55%,var(--line));background:color-mix(in srgb,var(--cyan) 10%,transparent)}
.rep-opt input{accent-color:var(--cyan);width:16px;height:16px}
#repNote{width:100%;min-height:64px;margin-top:12px;background:var(--input);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13.5px;outline:none;resize:vertical}
.dlg-act{display:flex;gap:8px;justify-content:flex-start;margin-top:16px;flex-wrap:wrap}

/* toast */
#toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));inset-inline:0;margin:auto;width:max-content;max-width:90vw;z-index:60;background:var(--hdr);border:1px solid var(--line);border-radius:12px;padding:10px 18px;box-shadow:var(--shadow);opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none;font-size:14px}

function curM(){return root.getAttribute('data-theme')||'night';}
function syncUI(){

var t=THEMES.filter(function(x){return x.id===s;})[0];

function applyStyle(id){if(!okS(id))return;root.setAttribute('data-style',id);sv(SK,id);syncUI();}

function resetAll(){dl(SK);dl(MK);root.setAttribute('data-style','default');root.setAttribute('data-theme','night');syncUI();}
grid.addEventListener('click',function(e){var card=e.target.closest('.at-card');if(card)applyStyle(card.dataset.style);});
panel.querySelector('.at-mode').addEventListener('click',function(e){var b=e.target.closest('button[data-mode]');if(b)applyMode(b.dataset.mode);});

var open=false;
function openP(){open=true;panel.classList.add('open');btn.setAttribute('aria-expanded','true');syncUI();}
function closeP(){open=false;panel.classList.remove('open');btn.setAttribute('aria-expanded','false');}
btn.addEventListener('click',function(){open?closeP():openP();});

document.addEventListener('keydown',function(e){if(e.key==='Escape'&&open)closeP();});
document.addEventListener('click',function(e){if(!open)return;if(panel.contains(e.target)||btn.contains(e.target))return;closeP();});
syncUI();
window.CineAuraTheme={set:applyStyle,setMode:applyMode,reset:resetAll,list:THEMES.slice(),current:function(){return{style:curS(),mode:curM()};}};}
try{boot();}catch(err){console.error('[artheme] init failed:',err);}
})();

function makeIndex(id){
  const r=rng(hash('ix'+id));
  const n=5+Math.floor(r()*5);
  const out=[];let p=1;
  for(let i=0;i<n;i++){out.push({t:IDX_NAMES[i%IDX_NAMES.length],p:String(p)});p+=2+Math.floor(r()*8)}
  return out;
}

const state={docs:[],docsById:{},byField:{},current:null,commentsByDoc:{},ratingsByDoc:{},report:null,user:'@sara',userName:'سارة',follows:new Set()};

function buildDocs(){
  const out=[];
  FIELD_DEFS.forEach((f,fi)=>{
    const combos=[];
    f.subjects.forEach(s=>f.objects.forEach(o=>combos.push([s,o])));
    const r=rng(hash('gen-'+f.id));
    const list=[];
    for(let i=0;i<50;i++){
      const [s,o]=combos[(i*7+fi*11)%combos.length];
      const pre=f.prefixes[i%f.prefixes.length];
      const title=(i%3===1)?`${s} ${o}`:`${pre} ${s} ${o}`;
      const author=AUTHORS[(i*3+fi*5)%AUTHORS.length];
      const format=pickFormat(r);
      const views=Math.round(1200+r()*94000);
      const downloads=Math.round(views*(0.12+r()*0.32));
      const days=Math.floor(r()*680);
      const date=new Date(Date.now()-days*864e5);
      const size=Math.round(180*1024+r()*(9*1024*1024-180*1024));
      const id=f.id+'-'+String(i+1).padStart(2,'0');
      list.push({
        id,field:f.id,title,desc:DESC_TPL[i%DESC_TPL.length](s,o),author,format,
        views,downloads,date,dateStr:dstr(date),size,sizeStr:fmtSize(size),
        thumb:(i%3===0),hue:f.hue+((i*17)%70)-35,index:makeIndex(id)
      });
    }
    list.sort((a,b)=>b.views-a.views);
    out.push(...list);
  });
  return out;
}

const cmAuthors=AUTHORS;

function commentsFor(doc){
  if(state.commentsByDoc[doc.id])return state.commentsByDoc[doc.id];
  const r=rng(hash('cm-'+doc.id));
  const n=Math.floor(r()*6);
  const list=[];
  for(let i=0;i<n;i++){
    const a=cmAuthors[Math.floor(r()*cmAuthors.length)];
    const days=Math.floor(r()*120);
    const c={id:doc.id+'-c'+i,author:a,text:CM_TEXTS[Math.floor(r()*CM_TEXTS.length)],
      date:new Date(Date.now()-days*864e5),
      agree:Math.floor(r()*40),disagree:Math.floor(r()*8),myVote:null,replies:[]};
    const rn=Math.floor(r()*3);
    for(let j=0;j<rn;j++){
      c.replies.push({id:c.id+'-r'+j,author:cmAuthors[Math.floor(r()*cmAuthors.length)],
        text:RP_TEXTS[Math.floor(r()*RP_TEXTS.length)],
        date:new Date(Date.now()-Math.floor(r()*(days||1))*864e5),
        agree:Math.floor(r()*10),disagree:Math.floor(r()*3),myVote:null});
    }
    list.push(c);
  }
  state.commentsByDoc[doc.id]=list;
  return list;
}
function ratingFor(doc){
  if(!state.ratingsByDoc[doc.id]){
    const r=rng(hash('rt-'+doc.id));
    const total=40+Math.floor(r()*400);
    const up=Math.round(total*(0.55+r()*0.38));
    state.ratingsByDoc[doc.id]={up,down:total-up,myVote:null};
  }
  return state.ratingsByDoc[doc.id];
}
function findComment(docId,cmId){
  const list=state.commentsByDoc[docId]||[];
  for(const c of list){
    if(c.id===cmId)return c;
    for(const r of c.replies)if(r.id===cmId)return r;
  }
  return null;
}
function findTop(docId,cmId){return (state.commentsByDoc[docId]||[]).find(c=>c.id===cmId)||null}
function countComments(doc){const l=commentsFor(doc);return l.length+l.reduce((a,c)=>a+c.replies.length,0)}

function applyFilter(){
  const q=$("q").value.trim().toLowerCase();
  $("searchWrap").classList.toggle("has",!!q);
  document.querySelectorAll(".field-sec").forEach(sec=>{
    let visible=0;
    sec.querySelectorAll(".dcard").forEach(card=>{
      const d=state.docsById[card.dataset.id];
      const hay=(d.title+" "+d.desc+" "+d.author.name+" "+fieldName(d.field)+" "+d.format).toLowerCase();
      const ok=!q||hay.includes(q);
      card.classList.toggle("hide",!ok);
      if(ok)visible++;
    });
    sec.classList.toggle("hide",visible===0);
  });
  $("noRes").hidden=!!document.querySelector(".field-sec:not(.hide)");
}

function bindViewer(doc){
  $("dlBtn").onclick=()=>{
    doc.downloads++;
    const v=$("vDl");if(v)v.textContent=fmtNum(doc.downloads)+" تنزيل";
    toast("بدأ تنزيل المستند (نسخة تجريبية)","thanks");
  };
  $("sendCm").onclick=()=>{
    const ta=$("newCm");const t=ta.value.trim();
    if(!t){ta.focus();return toast("اكتب تعليقًا أولًا")}
    const list=commentsFor(doc);
    list.unshift({id:doc.id+'-c'+Date.now(),author:{name:state.userName,handle:state.user},
      text:t,date:new Date(),agree:0,disagree:0,myVote:null,replies:[],mine:true});
    ta.value="";
    refreshComments(doc);
    toast("تم نشر تعليقك، شكرًا لك","thanks");
  };
  const fb=$("followBtn");
  if(fb){
    fb.onclick=()=>{
      const handle=fb.dataset.handle;
      if(state.follows.has(handle)){
        state.follows.delete(handle);
        fb.classList.remove("on");
        fb.innerHTML=I.plus+' متابعة';
      }else{
        state.follows.add(handle);
        fb.classList.add("on");
        fb.innerHTML=I.check+' متابَع';
      }
    };
  }
}

/* ---------- rating ---------- */
function voteDoc(doc,v){
  const r=ratingFor(doc);
  const key=v==='up'?'up':'down';
  if(r.myVote===v){r[key]--;r.myVote=null}
  else{if(r.myVote)r[r.myVote]--;r[key]++;r.myVote=v}
  refreshRating(doc);
}
function refreshRating(doc){
  const r=ratingFor(doc);
  const tot=r.up+r.down;
  const pct=tot?Math.round(r.up/tot*100):0;
  const up=$("rateUp"),dn=$("rateDown");
  if(up)up.textContent=r.up;
  if(dn)dn.textContent=r.down;
  document.querySelectorAll(".rate-btn.up").forEach(b=>b.classList.toggle("on",r.myVote==="up"));
  document.querySelectorAll(".rate-btn.down").forEach(b=>b.classList.toggle("on",r.myVote==="down"));
  const fill=document.querySelector(".rate-fill");if(fill)fill.style.width=pct+"%";
  const sum=$("rateSum");if(sum)sum.textContent=`${pct}% وجدوه مفيدًا · ${fmtNum(tot)} تقييم`;
}

        <button class="cm-act agree ${c.myVote==='up'?'on':''}" type="button" data-act="cm-vote" data-v="up" data-cm="${c.id}">${I.up}<span>${c.agree}</span></button>
        <button class="cm-act disagree ${c.myVote==='down'?'on':''}" type="button" data-act="cm-vote" data-v="down" data-cm="${c.id}">${I.down}<span>${c.disagree}</span></button>
        ${isReply?'':`<button class="cm-act" type="button" data-act="cm-reply" data-cm="${c.id}">رد</button>`}
        <button class="cm-act" type="button" data-act="cm-report" data-cm="${c.id}">إبلاغ</button>
      </div>
      ${isReply?'':`<div class="cm-reply-box hide" data-box="${c.id}">
        <textarea placeholder="اكتب ردًا…" aria-label="رد"></textarea>
        <button class="btn btn-sm btn-primary" type="button" data-act="cm-send" data-cm="${c.id}">إرسال</button>
      </div>`}
      ${replies}
    </div>
  </div>`;
}
function refreshComments(doc){
  const list=commentsFor(doc);
  const cnt=$("cmCount");
  if(cnt)cnt.textContent=countComments(doc);
  const el=$("cmList");
  if(!el)return;
  if(!list.length){el.innerHTML=`<p class="empty-cm">لا توجد تعليقات بعد. كن أول من يشارك رأيه.</p>`;return}
  el.innerHTML=list.map(c=>cmHTML(c,false)).join('');
}
function voteComment(doc,cmId,v){
  const c=findComment(doc.id,cmId);if(!c)return;
  const key=v==='up'?'agree':'disagree';
  if(c.myVote===v){c[key]--;c.myVote=null}
  else{if(c.myVote)c[c.myVote==='up'?'agree':'disagree']--;c[key]++;c.myVote=v}
  refreshComments(doc);
}
function toggleReply(cmId){
  const box=document.querySelector(`[data-box="${cmId}"]`);
  if(!box)return;
  const closed=box.classList.contains("hide");
  box.classList.toggle("hide",!closed);
  if(closed){const ta=box.querySelector("textarea");if(ta)ta.focus()}
}
function sendReply(doc,cmId){
  const box=document.querySelector(`[data-box="${cmId}"]`);
  if(!box)return;
  const ta=box.querySelector("textarea");
  const t=(ta.value||"").trim();
  if(!t){ta.focus();return toast("اكتب ردًا أولًا")}
  const parent=findTop(doc.id,cmId);
  if(!parent)return;
  parent.replies.push({id:cmId+'-r'+Date.now(),author:{name:state.userName,handle:state.user},
    text:t,date:new Date(),agree:0,disagree:0,myVote:null,mine:true});
  refreshComments(doc);
  toast("تم نشر ردك","thanks");
}

/* ---------- report ---------- */
function openReport(kind,doc,cmId){
  state.report={kind,doc,cmId};
  $("repTitle").textContent=kind==="doc"?"الإبلاغ عن المستند":"الإبلاغ عن تعليق";
  document.querySelectorAll('input[name="repReason"]').forEach(r=>r.checked=false);
  $("repNote").value="";
  $("repDlg").showModal();
}
$("repCancel").onclick=()=>$("repDlg").close();
$("repSend").onclick=()=>{
  const sel=document.querySelector('input[name="repReason"]:checked');
  if(!sel)return toast("اختر سبب الإبلاغ أولًا");
  $("repDlg").close();
  toast("شكرًا لك، تم إرسال الإبلاغ إلى فريق المراجعة","thanks");
};

/* ---------- delegation ---------- */
document.addEventListener("click",e=>{
  const card=e.target.closest(".dcard,.rel-item");
  if(card&&card.dataset.id){e.preventDefault();location.hash="#/doc/"+card.dataset.id;return}
  const b=e.target.closest("[data-act]");
  if(!b)return;
  const doc=state.current;if(!doc)return;
  const a=b.dataset.act;
  if(a==="rate")voteDoc(doc,b.dataset.v);
  else if(a==="report-doc")openReport("doc",doc,null);
  else if(a==="cm-vote")voteComment(doc,b.dataset.cm,b.dataset.v);
  else if(a==="cm-reply")toggleReply(b.dataset.cm);
  else if(a==="cm-send")sendReply(doc,b.dataset.cm);
  else if(a==="cm-report")openReport("cm",doc,b.dataset.cm);
});

/* ---------- routing ---------- */
function route(){
  const m=location.hash.match(/^#\/doc\/(.+)$/);
  if(m&&state.docsById[m[1]])showViewer(state.docsById[m[1]]);
  else showBrowse();
}
addEventListener("hashchange",route);

/* ---------- init ---------- */
(function init(){
  state.docs=buildDocs();
  state.docs.forEach(d=>{
    state.docsById[d.id]=d;
    (state.byField[d.field]=state.byField[d.field]||[]).push(d);
  });
  renderBrowse();
  route();
})();
})();
</script>
</body>
</html>

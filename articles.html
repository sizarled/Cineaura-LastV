<!DOCTYPE html>
<html lang="ar" dir="rtl" data-style="default" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مقالات CineAura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Outfit:wght@400;600;750&display=swap" rel="stylesheet">
<style>
/* ══════════════ المتغيرات الأساسية ══════════════ */
:root{--cyan:#01b4e4;--green:#90cea1;--text:#f4fbff;--muted:#9bb0c2;--line:rgba(145,196,220,.16);--sans:"Outfit","Cairo","Segoe UI",sans-serif;--ar:"Cairo","Outfit",sans-serif;--surface:rgba(9,22,36,.62);--hdr:rgba(7,18,30,.82);--input:rgba(4,14,24,.55);--sub:rgba(255,255,255,.05);--red:#ff6b6b;--shadow:0 24px 80px rgba(0,0,0,.42);--bg:linear-gradient(180deg,#08131e,#070f18 46%,#0a1826);--radius:18px}
html[data-theme="day"]{--text:#0d253f;--muted:#4a6578;--line:rgba(13,37,63,.12);--surface:rgba(255,255,255,.86);--hdr:rgba(255,255,255,.94);--input:rgba(255,255,255,.95);--sub:rgba(13,37,63,.05);--red:#d93025;--shadow:0 18px 48px rgba(13,37,63,.1);--bg:linear-gradient(180deg,#f4f8fb,#e8f1f6 48%,#dceaf3)}

*{box-sizing:border-box;margin:0;padding:0}
html{min-height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);scroll-behavior:smooth}
body{min-height:100vh;background:var(--bg);background-attachment:fixed;color:var(--text);font-family:var(--ar);font-size:15px;line-height:1.7;padding:104px 16px 64px}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(560px 340px at 88% 6%,rgba(1,180,228,.14),transparent 70%),radial-gradient(520px 320px at 8% 92%,rgba(144,206,161,.11),transparent 70%)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
a{color:var(--cyan);text-decoration:none}
img{max-width:100%}
.hide{display:none!important}

/* ══════════════ الهيدر ══════════════ */
.header{position:fixed;top:calc(18px + env(safe-area-inset-top,0px));inset-inline:16px;z-index:20;max-width:1240px;margin:auto}
.header-inner{display:flex;align-items:center;gap:10px;padding:10px 16px;border:1px solid var(--line);border-radius:var(--radius);background:var(--hdr);backdrop-filter:blur(22px) saturate(150%);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.08)}
.logo{display:flex;align-items:center;gap:10px;margin-inline-end:auto;color:inherit;text-decoration:none}
.logo-mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(160deg,rgba(1,180,228,.28),rgba(144,206,161,.12));border:1px solid rgba(1,180,228,.35)}
.logo-mark svg{width:14px;height:14px;fill:var(--green)}
.logo-word{font-family:var(--sans);font-weight:750;font-size:18px;letter-spacing:-.04em}
.logo-word span{background:linear-gradient(90deg,var(--cyan),var(--green-ink));-webkit-background-clip:text;background-clip:text;color:transparent}
.page-title{color:var(--muted);font-weight:600;font-size:14px}
.btn{border:1px solid var(--line);background:var(--sub);border-radius:12px;padding:8px 16px;font-weight:600;transition:.2s;display:inline-flex;align-items:center;gap:6px;font-family:inherit}
.btn:hover{border-color:rgba(1,180,228,.5);background:rgba(1,180,228,.08)}
.btn-primary{background:linear-gradient(90deg,#01b4e4,#2ec7ea 48%,#90cea1 160%);color:#032541;border:0;box-shadow:0 8px 24px rgba(1,180,228,.22)}
.btn-primary:hover{box-shadow:0 12px 30px rgba(1,180,228,.34)}
.btn-danger{border-color:color-mix(in srgb,var(--red) 38%,transparent);background:color-mix(in srgb,var(--red) 12%,transparent);color:color-mix(in srgb,var(--red) 65%,var(--text))}
.btn-sm{padding:6px 12px;font-size:12.5px;border-radius:9px}
.wrap{max-width:1240px;margin:auto}

/* ══════════════ Hero + Search ══════════════ */
.hero{text-align:center;padding:8px 0 6px}
.hero h1{font-size:clamp(26px,4.2vw,40px);line-height:1.2;letter-spacing:-.02em;margin-bottom:6px}
.hero p{color:var(--muted);font-size:14.5px;margin-bottom:22px}
.search{position:relative;max-width:680px;margin:0 auto}
.search input{width:100%;height:56px;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:15.5px;padding-inline:52px 46px;outline:none;box-shadow:var(--shadow);backdrop-filter:blur(18px);transition:border-color .2s,box-shadow .2s}
.search input:focus{border-color:color-mix(in srgb,var(--cyan) 55%,var(--line));box-shadow:0 0 0 4px color-mix(in srgb,var(--cyan) 14%,transparent),var(--shadow)}
.search input::placeholder{color:var(--muted)}
.search .s-ic{position:absolute;inset-inline-start:18px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--muted);display:grid;place-items:center}
.search .s-ic svg{width:20px;height:20px}
.search .s-clear{position:absolute;inset-inline-end:13px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;border:0;background:var(--sub);color:var(--muted);display:none;place-items:center;font-size:18px;line-height:1}
.search.has .s-clear{display:grid}
.search .s-clear:hover{color:var(--text);background:color-mix(in srgb,var(--red) 16%,transparent)}
.quick{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.quick button{border:1px solid var(--line);background:var(--sub);border-radius:999px;padding:7px 16px;font-size:13px;font-weight:600;color:var(--muted);transition:.18s;display:inline-flex;align-items:center;gap:7px;font-family:inherit}
.quick button:hover{color:var(--text);border-color:color-mix(in srgb,var(--cyan) 45%,var(--line))}
.quick button .dot{width:7px;height:7px;border-radius:50%;background:var(--cyan)}

/* ══════════════ الأقسام الأفقية ══════════════ */
.field-sec{margin-top:36px;scroll-margin-top:100px}
.field-head{display:flex;align-items:flex-end;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.fh-tx{flex:1;min-width:0}
.field-head h2{font-size:20px;font-weight:700;line-height:1.3;display:flex;align-items:center;gap:10px}
.field-head h2::before{content:'';width:5px;height:20px;background:var(--cyan);border-radius:3px}
.fh-sub{color:var(--muted);font-size:12.5px;margin-top:4px}
.fh-arrow{display:flex;gap:6px}
.arr{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--sub);color:var(--muted);display:grid;place-items:center;transition:.18s}
.arr:hover{color:var(--text);border-color:color-mix(in srgb,var(--cyan) 45%,var(--line));background:color-mix(in srgb,var(--cyan) 10%,transparent)}
.arr svg{width:17px;height:17px}
.row{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x proximity;padding:4px 2px 16px;scrollbar-width:thin}
.row::-webkit-scrollbar{height:8px}
.row::-webkit-scrollbar-track{background:transparent}
.row::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
.row::-webkit-scrollbar-thumb:hover{background:color-mix(in srgb,var(--cyan) 40%,var(--line))}

/* ══════════════ كارت المقال ══════════════ */
.dcard{appearance:none;flex:0 0 300px;scroll-snap-align:start;display:flex;flex-direction:column;text-align:start;font:inherit;color:inherit;border:1px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden;padding:0;transition:transform .2s,border-color .2s,box-shadow .2s;cursor:pointer;backdrop-filter:blur(14px)}
.dcard:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--cyan) 50%,var(--line));box-shadow:var(--shadow)}
.dcard.sm{flex:0 0 232px}
.dc-cover{position:relative;display:block;aspect-ratio:16/9;background:var(--sub);overflow:hidden}
.dc-cover img{width:100%;height:100%;object-fit:cover;display:block}
.dc-badge{position:absolute;top:8px;inset-inline-start:8px;font-size:10px;font-weight:800;letter-spacing:.06em;padding:3px 8px;border-radius:7px;background:color-mix(in srgb,var(--cyan) 82%,#000);color:#fff;border:1px solid rgba(255,255,255,.22)}
.dc-badge.exclusive{background:#c2410c}
.dc-badge.private{background:#7c3aed}
.dc-body{display:flex;flex-direction:column;gap:6px;padding:12px 13px 13px;flex:1;min-width:0}
.dc-title{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14px;font-weight:700;line-height:1.45;min-height:2.9em}
.dc-desc{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:11.5px;color:var(--muted);line-height:1.55}
.dc-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11px;color:var(--muted);margin-top:auto}
.dc-field{color:var(--green-ink);font-weight:700}
.dc-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:8px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
.dc-author{font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52%}
.dc-stats{display:flex;gap:9px;white-space:nowrap}
.dc-stats span{display:inline-flex;align-items:center;gap:4px}
.dc-stats svg{width:13px;height:13px}
.no-res{text-align:center;padding:60px 20px;color:var(--muted)}
.no-res b{display:block;font-size:18px;color:var(--text);margin-bottom:6px}

/* ══════════════ Viewer Layout ══════════════ */
.back{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--sub);color:var(--muted);border-radius:11px;padding:7px 14px;font-size:13px;font-weight:600;margin-bottom:16px;transition:.18s;font-family:inherit;cursor:pointer}
.back:hover{color:var(--text);border-color:color-mix(in srgb,var(--cyan) 45%,var(--line));background:color-mix(in srgb,var(--cyan) 10%,transparent)}
.back svg{width:15px;height:15px}
.view-layout{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.v-main{flex:1 1 600px;min-width:0;display:flex;flex-direction:column;gap:16px;max-width:100%}
aside{flex:0 0 320px;width:320px;max-width:100%}
@media(max-width:980px){.view-layout{flex-direction:column}aside{flex:1 1 auto;width:100%}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);backdrop-filter:blur(20px) saturate(150%);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.07);max-width:100%;overflow:hidden;word-break:break-word;overflow-wrap:break-word}
.v-card{padding:22px clamp(16px,3.2vw,28px)}
.v-h2{font-size:17px;font-weight:700;margin-bottom:12px;line-height:1.3}

/* ══════════════ Article content ══════════════ */
.art-meta{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin-bottom:14px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green-ink);border:1px solid color-mix(in srgb,var(--green) 32%,transparent);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600}
.chip.field{background:color-mix(in srgb,var(--cyan) 14%,transparent);color:color-mix(in srgb,var(--cyan) 75%,var(--text));border-color:color-mix(in srgb,var(--cyan) 34%,transparent)}
.art-title{font-size:clamp(24px,3.4vw,36px);line-height:1.3;font-weight:700;margin-bottom:14px;letter-spacing:-.02em;word-break:break-word}
.art-desc{font-size:16px;color:var(--muted);margin-bottom:20px;line-height:1.65;border-inline-start:3px solid var(--cyan);padding-inline-start:14px}
.art-cover{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:14px;margin-bottom:20px;border:1px solid var(--line)}
.art-body{font-size:16px;line-height:2;word-break:break-word;margin-top:8px}
.art-body h2{font-size:22px;margin:24px 0 12px}
.art-body p{margin-bottom:14px}
.art-body a{font-weight:600;text-decoration:underline;text-underline-offset:3px}
.art-body blockquote{border-inline-start:3px solid var(--cyan);background:rgba(1,180,228,.08);padding:14px 18px;border-radius:10px;margin:20px 0;font-style:italic}
.art-body img,.art-body video,.art-body iframe{max-width:100%;border-radius:12px;display:block;margin:20px auto}
.art-body iframe{width:100%;aspect-ratio:16/9;border:0}
.art-body ul,.art-body ol{padding-inline-start:26px;margin-bottom:16px}

/* ══════════════ Action bar ══════════════ */
.action-bar{display:flex;flex-wrap:wrap;gap:10px;padding:20px 0;margin:24px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.act-btn{display:inline-flex;align-items:center;gap:8px;background:var(--sub);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:14px;font-weight:600;color:var(--muted);transition:.2s;font-family:inherit;cursor:pointer}
.act-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.act-btn:hover{border-color:var(--cyan);color:var(--text);background:rgba(1,180,228,.08)}
.act-btn.active{background:color-mix(in srgb,var(--cyan) 16%,transparent);border-color:var(--cyan);color:var(--cyan)}
.act-btn.danger:hover{border-color:var(--red);background:rgba(255,80,80,.1);color:var(--red)}

/* ══════════════ Author box ══════════════ */
.author-box{display:flex;align-items:flex-start;gap:16px;padding:20px;background:var(--sub);border:1px solid var(--line);border-radius:16px;margin-bottom:24px;flex-wrap:wrap}
.author-avatar{width:60px;height:60px;border-radius:50%;object-fit:cover;border:2px solid var(--cyan);flex-shrink:0;background:linear-gradient(135deg,var(--cyan),var(--green));display:grid;place-items:center;font-weight:800;font-size:24px;color:#fff}
.author-info{flex:1;min-width:200px}
.author-name-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.author-name{font-weight:700;font-size:17px;color:var(--text)}
.author-badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:color-mix(in srgb,var(--cyan) 15%,transparent);color:var(--cyan);border:1px solid color-mix(in srgb,var(--cyan) 30%,transparent)}
.author-rank{font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;background:linear-gradient(90deg,rgba(255,215,0,.15),rgba(255,140,0,.15));color:#ffb347;border:1px solid rgba(255,179,71,.3);display:inline-flex;align-items:center;gap:4px}
html[data-theme="day"] .author-rank{color:#d97706}
.author-bio{font-size:13.5px;color:var(--muted);line-height:1.6;margin-top:6px;word-break:break-word}
.btn-follow{background:var(--cyan);color:#fff;border:0;padding:8px 20px;border-radius:10px;font-weight:700;font-size:13.5px;margin-top:4px;cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:6px;font-family:inherit}
.btn-follow:hover{filter:brightness(.92)}
.btn-follow.on{background:color-mix(in srgb,var(--green) 22%,transparent);color:var(--green-ink);border:1px solid color-mix(in srgb,var(--green) 42%,transparent)}
.btn-follow svg{width:16px;height:16px}

/* ══════════════ Comments ══════════════ */
.comments-section{margin-top:20px}
.cm-count{font-size:12px;font-weight:700;color:var(--muted);background:var(--sub);border:1px solid var(--line);border-radius:999px;padding:1px 10px;margin-inline-start:6px;vertical-align:middle}
.comments-title{font-size:18px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.comment-form{display:flex;gap:10px;margin-bottom:20px;align-items:flex-start}
.cm-av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:800;font-size:14px;color:#032541;background:linear-gradient(135deg,var(--cyan),var(--green));text-transform:uppercase}
.cm-av.me{background:linear-gradient(135deg,var(--green),var(--cyan))}
.cm-form-body{flex:1;min-width:0}
.cm-form-body textarea{width:100%;min-height:54px;background:var(--input);border:1px solid var(--line);border-radius:12px;padding:10px 14px;outline:none;resize:vertical;font-size:14px;font-family:inherit}
.cm-form-body textarea:focus{border-color:color-mix(in srgb,var(--cyan) 55%,var(--line));box-shadow:0 0 0 4px color-mix(in srgb,var(--cyan) 12%,transparent)}
.cm-form-act{display:flex;justify-content:flex-end;margin-top:7px}
.cm-list{margin-top:6px}
.cm{display:flex;gap:12px;padding:15px 0;border-top:1px solid var(--line)}
.cm:first-child{border-top:0;padding-top:8px}
.cm.mine .cm-av{box-shadow:0 0 0 2px color-mix(in srgb,var(--cyan) 45%,transparent)}
.cm-body{flex:1;min-width:0}
.cm-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.cm-head b{font-weight:700}
.cm-you{font-size:10.5px;font-weight:700;color:color-mix(in srgb,var(--cyan) 75%,var(--text));background:color-mix(in srgb,var(--cyan) 14%,transparent);border-radius:6px;padding:1px 7px}
.cm-head time{color:var(--muted);font-size:11.5px}
.cm-text{font-size:14px;line-height:1.7;margin:4px 0 9px;word-break:break-word}
.cm-actions{display:flex;gap:5px;flex-wrap:wrap}
.cm-act{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:none;border-radius:9px;padding:4px 10px;font-size:12px;font-weight:600;color:var(--muted);transition:.15s;font-family:inherit;cursor:pointer}
.cm-act:hover{background:var(--sub);color:var(--text)}
.cm-act svg{width:13px;height:13px}
.cm-act.agree.on{color:var(--green-ink);border-color:color-mix(in srgb,var(--green) 55%,var(--line));background:color-mix(in srgb,var(--green) 13%,transparent)}
.cm-act.disagree.on{color:var(--red);border-color:color-mix(in srgb,var(--red) 55%,var(--line));background:color-mix(in srgb,var(--red) 10%,transparent)}
.cm-replies{margin-top:12px;padding-inline-start:16px;border-inline-start:2px solid var(--line);display:grid;gap:12px}
.cm-replies .cm{border-top:0;padding:0}
.cm-reply-box{margin-top:9px;display:flex;gap:8px;align-items:flex-start}
.cm-reply-box textarea{flex:1;min-height:42px;background:var(--input);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;outline:none;resize:vertical;font-family:inherit}
.cm-reply-box textarea:focus{border-color:color-mix(in srgb,var(--cyan) 55%,var(--line))}
.empty-cm{color:var(--muted);font-size:13.5px;text-align:center;padding:26px 12px;border:1px dashed var(--line);border-radius:12px;margin-top:8px}

/* ══════════════ Gates ══════════════ */
.gate-container{text-align:center;padding:40px 20px;background:var(--sub);border:1px solid var(--line);border-radius:16px;margin:20px 0 30px}
.gate-container h2{font-size:22px;margin-bottom:10px;color:var(--text)}
.gate-container>p{color:var(--muted);margin-bottom:24px;font-size:14.5px;max-width:520px;margin-inline:auto}
.chk-list{list-style:none;padding:0;display:grid;gap:10px;max-width:480px;margin:0 auto 24px}
.chk-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;background:var(--input);border:1px solid var(--line);text-align:start;transition:all .3s ease}
.chk-item .icon{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--line);flex-shrink:0;font-weight:bold;font-size:13px}
.chk-item .icon.spin{border:2px solid var(--line);border-top-color:var(--cyan);background:transparent;color:transparent;animation:spin .8s linear infinite}
.chk-item.ok{border-color:#1f9d55;background:rgba(31,157,85,.05)}
.chk-item.ok .icon{background:#1f9d55;color:#fff}
.chk-item.no{border-color:var(--red);background:rgba(229,72,77,.05)}
.chk-item.no .icon{background:var(--red);color:#fff}
.chk-item .tx{flex:1}
.chk-item .tx strong{display:block;font-size:14px;color:var(--text)}
.chk-item .tx span{font-size:12px;color:var(--muted)}
@keyframes spin{to{transform:rotate(360deg)}}
.gate-result{max-width:480px;margin:0 auto}
.btn-read{width:100%;padding:14px;border-radius:12px;background:var(--cyan);color:#fff;border:none;font-size:16px;font-weight:700;cursor:pointer;margin-bottom:12px;transition:.2s;font-family:inherit}
.btn-read:hover{filter:brightness(.9)}
.btn-remind{width:100%;padding:14px;border-radius:12px;background:var(--sub);color:var(--text);border:1px solid var(--line);font-size:16px;font-weight:700;cursor:pointer;transition:.2s;font-family:inherit}
.btn-remind:hover{background:var(--input)}

/* Private gate */
.priv-wrap{max-width:420px;margin:0 auto}
.priv-section{text-align:start}
.priv-section h3{font-size:15px;font-weight:700;color:var(--text);margin-bottom:10px}
.priv-form{display:flex;gap:8px}
.priv-form input{flex:1;padding:12px 16px;border-radius:10px;border:1px solid var(--line);background:var(--input);color:var(--text);outline:none;font-family:inherit;font-size:14px}
.priv-form input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(1,180,228,.12)}
.priv-form button{padding:12px 24px;border-radius:10px;background:var(--cyan);color:#fff;border:none;font-weight:700;cursor:pointer;font-family:inherit;font-size:14px;white-space:nowrap}
.priv-form button:hover{filter:brightness(.9)}
.priv-err{color:var(--red);font-size:13px;margin-top:8px;min-height:20px;font-weight:600}
.priv-divider{display:flex;align-items:center;gap:12px;margin:22px 0;color:var(--muted);font-size:12px}
.priv-divider::before,.priv-divider::after{content:'';flex:1;height:1px;background:var(--line)}
.btn-join{width:100%;padding:12px;border-radius:10px;background:var(--sub);color:var(--text);border:1px solid var(--line);font-weight:700;cursor:pointer;font-family:inherit;font-size:14px;transition:.2s}
.btn-join:hover{border-color:var(--cyan);background:rgba(1,180,228,.08)}
.btn-join:disabled{opacity:.55;cursor:not-allowed}
.user-tag{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;background:var(--input);border:1px solid var(--line);font-size:12px;color:var(--muted);margin-bottom:18px}
.user-tag strong{color:var(--cyan);font-weight:700}

/* Sim panel */
.sim-panel{margin-top:24px;padding:16px;border-radius:12px;background:var(--hdr);border:1px dashed var(--line);font-size:13px;color:var(--muted);max-width:520px;margin-inline:auto;text-align:start}
.sim-panel summary{cursor:pointer;font-weight:600;color:var(--cyan);text-align:center}
.sim-panel .sim-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;justify-content:center;align-items:center}
.sim-panel label{display:flex;align-items:center;gap:4px}
.sim-panel input[type="number"],.sim-panel input[type="text"]{width:80px;padding:4px 8px;border-radius:6px;border:1px solid var(--line);background:var(--input);color:var(--text);font-size:12px;font-family:inherit}
.sim-panel select{padding:4px 8px;border-radius:6px;border:1px solid var(--line);background:var(--input);color:var(--text);font-size:12px;font-family:inherit}
.sim-panel button{padding:6px 16px;border-radius:8px;border:none;background:var(--cyan);color:#fff;cursor:pointer;font-weight:600;font-family:inherit}

/* Related list */
.rel-list{display:grid;gap:8px}
.rel-item{display:flex;gap:11px;align-items:center;padding:8px;border-radius:12px;border:1px solid transparent;background:none;text-align:start;font:inherit;color:inherit;width:100%;cursor:pointer;transition:.16s}
.rel-item:hover{background:var(--sub);border-color:var(--line)}
.rel-thumb{width:60px;height:60px;border-radius:10px;flex:none;overflow:hidden;position:relative;background:var(--sub)}
.rel-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.rel-info{flex:1;min-width:0}
.rel-title{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12.5px;font-weight:600;line-height:1.45;word-break:break-word}
.rel-meta{font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Toast */
#toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));inset-inline:0;margin:auto;width:max-content;max-width:90vw;z-index:60;background:var(--hdr);border:1px solid var(--line);border-radius:12px;padding:10px 18px;box-shadow:var(--shadow);opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none;font-size:14px;font-weight:600}
#toast.on{opacity:1;transform:none}
#toast.thanks{border-color:color-mix(in srgb,var(--green) 45%,var(--line))}

/* Responsive */
@media(max-width:980px){.page-title{display:none}}
@media(max-width:560px){.dcard{flex:0 0 264px}.dcard.sm{flex:0 0 220px}.priv-form{flex-direction:column}.priv-form button{width:100%}.author-box{flex-direction:column;align-items:stretch}.btn-follow{width:100%;justify-content:center}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

        `دليل عملي يستعرض ${cat} في ${domain.name} خطوة بخطوة، مناسب للباحثين والمهتمين.`,
        `مقال يرصد التحولات الجارية في ${cat} وتأثيرها على ${domain.name} خلال السنوات الأخيرة.`
      ];
      const title=titlePool[i%titlePool.length];
      const desc=descPool[i%descPool.length];
      const body=BODY_TPL[i%BODY_TPL.length](title,domain.name,cat);
      
      const art={
        id:`${domain.id}_${i}`,
        domainId:domain.id,
        domainName:domain.name,
        category:cat,
        title,
        desc,
        body,
        cover:`https://picsum.photos/seed/${domain.id}${i}/1200/675`,
        publisher:{
          name:pub.name,
          avatar:pub.avatar,
          level:pub.level,
          rank:pub.rank,
          bio:pub.bio,
          handle:'@'+pub.name.replace(/\s+/g,'_')
        },
        readTime:3+Math.floor(r()*12),
        comments:Math.floor(r()*80),
        helpful:Math.floor(r()*400)+10,
        notHelpful:Math.floor(r()*30),
        reports:Math.floor(r()*5),
        views,
        access,
        criteria: access==='exclusive' ? {
          followersOnly:true,
          countries:["المغرب","السعودية","الإمارات"],
          languages:["العربية"],
          lvMin:2,
          lvMax:10,
          tier:"K1"
        } : null,
        allowedUsers: access==='private' ? ["@sara","@ahmed","@noor"] : null,
        passwords: access==='private' ? ["CINEMA2026","JOIN-ME-123"] : null,
        date: dstr(date)
      };
      list.push(art);
    }
    list.sort((a,b)=>b.views-a.views);
    out.push(...list);
  });
  return out;
}

const CM_TEXTS=['مقال رائع جداً! أتفق معك في معظم النقاط.','تحليل معمق ومفيد، شكراً للناشر!','هل يمكنك التوسع في النقطة الثالثة؟','مقال ممتاز، لكنني أرى الأمر من زاوية مختلفة قليلاً.','استفدت كثيراً، واصل هذا المستوى.','موضوع شيق وطريقة عرض ممتازة.','هل هناك مراجع إضافية تنصح بها؟','قرأته مرتين، كل مرة أكتشف شيئاً جديداً.','مقال جيد، لكن أتمنى إضافة أمثلة أكثر.','شكراً على هذا المجهود الرائع.'];
const RP_TEXTS=['اتفق معك تماماً.','شكراً على الملاحظة، سآخذها بعين الاعتبار.','وجهة نظرك مفهومة، لكن أرى أن الأمر أعمق من ذلك.','نعم، وأضيف أن القسم الرابع يحتاج توسيعاً.','معلومة مفيدة، شكراً لك.'];
function commentsFor(a){
  if(state.commentsByArticle[a.id])return state.commentsByArticle[a.id];
  const r=rng(hash('cm-'+a.id));
  const n=Math.floor(r()*5);
  const list=[];
  for(let i=0;i<n;i++){
    const pub=PUBLISHERS[Math.floor(r()*PUBLISHERS.length)];
    const days=Math.floor(r()*60);
    const c={
      id:a.id+'-c'+i,
      author:{name:pub.name,handle:'@'+pub.name.replace(/\s+/g,'_')},
      text:CM_TEXTS[Math.floor(r()*CM_TEXTS.length)],
      date:new Date(Date.now()-days*864e5),
      agree:Math.floor(r()*30),disagree:Math.floor(r()*5),myVote:null,replies:[]
    };
    const rn=Math.floor(r()*3);
    for(let j=0;j<rn;j++){
      const p2=PUBLISHERS[Math.floor(r()*PUBLISHERS.length)];
      c.replies.push({
        id:c.id+'-r'+j,
        author:{name:p2.name,handle:'@'+p2.name.replace(/\s+/g,'_')},
        text:RP_TEXTS[Math.floor(r()*RP_TEXTS.length)],
        date:new Date(Date.now()-Math.floor(r()*(days||1))*864e5),
        agree:Math.floor(r()*8),disagree:Math.floor(r()*2),myVote:null
      });
    }
    list.push(c);
  }
  state.commentsByArticle[a.id]=list;
  return list;
}
function countComments(a){const l=commentsFor(a);return l.length+l.reduce((s,c)=>s+c.replies.length,0)}
function findComment(aId,cmId){
  const list=state.commentsByArticle[aId]||[];
  for(const c of list){if(c.id===cmId)return c;for(const r of c.replies)if(r.id===cmId)return r;}
  return null;
}
function findTop(aId,cmId){return (state.commentsByArticle[aId]||[]).find(c=>c.id===cmId)||null}

async function runExclusiveCheck(a){
  const currentCheckId=++state.checkAbort;
  const list=document.getElementById('chkList');
  const result=document.getElementById('gateResult');
  if(!list||!result)return;
  list.innerHTML='';result.innerHTML='';
  
  const user={
    isFollowing:document.getElementById('simFol').checked,
    country:document.getElementById('simCountry').value,
    lang:document.getElementById('simLang').value,
    lv:parseInt(document.getElementById('simLv').value,10),
    tier:document.getElementById('simTier').value
  };
  const criteria=a.criteria;
  const ck=[];
  if(criteria.followersOnly) ck.push({label:"المتابعون فقط",met:user.isFollowing,req:"يجب أن تتابع الناشر"});
  if(criteria.countries&&criteria.countries.length) ck.push({label:"الدولة",met:criteria.countries.includes(user.country),req:criteria.countries.join('، ')});
  if(criteria.languages&&criteria.languages.length) ck.push({label:"اللغة",met:criteria.languages.includes(user.lang),req:criteria.languages.join('، ')});
  if(criteria.lvMin>0||criteria.lvMax<10) ck.push({label:"المستوى LV",met:user.lv>=criteria.lvMin&&user.lv<=criteria.lvMax,req:`من ${criteria.lvMin} إلى ${criteria.lvMax}`});
  if(criteria.tier){
    const uIdx=TIERS.indexOf(user.tier),rIdx=TIERS.indexOf(criteria.tier);
    ck.push({label:"Balance tier",met:uIdx>=rIdx&&uIdx!==-1,req:`${criteria.tier} فما فوق`});
  }
  ck.forEach((item,i)=>{
    list.innerHTML+=`
      <li class="chk-item" id="chk_${i}">
        <div class="icon spin"></div>
        <div class="tx"><strong>${esc(item.label)}</strong><span>المطلوب: ${esc(item.req)}</span></div>
      </li>`;
  });
  
  let allMet=true;
  for(let i=0;i<ck.length;i++){
    await new Promise(r=>setTimeout(r,500));
    if(currentCheckId!==state.checkAbort)return;
    const li=document.getElementById(`chk_${i}`);
    const item=ck[i];
    allMet=allMet&&item.met;
    li.className=`chk-item ${item.met?'ok':'no'}`;
    li.querySelector('.icon').className='icon';
    li.querySelector('.icon').innerHTML=item.met?'✓':'✕';
  }
  await new Promise(r=>setTimeout(r,300));
  if(currentCheckId!==state.checkAbort)return;
  if(allMet){
    result.innerHTML=`<div style="color:#1f9d55;font-weight:700;margin-bottom:16px;">✓ تتطابق جميع الشروط معك!</div>
      <button class="btn-read" type="button" onclick="window.__unlockCurrent()">قراءة المقال</button>`;
  }else{
    result.innerHTML=`<div style="color:var(--red);font-weight:700;margin-bottom:16px;">لا تنطبق عليك شروط الناشر، فالمقال غير متاح لك حاليًا.</div>
      <button class="btn-remind" type="button" onclick="this.textContent='سيصلك تذكير ✓';this.style.color='#1f9d55';this.style.borderColor='#1f9d55';">ذكّرني عندما أطابق الشروط</button>`;
  }
}

    btn.style.color='#1f9d55';
    btn.style.borderColor='#1f9d55';
    toast('تم إرسال طلب الانضمام، سيتم إشعارك عند الموافقة.','thanks');
  };
  document.getElementById('switchUserBtn').onclick=()=>{
    let u=document.getElementById('simUser2').value.trim();
    if(!u)return;
    if(!u.startsWith('@'))u='@'+u;
    const url=new URL(location.href);
    url.searchParams.set('user',u);
    location.href=url.toString();
  };
}

function tryPassword(a){
  const input=document.getElementById('privPass');
  const err=document.getElementById('privErr');
  if(!input||!err)return;
  const pass=input.value.trim();
  if(!pass){err.textContent='أدخل كلمة السر أولاً.';err.style.color='var(--red)';return;}
  if(a.passwords && a.passwords.includes(pass)){
    if(!a.allowedUsers.includes(state.user)) a.allowedUsers.push(state.user);
    err.textContent='✓ كلمة السر صحيحة! جاري فتح المقال...';
    err.style.color='#1f9d55';
    setTimeout(()=>unlockArticle(true),500);
  }else{
    err.textContent='كلمة السر غير صحيحة. تحقق منها أو اطلب من الناشر إضافتك.';
    err.style.color='var(--red)';
    input.value='';input.focus();
  }
}

/* ── Viewer actions ── */
function bindViewerActions(a){
  const v=votesFor(a);
  const hBtn=$('btn-helpful'), nBtn=$('btn-not-helpful');
  const hCount=$('helpfulCount'), nCount=$('notCount');
  const syncVotes=()=>{
    hBtn.classList.toggle('active',v.my==='up');
    nBtn.classList.toggle('active',v.my==='down');
    hCount.textContent=v.helpful;
    nCount.textContent=v.not;
  };
  hBtn.onclick=()=>{
    if(v.my==='up'){v.helpful--;v.my=null;toast('تم إلغاء التصويت');}
    else{if(v.my==='down')v.not--;v.helpful++;v.my='up';toast('شكراً! تم التصويت كمقال مفيد.','thanks');}
    syncVotes();
  };
  nBtn.onclick=()=>{
    if(v.my==='down'){v.not--;v.my=null;toast('تم إلغاء التصويت');}
    else{if(v.my==='up')v.helpful--;v.not++;v.my='down';toast('شكراً لملاحظاتك!','thanks');}
    syncVotes();
  };
  syncVotes();
  
  const saveBtn=$('btn-save');
  saveBtn.onclick=()=>{
    saveBtn.classList.toggle('active');
    toast(saveBtn.classList.contains('active')?'تمت الإضافة إلى قائمتك':'تمت الإزالة من القائمة');
  };
  $('btn-share').onclick=()=>{
    if(navigator.share){navigator.share({title:document.title,url:location.href}).catch(()=>{});}
    else if(navigator.clipboard){navigator.clipboard.writeText(location.href);toast('تم نسخ رابط المقال!','thanks');}
    else toast('رابط المقال: '+location.href);
  };
  $('btn-report').onclick=()=>{
    if(confirm('هل تريد الإبلاغ عن هذا المقال؟')) toast('تم إرسال البلاغ إلى الإدارة. شكراً لك.','thanks');
  };
  
  const fb=$('followBtn');
  if(fb){
    fb.onclick=()=>{
      const handle=a.publisher.handle;
      if(state.follows.has(handle)){
        state.follows.delete(handle);
        fb.classList.remove('on');
        fb.innerHTML=I.plus+' متابعة';
      }else{
        state.follows.add(handle);
        fb.classList.add('on');
        fb.innerHTML=I.check+' متابَع';
        toast('تمت متابعة الناشر!','thanks');
      }
    };
  }
  
  $('sendCm').onclick=()=>{
    const ta=$('newCm');const t=ta.value.trim();
    if(!t){ta.focus();return toast('اكتب تعليقاً أولاً');}
    const list=commentsFor(a);
    list.unshift({
      id:a.id+'-c'+Date.now(),
      author:{name:state.userName,handle:state.user},
      text:t,date:new Date(),agree:0,disagree:0,myVote:null,replies:[],mine:true
    });
    ta.value='';
    refreshComments(a);
    toast('تم نشر تعليقك!','thanks');
  };
}

/* ── Comments render ── */
function cmHTML(c,isReply){
  const replies=(!isReply&&c.replies.length)
    ?`<div class="cm-replies">${c.replies.map(r=>cmHTML(r,true)).join('')}</div>`:'';
  return `<div class="cm ${c.mine?'mine':''}" data-cm="${c.id}">
    <div class="cm-av">${esc(initial(c.author.name))}</div>
    <div class="cm-body">
      <div class="cm-head"><b>${esc(c.author.name)}</b>${c.mine?'<span class="cm-you">أنت</span>':''}<time>${timeAgo(c.date)}</time></div>
      <p class="cm-text">${esc(c.text)}</p>
      <div class="cm-actions">
        <button class="cm-act agree ${c.myVote==='up'?'on':''}" type="button" data-act="cm-vote" data-v="up" data-cm="${c.id}">${I.up}<span>${c.agree}</span></button>
        <button class="cm-act disagree ${c.myVote==='down'?'on':''}" type="button" data-act="cm-vote" data-v="down" data-cm="${c.id}">${I.down}<span>${c.disagree}</span></button>
        ${isReply?'':`<button class="cm-act" type="button" data-act="cm-reply" data-cm="${c.id}">رد</button>`}
        <button class="cm-act" type="button" data-act="cm-report" data-cm="${c.id}">إبلاغ</button>
      </div>
      ${isReply?'':`<div class="cm-reply-box hide" data-box="${c.id}">
        <textarea placeholder="اكتب رداً…" aria-label="رد"></textarea>
        <button class="btn btn-sm btn-primary" type="button" data-act="cm-send" data-cm="${c.id}">إرسال</button>
      </div>`}
      ${replies}
    </div>
  </div>`;
}
function refreshComments(a){
  const list=commentsFor(a);
  const cnt=$('cmCount');if(cnt)cnt.textContent=countComments(a);
  const el=$('cmList');if(!el)return;
  if(!list.length){el.innerHTML=`<p class="empty-cm">لا توجد تعليقات بعد. كن أول من يشارك رأيه.</p>`;return;}
  el.innerHTML=list.map(c=>cmHTML(c,false)).join('');
}
function voteComment(a,cmId,v){
  const c=findComment(a.id,cmId);if(!c)return;
  const key=v==='up'?'agree':'disagree';
  if(c.myVote===v){c[key]--;c.myVote=null;}
  else{if(c.myVote)c[c.myVote==='up'?'agree':'disagree']--;c[key]++;c.myVote=v;}
  refreshComments(a);
}
function toggleReply(cmId){
  const box=document.querySelector(`[data-box="${cmId}"]`);
  if(!box)return;
  const closed=box.classList.contains('hide');
  box.classList.toggle('hide',!closed);
  if(closed){const ta=box.querySelector('textarea');if(ta)ta.focus();}
}
function sendReply(a,cmId){
  const box=document.querySelector(`[data-box="${cmId}"]`);
  if(!box)return;
  const ta=box.querySelector('textarea');
  const t=(ta.value||'').trim();
  if(!t){ta.focus();return toast('اكتب رداً أولاً');}
  const parent=findTop(a.id,cmId);if(!parent)return;
  parent.replies.push({id:cmId+'-r'+Date.now(),author:{name:state.userName,handle:state.user},text:t,date:new Date(),agree:0,disagree:0,myVote:null,mine:true});
  refreshComments(a);
  toast('تم نشر ردك','thanks');
}

/* ── Delegation ── */
document.addEventListener('click',e=>{
  const card=e.target.closest('.dcard,.rel-item');
  if(card&&card.dataset.id){
    e.preventDefault();
    location.hash='#/article/'+card.dataset.id;
    return;
  }
  const b=e.target.closest('[data-act]');
  if(!b)return;
  const a=state.current;if(!a)return;
  const act=b.dataset.act;
  if(act==='cm-vote')voteComment(a,b.dataset.cm,b.dataset.v);
  else if(act==='cm-reply')toggleReply(b.dataset.cm);
  else if(act==='cm-send')sendReply(a,b.dataset.cm);
  else if(act==='cm-report'){
    if(confirm('هل تريد الإبلاغ عن هذا التعليق؟')) toast('تم إرسال البلاغ إلى الإدارة.','thanks');
  }
});

/* ── Router ── */
function route(){
  const m=location.hash.match(/^#\/article\/(.+)$/);
  if(m && state.byId[m[1]]){
    renderViewer(state.byId[m[1]]);
  }else{
    state.current=null;
    $("viewerView").hidden=true;
    $("viewerView").innerHTML='';
    $("browseView").hidden=false;
    window.scrollTo(0,0);
  }
}
addEventListener('hashchange',route);

/* ── Init ── */
(function init(){
  state.articles=buildArticles();
  state.articles.forEach(a=>{
    state.byId[a.id]=a;
    (state.byDomain[a.domainId]=state.byDomain[a.domainId]||[]).push(a);
  });
  renderBrowse();
  route();
})();
})();
</script>

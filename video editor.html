<!DOCTYPE html>
<html lang="ar" dir="rtl" data-style="default" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نشر فيديو — CineAura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Outfit:wght@400;600;750&display=swap" rel="stylesheet">
<style>
/* ───────────────── BASE ───────────────── */
:root{
  --cyan:#01b4e4; --green:#90cea1; --green-ink:#90cea1;
  --text:#f4fbff; --muted:#9bb0c2;
  --line:rgba(145,196,220,.16);
  --sans:"Outfit","Cairo","Segoe UI",sans-serif;
  --ar:"Cairo","Outfit",sans-serif;
  --surface:rgba(9,22,36,.62); --hdr:rgba(7,18,30,.82);
  --input:rgba(4,14,24,.55); --sub:rgba(255,255,255,.05);
  --red:#ff6b6b; --amber:#f5a623;
  --shadow:0 24px 80px rgba(0,0,0,.42);
  --bg:linear-gradient(180deg,#08131e,#070f18 46%,#0a1826);
  --radius:16px; --radius-sm:10px; --pad:20px;
}
html[data-theme="day"]{
  --text:#0d253f; --muted:#4a6578; --line:rgba(13,37,63,.12);
  --surface:rgba(255,255,255,.86); --hdr:rgba(255,255,255,.94);
  --input:rgba(255,255,255,.95); --sub:rgba(13,37,63,.05);
  --red:#d93025; --amber:#b06000;
  --shadow:0 18px 48px rgba(13,37,63,.1);
  --bg:linear-gradient(180deg,#f4f8fb,#e8f1f6 48%,#dceaf3);
}
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%;padding-top:env(safe-area-inset-top,0px)}
body{
  min-height:100%;background:var(--bg);background-attachment:fixed;
  color:var(--text);font-family:var(--ar);font-size:15px;line-height:1.7;
  padding:calc(88px + env(safe-area-inset-top)) 16px calc(140px + env(safe-area-inset-bottom));
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;
  background:
    radial-gradient(520px 320px at 85% 8%,rgba(1,180,228,.14),transparent 70%),
    radial-gradient(480px 300px at 10% 90%,rgba(144,206,161,.10),transparent 70%);
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
svg{flex:none}
input[type=text],input[type=url],input[type=number],input[type=datetime-local],select,textarea{
  width:100%;background:var(--input);border:1px solid var(--line);
  border-radius:var(--radius-sm);padding:10px 12px;outline:none;color-scheme:dark;
}
html[data-theme="day"] input,html[data-theme="day"] select,html[data-theme="day"] textarea{color-scheme:light}
input:focus,select:focus,textarea:focus{
  border-color:rgba(1,180,228,.55);
  box-shadow:0 0 0 4px rgba(1,180,228,.12);
}
textarea{resize:vertical;min-height:88px}
label{display:block}
/* ───────────────── HEADER ───────────────── */
.header{
  position:fixed;top:calc(16px + env(safe-area-inset-top,0px));
  inset-inline:16px;z-index:20;max-width:1200px;margin:auto;
}
.header-inner{
  display:flex;align-items:center;gap:10px;padding:10px 16px;
  border:1px solid var(--line);border-radius:var(--radius);
  background:var(--hdr);backdrop-filter:blur(22px) saturate(150%);
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.08);
}
.logo{display:flex;align-items:center;gap:10px;margin-inline-end:auto}
.logo-mark{
  width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(160deg,rgba(1,180,228,.28),rgba(144,206,161,.12));
  border:1px solid rgba(1,180,228,.35);
}
.logo-mark svg{width:14px;height:14px;fill:var(--green)}
.logo-word{font-family:var(--sans);font-weight:750;font-size:18px;letter-spacing:-.04em}
.logo-word span{
  background:linear-gradient(90deg,var(--cyan),var(--green-ink));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.header-status{
  display:flex;align-items:center;gap:6px;
  font-size:13px;color:var(--muted);font-weight:600;
}
.header-status .dot{
  width:8px;height:8px;border-radius:50%;background:var(--green);
  box-shadow:0 0 0 3px rgba(144,206,161,.18);
}
.header-status.saved .dot{background:var(--cyan);box-shadow:0 0 0 3px rgba(1,180,228,.18)}
/* ───────────────── BUTTONS ───────────────── */
.btn{
  border:1px solid var(--line);background:var(--sub);
  border-radius:var(--radius-sm);padding:8px 16px;
  font-weight:600;font-size:14px;transition:.18s;
}
.btn:hover{border-color:rgba(1,180,228,.5);background:rgba(1,180,228,.08)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{
  background:linear-gradient(90deg,#01b4e4,#2ec7ea 48%,#90cea1 160%);
  color:#032541;border:0;box-shadow:0 8px 24px rgba(1,180,228,.22);
}
.btn-primary:hover:not(:disabled){
  box-shadow:0 12px 30px rgba(1,180,228,.34);
}
.btn-danger{
  background:color-mix(in srgb,var(--red) 12%,transparent);
  border-color:color-mix(in srgb,var(--red) 38%,transparent);
  color:color-mix(in srgb,var(--red) 65%,var(--text));
}
.btn-sm{padding:5px 12px;font-size:12.5px;border-radius:9px}
.btn-icon{
  width:36px;height:36px;padding:0;display:grid;place-items:center;border-radius:10px;
}
/* ───────────────── LAYOUT ───────────────── */
.layout{
  max-width:1200px;margin:auto;
  display:grid;grid-template-columns:minmax(0,1fr) 360px;
  gap:20px;align-items:start;
}
.column-main{display:grid;gap:16px;min-width:0}
.column-side{display:grid;gap:16px;min-width:0;position:sticky;top:calc(88px + env(safe-area-inset-top,0px))}
.card{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);backdrop-filter:blur(22px) saturate(150%);
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.08);
}
.card-pad{padding:var(--pad)}
.card-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px var(--pad);border-bottom:1px solid var(--line);
  font-size:13px;font-weight:700;color:var(--green-ink);
  letter-spacing:.02em;
}
.card-head .hint-inline{font-weight:500;color:var(--muted);font-size:12px}
/* ───────────────── VIDEO INPUT ───────────────── */
.video-section{padding:0;overflow:hidden}
.dropzone{
  aspect-ratio:16/9;
  border:0;border-bottom:1px dashed var(--line);
  background:var(--sub);
  display:grid;place-items:center;text-align:center;
  padding:28px;cursor:pointer;transition:.2s;
  position:relative;
}
.dropzone:hover,.dropzone.drag{
  background:color-mix(in srgb,var(--cyan) 7%,var(--sub));
}
.dropzone.drag::after{
  content:"أفلت الملف هنا";position:absolute;inset:12px;
  border:2px dashed var(--cyan);border-radius:var(--radius);
  display:grid;place-items:center;
  background:color-mix(in srgb,var(--cyan) 12%,transparent);
  color:var(--cyan);font-weight:700;font-size:15px;
}
.dropzone-inner{display:grid;justify-items:center;gap:6px;pointer-events:none}
.dropzone-icon{
  width:56px;height:56px;border-radius:16px;display:grid;place-items:center;
  background:linear-gradient(160deg,rgba(1,180,228,.18),rgba(144,206,161,.08));
  border:1px solid rgba(1,180,228,.3);margin-bottom:6px;
}
.dropzone-icon svg{width:26px;height:26px;stroke:var(--cyan);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dropzone h3{font-size:17px;font-weight:700;color:var(--text)}
.dropzone p{font-size:13px;color:var(--muted)}
.url-row{
  display:flex;gap:8px;padding:14px var(--pad);
  border-top:1px solid var(--line);background:var(--hdr);
  align-items:center;flex-wrap:wrap;
}
.url-row .or{
  font-size:12px;color:var(--muted);font-weight:600;
  text-transform:uppercase;letter-spacing:.06em;
  flex:0 0 auto;
}
.url-row input{flex:1 1 200px;min-width:0}
.url-row .hint{flex-basis:100%;margin-top:-4px}
/* Video preview state */
.video-preview{
  position:relative;aspect-ratio:16/9;background:#000;overflow:hidden;
}
.video-preview.vertical{aspect-ratio:9/16;max-height:70vh;margin:0 auto}
.video-preview iframe,.video-preview video{
  width:100%;height:100%;border:0;display:block;background:#000;
}
.video-preview.vertical iframe,.video-preview.vertical video{
  width:auto;max-width:100%;height:100%;margin:auto;
}
.video-meta-row{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:12px var(--pad);border-top:1px solid var(--line);background:var(--hdr);
  font-size:13px;color:var(--muted);
}
.video-meta-row .source-chip{
  display:inline-flex;align-items:center;gap:6px;padding:3px 10px;
  background:color-mix(in srgb,var(--cyan) 12%,transparent);
  border:1px solid color-mix(in srgb,var(--cyan) 28%,transparent);
  color:color-mix(in srgb,var(--cyan) 80%,var(--text));
  border-radius:999px;font-weight:600;font-size:12px;
}
.video-meta-row .source-chip svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.video-actions{margin-inline-start:auto;display:flex;gap:6px}
/* ───────────────── FORM ───────────────── */
.form-card{padding:var(--pad);display:grid;gap:16px}
.field{display:grid;gap:6px;position:relative}
.field-label{
  display:flex;align-items:center;justify-content:space-between;
  font-size:13px;color:var(--muted);font-weight:600;
}
.field-label .req{color:var(--red);margin-inline-start:2px}
.field-label .counter{font-size:11.5px;color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.field-label .counter.warn{color:var(--amber)}
.title-input{
  width:100%;background:none;border:0;box-shadow:none!important;
  font-family:var(--ar);font-size:clamp(20px,3vw,26px);font-weight:700;
  line-height:1.3;padding:4px 0;border-radius:0;
  border-bottom:1px solid var(--line);
}
.title-input::placeholder{color:var(--muted);font-weight:600}
.title-input:focus{border-bottom-color:var(--cyan)}
.desc-input{
  background:none;border:0;box-shadow:none!important;min-height:72px;
  padding:4px 0;border-bottom:1px solid var(--line);border-radius:0;
  color:var(--text);font-size:15px;resize:vertical;
}
.desc-input:focus{border-bottom-color:var(--cyan)}
/* Chips */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  background:color-mix(in srgb,var(--green) 16%,transparent);
  color:var(--green-ink);
  border:1px solid color-mix(in srgb,var(--green) 32%,transparent);
  border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;
}
.chip button{
  border:0;background:none;color:inherit;font-size:16px;line-height:1;
  opacity:.8;padding:0;
}
.chip button:hover{opacity:1}
/* ───────────────── ADVANCED ───────────────── */
details.advanced{
  border-radius:var(--radius);border:1px solid var(--line);
  background:var(--surface);overflow:hidden;
}
details.advanced > summary{
  padding:14px var(--pad);cursor:pointer;font-size:13.5px;font-weight:700;
  color:var(--muted);display:flex;align-items:center;gap:8px;
  list-style:none;user-select:none;transition:.15s;
}
details.advanced > summary::-webkit-details-marker{display:none}
details.advanced > summary::before{
  content:"";width:8px;height:8px;border-right:2px solid currentColor;
  border-bottom:2px solid currentColor;transform:rotate(45deg);
  transition:transform .2s;margin-inline-end:4px;
}
details.advanced[open] > summary::before{transform:rotate(-135deg)}
details.advanced > summary:hover{color:var(--text)}
details.advanced > .advanced-body{
  padding:0 var(--pad) var(--pad);
  display:grid;gap:14px;border-top:1px solid var(--line);padding-top:16px;
}
/* ───────────────── SIDEBAR ───────────────── */
.sidebar-card{padding:0;overflow:hidden}
.sidebar-card .body{padding:14px var(--pad)}
/* Live preview */
.preview-mini{
  display:flex;gap:10px;align-items:center;
  padding:10px;border-radius:var(--radius-sm);background:var(--sub);
  border:1px solid var(--line);
}
.preview-mini-thumb{
  width:92px;aspect-ratio:16/9;border-radius:8px;flex:none;
  background:var(--input) center/cover;
  display:grid;place-items:center;
  font-weight:700;font-size:18px;color:var(--muted);
  border:1px solid var(--line);overflow:hidden;
}
.preview-mini-thumb.has{color:transparent}
.preview-mini-body{min-width:0;flex:1}
.preview-mini-title{
  font-weight:700;font-size:14px;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;
}
.preview-mini-meta{
  color:var(--muted);font-size:12px;margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.preview-mini-time{
  color:var(--green-ink);font-size:12px;font-weight:600;margin-top:2px;
}
/* Thumbnail */
.thumb-box{
  aspect-ratio:16/9;border-radius:var(--radius-sm);
  border:1px dashed var(--line);background:var(--sub) center/cover;
  display:grid;place-items:center;color:var(--muted);font-size:13px;
  overflow:hidden;
}
.thumb-box.has{border-style:solid}
.thumb-box img{width:100%;height:100%;object-fit:cover;display:block}
.thumb-btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
/* Segmented control */
.seg{
  display:grid;gap:4px;padding:4px;background:var(--sub);border-radius:12px;
  border:1px solid var(--line);
}
.seg button{
  border:0;background:none;border-radius:8px;
  padding:7px 4px;font-size:13px;font-weight:600;color:var(--muted);
  transition:.15s;
}
.seg button.on{
  background:var(--surface);color:var(--text);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--cyan) 60%,transparent);
}
.seg.three{grid-template-columns:repeat(3,1fr)}
.seg.five{grid-template-columns:repeat(5,1fr)}
.seg.five button{font-size:11.5px;padding:7px 2px}
.seg.two{grid-template-columns:repeat(2,1fr)}
.field-inline{display:grid;gap:6px;margin-top:12px}
.field-inline:first-child{margin-top:0}
.field-inline label{
  font-size:12.5px;color:var(--muted);font-weight:600;
}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
/* ───────────────── PUBLISH FOOTER ───────────────── */
.publish-footer{
  position:fixed;bottom:0;left:0;right:0;z-index:18;
  background:var(--hdr);border-top:1px solid var(--line);
  backdrop-filter:blur(22px) saturate(150%);
  padding-bottom:env(safe-area-inset-bottom);
}
.publish-footer-inner{
  max-width:1200px;margin:0 auto;padding:12px 16px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}
.footer-status{
  display:flex;align-items:center;gap:8px;
  font-size:13px;color:var(--muted);font-weight:600;
  margin-inline-end:auto;min-width:0;
}
.status-dot{
  width:9px;height:9px;border-radius:50%;flex:none;
  background:var(--muted);transition:.2s;
}
.status-dot.ok{background:var(--green);box-shadow:0 0 0 3px rgba(144,206,161,.2)}
.status-dot.pending{background:var(--amber);box-shadow:0 0 0 3px rgba(245,166,35,.18)}
.status-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.footer-actions{display:flex;gap:8px;flex:none}
/* ───────────────── TOAST ───────────────── */
#toast{
  position:fixed;bottom:calc(80px + env(safe-area-inset-bottom));inset-inline:0;
  margin:auto;width:max-content;max-width:90vw;z-index:50;
  background:var(--hdr);border:1px solid var(--line);border-radius:12px;
  padding:10px 18px;box-shadow:var(--shadow);
  opacity:0;transform:translateY(10px);transition:.25s;
  pointer-events:none;font-size:14px;font-weight:600;
}
#toast.on{opacity:1;transform:none}
/* ───────────────── RESPONSIVE ───────────────── */
@media(max-width:980px){
  .layout{grid-template-columns:1fr}
  .column-side{position:static}
  body{padding-top:calc(78px + env(safe-area-inset-top))}
}
@media(max-width:480px){
  body{padding-inline:12px;padding-bottom:calc(150px + env(safe-area-inset-bottom))}
  .column-side{gap:12px}
  .header-status{display:none}
  .footer-status{font-size:12px}
  .footer-actions .btn{padding:9px 14px;font-size:13.5px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>

<header class="header"><div class="header-inner">
  <div class="logo">
    <span class="logo-mark"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span>
    <span class="logo-word">Cine<span>Aura</span></span>
  </div>
  <span class="header-status" id="headerStatus"><span class="dot"></span><span id="headerStatusText">مسودة</span></span>
  <button class="btn btn-icon" id="themeBtn" aria-label="تبديل الوضع">☀︎</button>
</div></header>

<main class="layout">

  <!-- ══════════════ MAIN COLUMN ══════════════ -->
  <section class="column-main">

    <!-- Video input / preview -->
    <div class="card video-section" id="videoSection">
      <!-- rendered by JS -->
    </div>

    <!-- Title / description / tags -->
    <div class="card form-card">
      <div class="field">
        <label class="field-label" for="titleInput">
          <span>العنوان<span class="req">*</span></span>
          <span class="counter" id="titleCounter">0 / 150</span>
        </label>
        <input type="text" id="titleInput" class="title-input"
               placeholder="أعطِ الفيديو عنوانًا جذابًا…" maxlength="150" autocomplete="off">
      </div>

      <div class="field">
        <label class="field-label" for="descInput">
          <span>الوصف</span>
          <span class="counter" id="descCounter">0 / 5000</span>
        </label>
        <textarea id="descInput" class="desc-input" rows="3"
                  placeholder="أخبر المشاهدين عن ماذا يدور الفيديو (اختياري)…" maxlength="5000"></textarea>
      </div>

      <div class="field">
        <label class="field-label" for="tagInput">
          <span>الوسوم</span>
          <span class="counter" id="tagCounter">0 / 12</span>
        </label>
        <input type="text" id="tagInput" placeholder="اكتب وسمًا ثم Enter…" autocomplete="off">
        <div class="chips" id="tagChips"></div>
      </div>
    </div>

    <!-- Advanced options -->
    <details class="advanced" id="advPanel">
      <summary>خيارات متقدمة — التحميل، الجمهور المخصص، قائمة التشغيل</summary>
      <div class="advanced-body">
        <label class="check-row">
          <input type="checkbox" id="vertical">
          <div>
            <b>فيديو عمودي (بورتريه)</b>
            <small>يُكتشف تلقائيًا لروابط YouTube Shorts و TikTok.</small>
          </div>
        </label>
        <label class="check-row">
          <input type="checkbox" id="allowDl">
          <div>
            <b>السماح بتحميل الفيديو</b>
            <small id="dlHint">يظهر زر التحميل في صفحة المشاهدة (ملفات / بث فقط).</small>
          </div>
        </label>
        <div class="field-inline">
          <label for="playlistSel">قائمة التشغيل</label>
          <select id="playlistSel"><option value="">بدون قائمة تشغيل</option></select>
        </div>
      </div>
    </details>

  </section>

  <!-- ══════════════ SIDEBAR ══════════════ -->
  <aside class="column-side">

    <!-- Live preview -->
    <div class="card sidebar-card">
      <div class="card-head"><span>معاينة مباشرة</span><span class="hint-inline" id="previewBadge">مسودة</span></div>
      <div class="body">
        <div class="preview-mini">
          <div class="preview-mini-thumb" id="previewThumb">U</div>
          <div class="preview-mini-body">
            <div class="preview-mini-title" id="previewTitle">بلا عنوان</div>
            <div class="preview-mini-meta" id="previewMeta">عام · العربية</div>
            <div class="preview-mini-time" id="previewTime">الآن</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Thumbnail -->
    <div class="card sidebar-card">
      <div class="card-head"><span>الصورة المصغرة</span></div>
      <div class="body">
        <div class="thumb-box" id="thumbBox">لا توجد صورة</div>
        <div class="thumb-btns">
          <button class="btn btn-sm" id="thumbUpload">رفع</button>
          <button class="btn btn-sm" id="thumbUrl">رابط</button>
          <button class="btn btn-sm" id="thumbFromVideo">من الفيديو</button>
          <button class="btn btn-sm btn-danger" id="thumbRemove">إزالة</button>
        </div>
        <input type="file" id="thumbFile" accept="image/*" hidden>
      </div>
    </div>

    <!-- Publish settings -->
    <div class="card sidebar-card">
      <div class="card-head"><span>إعدادات النشر</span></div>
      <div class="body">
        <div class="field-inline">
          <label>الظهور</label>
          <div class="seg three" id="visSeg">
            <button data-v="public" class="on">عام</button>
            <button data-v="excl">حصري</button>
            <button data-v="priv">خاص</button>
          </div>
          <p class="hint" id="visHint">يمكن للجميع العثور عليه ومشاهدته.</p>
        </div>

        <div class="field-inline" id="whenRow">
          <label>التوقيت</label>
          <div class="seg five" id="whenSeg">
            <button data-v="now" class="on">الآن</button>
            <button data-v="1h">ساعة</button>
            <button data-v="1d">يوم</button>
            <button data-v="1w">أسبوع</button>
            <button data-v="later">لاحقًا</button>
          </div>
          <input type="datetime-local" id="whenDate" hidden>
        </div>

        <details class="advanced" id="audienceDetails" hidden>
          <summary>خيارات الجمهور المتقدمة</summary>
          <div class="advanced-body">
            <label class="check-row">
              <input type="checkbox" id="followersOnly">
              <div><b>المتابعون فقط</b></div>
            </label>
            <div class="field-inline">
              <label for="countrySel">الدولة</label>
              <select id="countrySel"><option value="">إضافة دولة…</option></select>
              <div class="chips" id="countryChips"></div>
            </div>
            <div class="field-inline">
              <label>المستوى LV</label>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
                <input type="number" id="lvMin" min="0" max="10" value="0" aria-label="أدنى">
                <input type="number" id="lvMax" min="0" max="10" value="10" aria-label="أعلى">
              </div>
            </div>
            <div class="field-inline">
              <label for="tierSel">Balance tier (فما فوق)</label>
              <select id="tierSel"><option value="">بدون شرط</option></select>
            </div>
            <div class="field-inline">
              <label for="userInput">مستخدمون محددون</label>
              <div style="display:flex;gap:6px">
                <input type="text" id="userInput" placeholder="@username" dir="ltr">
                <button class="btn btn-sm" id="userAdd">إضافة</button>
              </div>
              <div class="chips" id="userChips"></div>
            </div>
            <div class="field-inline">
              <label for="passInput">كلمات سر الانضمام</label>
              <div style="display:flex;gap:6px">
                <input type="text" id="passInput" placeholder="كلمة سر" dir="ltr">
                <button class="btn btn-sm" id="passAdd">إضافة</button>
              </div>
              <div style="display:flex;gap:6px;margin-top:6px">
                <button class="btn btn-sm" id="passGen">توليد تلقائي</button>
              </div>
              <div class="chips" id="passChips"></div>
            </div>
          </div>
        </details>
      </div>
    </div>

    <!-- Metadata -->
    <div class="card sidebar-card">
      <div class="card-head"><span>معلومات</span></div>
      <div class="body">
        <div class="field-inline">
          <label for="langSel">اللغة</label>
          <select id="langSel"></select>
        </div>
        <div class="field-inline">
          <label>تصنيف العمر</label>
          <div class="seg five" id="ageSeg">
            <button data-v="3+" class="on">3+</button>
            <button data-v="6+">6+</button>
            <button data-v="13+">13+</button>
            <button data-v="16+">16+</button>
            <button data-v="18+">18+</button>
          </div>
          <p class="hint" id="ageHint">للجميع.</p>
        </div>
      </div>
    </div>

  </aside>
</main>

<!-- ══════════════ STICKY PUBLISH FOOTER ══════════════ -->
<footer class="publish-footer">
  <div class="publish-footer-inner">
    <div class="footer-status">
      <span class="status-dot pending" id="statusDot"></span>
      <span class="status-text" id="statusText">أضف فيديو وعنوانًا للبدء</span>
    </div>
    <div class="footer-actions">
      <button class="btn" id="saveDraftBtn">حفظ</button>
      <button class="btn btn-primary" id="publishBtn" disabled>طلب النشر</button>
    </div>
  </div>
</footer>

<div id="toast" role="status"></div>

<script>
/* ═══════════════════════════════════════════════════════════════
   STATE
   ═══════════════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const $$ = (sel, ctx = document) => ctx.querySelectorAll(sel);

const COUNTRIES = ["المغرب","الجزائر","تونس","ليبيا","مصر","السودان","السعودية","الإمارات","قطر","الكويت","البحرين","عُمان","اليمن","العراق","سوريا","لبنان","الأردن","فلسطين","موريتانيا","تركيا","فرنسا","ألمانيا","إسبانيا","المملكة المتحدة","الولايات المتحدة","كندا"];
const LANGS = ["العربية","English","Français","Español","Deutsch","Türkçe"];
const TIERS = "N1 N2 N3 K1 K2 K3 M1 M2 M3 B1 B2 B3".split(" ");
const PLAYLISTS = ["أفلام مختارة","وثائقيات","مسلسلات","أنمي","ألعاب","تقنية"];

const S = {
  source: null,             // { type, id, embed, src, thumb, vertical, downloadable, watch } | { type:"file", fileUrl, fileName }
  title: "", desc: "", tags: [],
  thumb: "",                // dataURL or remote URL
  lang: "العربية", age: "3+", playlist: "",
  vis: "public", when: "now", whenDate: null,
  vertical: false, allowDl: false,
  countries: [], users: [], passes: [],
  followersOnly: false, lvMin: 0, lvMax: 10, tier: ""
};

const DRAFT_KEY = "cineaura:videoDraft:v2";

/* ═══════════════════════════════════════════════════════════════
   UTILITIES
   ═══════════════════════════════════════════════════════════════ */
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const toast = msg => {
  const e = $("toast"); e.textContent = msg; e.classList.add("on");
  clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove("on"), 2400);
};
const fill = (sel, list, first) => {
  sel.innerHTML = (first != null ? `<option value="">${esc(first)}</option>` : "") + list.map(x => `<option>${esc(x)}</option>`).join("");
};
const formatDate = d => new Date(d).toLocaleString("ar", { year:"numeric", month:"long", day:"numeric", hour:"2-digit", minute:"2-digit" });
function chips(el, arr, onChange) {
  el.innerHTML = "";
  arr.forEach((v, i) => {
    const c = document.createElement("span"); c.className = "chip";
    c.innerHTML = esc(v) + '<button aria-label="حذف">×</button>';
    c.querySelector("button").onclick = () => { arr.splice(i, 1); chips(el, arr, onChange); onChange && onChange(); };
    el.appendChild(c);
  });
}
function whenLabel() {
  if (S.when === "now") return "الآن";
  if (S.when === "1h")  return "خلال ساعة";
  if (S.when === "1d")  return "خلال يوم";
  if (S.when === "1w")  return "خلال أسبوع";
  if (S.when === "later" && S.whenDate) return formatDate(S.whenDate);
  return "لاحقًا";
}

/* ═══════════════════════════════════════════════════════════════
   VIDEO PARSING
   ═══════════════════════════════════════════════════════════════ */
function parseVideo(url) {
  if (!url) return null;
  url = url.trim();
  if (!/^https?:\/\//i.test(url) && !/^[\w-]+\.\w+/.test(url)) return null;
  const u = url.startsWith("http") ? url : "https://" + url;

  let m = u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/|v\/))([\w-]{11})/);
  if (m) return { type:"youtube", id:m[1], embed:`https://www.youtube.com/embed/${m[1]}`,
    watch:`https://www.youtube.com/watch?v=${m[1]}`, vertical:/youtube\.com\/shorts\//.test(u),
    downloadable:false, thumb:`https://img.youtube.com/vi/${m[1]}/hqdefault.jpg` };

  m = u.match(/vimeo\.com\/(?:video\/)?(\d+)/);
  if (m) return { type:"vimeo", id:m[1], embed:`https://player.vimeo.com/video/${m[1]}`,
    watch:`https://vimeo.com/${m[1]}`, downloadable:false };

  m = u.match(/dailymotion\.com\/video\/([\w]+)/);
  if (m) return { type:"dailymotion", id:m[1], embed:`https://www.dailymotion.com/embed/video/${m[1]}`,
    watch:`https://www.dailymotion.com/video/${m[1]}`, downloadable:false };

  if (/facebook\.com|fb\.watch/.test(u))
    return { type:"facebook", embed:`https://www.facebook.com/plugins/video.php?href=${encodeURIComponent(u)}&show_text=false`,
      watch:u, downloadable:false };

  m = u.match(/drive\.google\.com\/file\/d\/([\w-]+)/);
  if (m) return { type:"drive", id:m[1], embed:`https://drive.google.com/file/d/${m[1]}/preview`,
    watch:`https://drive.google.com/file/d/${m[1]}/view`, downloadable:false };

  m = u.match(/tiktok\.com\/.*\/video\/(\d+)/);
  if (m) return { type:"tiktok", id:m[1], embed:`https://www.tiktok.com/embed/v2/${m[1]}`,
    watch:u, vertical:true, downloadable:false };

  if (/\.(mp4|webm|ogv|m3u8|mov)(\?|#|$)/i.test(u))
    return { type:"file", src:u, watch:u, vertical:false, downloadable:true };

  return null;
}

/* ═══════════════════════════════════════════════════════════════
   RENDER: video section
   ═══════════════════════════════════════════════════════════════ */
function renderVideoSection() {
  const sec = $("videoSection");

  if (!S.source) {
    sec.innerHTML = `
      <div class="dropzone" id="dropzone" role="button" tabindex="0" aria-label="أضف فيديو">
        <div class="dropzone-inner">
          <div class="dropzone-icon">
            <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="M10 9l5 3-5 3z"/></svg>
          </div>
          <h3>أضف فيديو</h3>
          <p>اسحب ملفًا أو انقر للاختيار</p>
        </div>
      </div>
      <div class="url-row">
        <span class="or">أو</span>
        <input type="url" id="urlInput" placeholder="الصق رابط فيديو…" dir="ltr" autocomplete="off">
        <p class="hint">YouTube · Vimeo · TikTok · Facebook · Drive · .mp4 · .m3u8</p>
        <input type="file" id="videoFile" accept="video/*" hidden>
      </div>`;
    bindDropzone();
    return;
  }

  // Video preview state
  const v = S.source;
  let media = "";
  if (v.type === "file" && v.fileUrl) {
    media = `<video src="${v.fileUrl}" controls playsinline preload="metadata"${S.thumb ? ` poster="${esc(S.thumb)}"` : ""}></video>`;
  } else if (v.type === "file" && v.src) {
    media = `<video src="${esc(v.src)}" controls playsinline${S.thumb ? ` poster="${esc(S.thumb)}"` : ""}></video>`;
  } else if (v.embed) {
    media = `<iframe src="${esc(v.embed)}" allowfullscreen loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>`;
  } else if (v.src) {
    media = `<video src="${esc(v.src)}" controls playsinline></video>`;
  }

  const sourceLabel = {
    youtube:"YouTube", vimeo:"Vimeo", dailymotion:"Dailymotion", facebook:"Facebook",
    drive:"Google Drive", tiktok:"TikTok", file: v.fileName ? `ملف: ${esc(v.fileName)}` : "ملف فيديو"
  }[v.type] || "فيديو";

  sec.innerHTML = `
    <div class="video-preview${S.vertical ? " vertical" : ""}" id="videoPreview">${media}</div>
    <div class="video-meta-row">
      <span class="source-chip">
        <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="M10 9l5 3-5 3z"/></svg>
        ${sourceLabel}
      </span>
      ${S.vertical ? '<span class="source-chip">عمودي</span>' : ""}
      <div class="video-actions">
        <button class="btn btn-sm" id="replaceVideoBtn">تغيير</button>
        <button class="btn btn-sm btn-danger" id="removeVideoBtn">إزالة</button>
      </div>
    </div>`;
  $("replaceVideoBtn").onclick = () => { clearSource(); };
  $("removeVideoBtn").onclick = () => { clearSource(); toast("تمت إزالة الفيديو"); };
}

function bindDropzone() {
  const dz = $("dropzone");
  const fileInput = $("videoFile");
  if (!dz) return;

  dz.addEventListener("click", () => fileInput.click());
  dz.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fileInput.click(); } });

  ["dragenter","dragover"].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.add("drag"); }));
  ["dragleave","dragend"].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.remove("drag"); }));
  dz.addEventListener("drop", e => {
    e.preventDefault(); dz.classList.remove("drag");
    const f = e.dataTransfer.files[0];
    if (f && f.type.startsWith("video/")) handleVideoFile(f);
    else if (f) toast("هذا الملف ليس فيديو");
  });

  fileInput.onchange = e => {
    const f = e.target.files[0]; if (f) handleVideoFile(f);
    e.target.value = "";
  };

  const urlInput = $("urlInput");
  let t = null;
  urlInput.oninput = e => {
    clearTimeout(t);
    const v = e.target.value.trim();
    if (!v) return;
    t = setTimeout(() => {
      const p = parseVideo(v);
      if (p) setSource(p);
    }, 500);
  };
  urlInput.onpaste = () => {
    // handle immediately on paste
    setTimeout(() => {
      const p = parseVideo(urlInput.value.trim());
      if (p) setSource(p);
    }, 30);
  };
}

function handleVideoFile(f) {
  const fileUrl = URL.createObjectURL(f);
  setSource({ type:"file", fileUrl, fileName:f.name, downloadable:true, vertical:false });
}

function setSource(src) {
  S.source = src;
  if (src.thumb && !S.thumb) setThumb(src.thumb, true);
  if (src.vertical) { S.vertical = true; $("vertical").checked = true; }
  $("allowDl").disabled = !src.downloadable;
  if (!src.downloadable) { S.allowDl = false; $("allowDl").checked = false; }
  $("dlHint").textContent = src.downloadable
    ? "يظهر زر التحميل في صفحة المشاهدة (ملفات / بث فقط)."
    : "التحميل غير متاح لهذا النوع من المصادر.";
  renderVideoSection();
  updateAll();
  scheduleSave();
  toast("تمت إضافة الفيديو ✓");
}

function clearSource() {
  if (S.source && S.source.fileUrl) URL.revokeObjectURL(S.source.fileUrl);
  S.source = null;
  S.vertical = false; S.allowDl = false;
  $("vertical").checked = false; $("allowDl").checked = false; $("allowDl").disabled = false;
  renderVideoSection();
  updateAll();
  scheduleSave();
}

/* ═══════════════════════════════════════════════════════════════
   THUMBNAIL
   ═══════════════════════════════════════════════════════════════ */
function setThumb(url, silent) {
  S.thumb = url || "";
  const box = $("thumbBox");
  if (url) {
    box.classList.add("has");
    box.innerHTML = `<img src="${esc(url)}" alt="">`;
  } else {
    box.classList.remove("has");
    box.innerHTML = "لا توجد صورة";
  }
  renderVideoSection(); // update poster
  updatePreview();
  updatePublishState();
  scheduleSave();
  if (!silent) toast(url ? "تم تعيين الصورة" : "تمت إزالة الصورة");
}
$("thumbUpload").onclick = () => $("thumbFile").click();
$("thumbFile").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => setThumb(r.result);
  r.readAsDataURL(f);
  e.target.value = "";
};
$("thumbUrl").onclick = () => {
  const u = prompt("رابط الصورة:", "https://");
  if (u && /^https?:\/\//.test(u.trim())) setThumb(u.trim());
};
$("thumbFromVideo").onclick = () => {
  if (S.source && S.source.thumb) return setThumb(S.source.thumb);
  toast("لا توجد صورة متاحة من هذا الفيديو");
};
$("thumbRemove").onclick = () => setThumb("");

/* ═══════════════════════════════════════════════════════════════
   LIVE PREVIEW
   ═══════════════════════════════════════════════════════════════ */
const VIS_LABELS = { public:"عام", excl:"حصري", priv:"خاص" };
function updatePreview() {
  const title = S.title.trim() || "بلا عنوان";
  $("previewTitle").textContent = title;
  $("previewMeta").textContent = `${VIS_LABELS[S.vis] || "عام"} · ${S.lang}`;
  $("previewTime").textContent = whenLabel();
  $("previewBadge").textContent = S.vis === "priv" ? "خاص" : S.vis === "excl" ? "حصري" : "مسودة";

  const t = $("previewThumb");
  if (S.thumb) {
    t.classList.add("has");
    t.style.backgroundImage = `url("${S.thumb}")`;
    t.textContent = "";
  } else {
    t.classList.remove("has");
    t.style.backgroundImage = "";
    t.textContent = "U";
  }
}

/* ═══════════════════════════════════════════════════════════════
   PUBLISH STATE
   ═══════════════════════════════════════════════════════════════ */
function updatePublishState() {
  const hasVideo = !!S.source;
  const hasTitle = S.title.trim().length > 0;
  const ready = hasVideo && hasTitle;

  const dot = $("statusDot");
  const text = $("statusText");
  const btn = $("publishBtn");

  btn.disabled = !ready;

  if (ready) {
    dot.className = "status-dot ok";
    text.textContent = S.when === "now" ? "جاهز للنشر الآن" : `جاهز — ${whenLabel()}`;
  } else {
    dot.className = "status-dot pending";
    if (!hasVideo && !hasTitle) text.textContent = "أضف فيديو وعنوانًا";
    else if (!hasVideo) text.textContent = "أضف فيديو";
    else text.textContent = "أضف عنوانًا";
  }
}

function updateAll() {
  updatePreview();
  updatePublishState();
}

/* ═══════════════════════════════════════════════════════════════
   FORM INPUT BINDINGS
   ═══════════════════════════════════════════════════════════════ */
$("titleInput").addEventListener("input", e => {
  S.title = e.target.value;
  const len = S.title.length, max = 150;
  const c = $("titleCounter");
  c.textContent = `${len} / ${max}`;
  c.classList.toggle("warn", len > max * 0.9);
  updateAll();
  scheduleSave();
});

$("descInput").addEventListener("input", e => {
  S.desc = e.target.value;
  const len = S.desc.length, max = 5000;
  const c = $("descCounter");
  c.textContent = `${len} / ${max}`;
  c.classList.toggle("warn", len > max * 0.9);
  scheduleSave();
});

$("tagInput").addEventListener("keydown", e => {
  if (e.key === "Enter") {
    e.preventDefault();
    const v = e.target.value.trim();
    if (!v) return;
    if (S.tags.includes(v)) return toast("هذا الوسم موجود");
    if (S.tags.length >= 12) return toast("الحد 12 وسمًا");
    S.tags.push(v);
    e.target.value = "";
    $("tagCounter").textContent = `${S.tags.length} / 12`;
    chips($("tagChips"), S.tags, scheduleSave);
    scheduleSave();
  }
});

/* ═══════════════════════════════════════════════════════════════
   SEGMENTS
   ═══════════════════════════════════════════════════════════════ */
function bindSeg(id, key, fn) {
  const root = $(id);
  root.querySelectorAll("button").forEach(b => {
    b.onclick = () => {
      root.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
      S[key] = b.dataset.v;
      fn && fn();
      updateAll();
      scheduleSave();
    };
  });
}
bindSeg("visSeg", "vis", () => {
  const H = {
    public:"يمكن للجميع العثور عليه ومشاهدته.",
    excl:"يظهر في البحث؛ فقط الجمهور الذي تختاره يمكنه المشاهدة.",
    priv:"فقط الأعضاء الذين تدرجهم يمكنهم العثور عليه ومشاهدته."
  };
  $("visHint").textContent = H[S.vis];
  $("audienceDetails").hidden = S.vis === "public";
});
bindSeg("whenSeg", "when", () => {
  const d = $("whenDate");
  d.hidden = S.when !== "later";
  if (S.when !== "later") S.whenDate = null;
  else if (!d.value) {
    const next = new Date(Date.now() + 60*60*1000);
    d.value = new Date(next.getTime() - next.getTimezoneOffset()*60000).toISOString().slice(0,16);
    S.whenDate = d.value;
  }
});
bindSeg("ageSeg", "age", () => {
  const H = { "3+":"للجميع.", "6+":"للأطفال.", "13+":"للمراهقين.", "16+":"للشباب.", "18+":"للبالغين." };
  $("ageHint").textContent = H[S.age] || "للجميع.";
});

$("whenDate").addEventListener("change", e => {
  S.whenDate = e.target.value;
  updateAll();
  scheduleSave();
});

/* ═══════════════════════════════════════════════════════════════
   SELECTS
   ═══════════════════════════════════════════════════════════════ */
fill($("langSel"), LANGS);
$("langSel").value = S.lang;
$("langSel").onchange = e => { S.lang = e.target.value; updatePreview(); scheduleSave(); };

fill($("playlistSel"), PLAYLISTS, "بدون قائمة تشغيل");
$("playlistSel").onchange = e => { S.playlist = e.target.value; scheduleSave(); };

fill($("countrySel"), COUNTRIES, "إضافة دولة…");
$("countrySel").onchange = e => {
  const v = e.target.value;
  if (v && !S.countries.includes(v)) S.countries.push(v);
  e.target.value = "";
  chips($("countryChips"), S.countries, scheduleSave);
  scheduleSave();
};

$("tierSel").innerHTML = '<option value="">بدون شرط</option>' + TIERS.map(t => `<option>${t}</option>`).join("");
$("tierSel").onchange = e => { S.tier = e.target.value; scheduleSave(); };

$("lvMin").oninput = e => { S.lvMin = +e.target.value || 0; scheduleSave(); };
$("lvMax").oninput = e => { S.lvMax = +e.target.value || 10; scheduleSave(); };

/* Users */
function addUser() {
  let v = $("userInput").value.trim().replace(/^@?/, "@");
  if (v.length > 1 && !S.users.includes(v)) S.users.push(v);
  $("userInput").value = "";
  chips($("userChips"), S.users, scheduleSave);
  scheduleSave();
}
$("userAdd").onclick = addUser;
$("userInput").onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); addUser(); } };

/* Passwords */
function addPass(v) {
  v = (v || $("passInput").value).trim();
  if (v && !S.passes.includes(v)) S.passes.push(v);
  $("passInput").value = "";
  chips($("passChips"), S.passes, scheduleSave);
  scheduleSave();
}
$("passAdd").onclick = () => addPass();
$("passInput").onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); addPass(); } };
$("passGen").onclick = () => {
  const c = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  addPass(Array.from(crypto.getRandomValues(new Uint8Array(8)), x => c[x % c.length]).join("").replace(/(.{4})/, "$1-"));
};

/* Followers-only toggle */
$("followersOnly").onchange = e => { S.followersOnly = e.target.checked; scheduleSave(); };

/* Vertical & Allow download */
$("vertical").onchange = e => {
  S.vertical = e.target.checked;
  renderVideoSection();
  scheduleSave();
};
$("allowDl").onchange = e => { S.allowDl = e.target.checked; scheduleSave(); };

/* ═══════════════════════════════════════════════════════════════
   GLOBAL PASTE (paste URL anywhere)
   ═══════════════════════════════════════════════════════════════ */
document.addEventListener("paste", e => {
  if (S.source) return; // already have one
  const el = e.target;
  if (el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.isContentEditable)) return;
  const text = (e.clipboardData || window.clipboardData).getData("text/plain").trim();
  if (!text) return;
  const p = parseVideo(text);
  if (p) { e.preventDefault(); setSource(p); toast("تمت إضافة الفيديو من الحافظة ✓"); }
});

/* ═══════════════════════════════════════════════════════════════
   AUTO-SAVE / DRAFT
   ═══════════════════════════════════════════════════════════════ */
let saveTimer = null;
function scheduleSave() {
  clearTimeout(saveTimer);
  const hs = $("headerStatus");
  hs.classList.remove("saved");
  saveTimer = setTimeout(persistDraft, 900);
}
function persistDraft() {
  try {
    const draft = {
      title: S.title, desc: S.desc, tags: S.tags, thumb: S.thumb,
      lang: S.lang, age: S.age, playlist: S.playlist,
      vis: S.vis, when: S.when, whenDate: S.whenDate,
      vertical: S.vertical, allowDl: S.allowDl,
      countries: S.countries, users: S.users, passes: S.passes,
      followersOnly: S.followersOnly, lvMin: S.lvMin, lvMax: S.lvMax, tier: S.tier,
      // only save URL-based source (files cannot be saved)
      source: S.source && S.source.type !== "file" ? S.source : null
    };
    localStorage.setItem(DRAFT_KEY, JSON.stringify(draft));
    const hs = $("headerStatus");
    hs.classList.add("saved");
    $("headerStatusText").textContent = "محفوظ";
    clearTimeout(persistDraft.t);
    persistDraft.t = setTimeout(() => {
      hs.classList.remove("saved");
      $("headerStatusText").textContent = "مسودة";
    }, 2200);
  } catch (e) { /* ignore quota errors */ }
}
function restoreDraft() {
  try {
    const raw = localStorage.getItem(DRAFT_KEY);
    if (!raw) return false;
    const d = JSON.parse(raw);
    if (!d || (!d.title && !d.desc && !d.source)) return false;

    S.title = d.title || ""; $("titleInput").value = S.title;
    $("titleCounter").textContent = `${S.title.length} / 150`;

    S.desc = d.desc || ""; $("descInput").value = S.desc;
    $("descCounter").textContent = `${S.desc.length} / 5000`;

    S.tags = d.tags || []; $("tagCounter").textContent = `${S.tags.length} / 12`;
    chips($("tagChips"), S.tags, scheduleSave);

    S.lang = d.lang || "العربية"; $("langSel").value = S.lang;
    S.age = d.age || "3+";
    $$("#ageSeg button").forEach(b => b.classList.toggle("on", b.dataset.v === S.age));

    S.playlist = d.playlist || ""; $("playlistSel").value = S.playlist;

    S.vis = d.vis || "public";
    $$("#visSeg button").forEach(b => b.classList.toggle("on", b.dataset.v === S.vis));
    $("visHint").textContent = { public:"يمكن للجميع العثور عليه ومشاهدته.", excl:"يظهر في البحث؛ فقط الجمهور الذي تختاره يمكنه المشاهدة.", priv:"فقط الأعضاء الذين تدرجهم يمكنهم العثور عليه ومشاهدته." }[S.vis];
    $("audienceDetails").hidden = S.vis === "public";

    S.when = d.when || "now";
    $$("#whenSeg button").forEach(b => b.classList.toggle("on", b.dataset.v === S.when));
    $("whenDate").hidden = S.when !== "later";
    if (d.whenDate) { $("whenDate").value = d.whenDate; S.whenDate = d.whenDate; }

    S.vertical = !!d.vertical; $("vertical").checked = S.vertical;
    S.allowDl = !!d.allowDl; $("allowDl").checked = S.allowDl;

    S.countries = d.countries || []; chips($("countryChips"), S.countries, scheduleSave);
    S.users = d.users || []; chips($("userChips"), S.users, scheduleSave);
    S.passes = d.passes || []; chips($("passChips"), S.passes, scheduleSave);
    S.followersOnly = !!d.followersOnly; $("followersOnly").checked = S.followersOnly;
    S.lvMin = d.lvMin ?? 0; S.lvMax = d.lvMax ?? 10;
    $("lvMin").value = S.lvMin; $("lvMax").value = S.lvMax;
    S.tier = d.tier || ""; $("tierSel").value = S.tier;

    if (d.source) { S.source = d.source; }
    if (d.thumb) { S.thumb = d.thumb; }

    return true;
  } catch (e) { return false; }
}

/* ═══════════════════════════════════════════════════════════════
   PUBLISH
   ═══════════════════════════════════════════════════════════════ */
$("saveDraftBtn").onclick = () => { persistDraft(); toast("تم حفظ المسودة"); };

$("publishBtn").onclick = () => {
  if (!S.source) return toast("أضف فيديو أولًا");
  if (!S.title.trim()) return toast("أضف عنوانًا"), $("titleInput").focus();
  if (S.when === "later") {
    if (!S.whenDate) return toast("حدد موعد النشر");
    if (new Date(S.whenDate) <= new Date()) return toast("اختر موعدًا في المستقبل");
  }
  if (S.vis === "priv" && !S.users.length && !S.passes.length)
    return toast("أضف مستخدمًا أو كلمة سر واحدة على الأقل");

  const label = S.when === "now" ? "قيد المراجعة" : "مجدول";
  $("headerStatusText").textContent = label;
  $("statusDot").className = "status-dot ok";
  $("statusText").textContent = S.when === "now" ? "تم إرسال الفيديو للمراجعة ✓" : `تمت الجدولة — ${whenLabel()}`;
  $("publishBtn").disabled = true;

  // clear draft since published
  try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
  toast(S.when === "now" ? "تم إرسال الفيديو للمراجعة ✓" : "تمت جدولة الفيديو ✓");
};

/* Keyboard shortcut: Ctrl/Cmd + Enter */
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
    e.preventDefault();
    if (!$("publishBtn").disabled) $("publishBtn").click();
  }
});

/* ═══════════════════════════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════════════════════════ */
(function init() {
  const restored = restoreDraft();
  renderVideoSection();
  updateAll();
  if (restored) toast("تم استعادة المسودة السابقة");
})();
</script>

<!-- ═══════════════════════════════════════════════════════════════
     THEME SYSTEM
     ═══════════════════════════════════════════════════════════════ -->
<script id="artheme-js">
(function () {
  'use strict';
  if (window.__arthemeInited) return;
  window.__arthemeInited = true;

  try {
    var qs = new URLSearchParams(location.search);
    if (qs.get('reset-theme') === '1') {
      try { localStorage.removeItem('cineaura:style'); } catch (e) {}
      try { localStorage.removeItem('cineaura:theme'); } catch (e) {}
      qs.delete('reset-theme');
      var clean = location.pathname + (qs.toString() ? '?' + qs.toString() : '') + location.hash;
      location.replace(clean); return;
    }
  } catch (e) {}

  var THEMES = [
    { id:'default',   name:'CineAura',   accent:'#01b4e4' },
    { id:'facebook',  name:'Facebook',   accent:'#1877f2' },
    { id:'youtube',   name:'YouTube',    accent:'#ff0000' },
    { id:'instagram', name:'Instagram',  accent:'#d62976' },
    { id:'netflix',   name:'Netflix',    accent:'#e50914' },
    { id:'prime',     name:'Prime',      accent:'#00a8e1' },
    { id:'appletv',   name:'Apple TV+',  accent:'#2997ff' },
    { id:'win7',      name:'Windows 7',  accent:'#2a7bd8' },
    { id:'win8',      name:'Windows 8',  accent:'#0078d7' },
    { id:'win10',     name:'Windows 10', accent:'#0078d4' },
    { id:'win11',     name:'Windows 11', accent:'#0067c0' },
    { id:'macos',     name:'macOS',      accent:'#007aff' },
    { id:'android',   name:'Android',    accent:'#3ddc84' },
    { id:'ios',       name:'iOS',        accent:'#007aff' }
  ];
  var VALID = THEMES.map(function (t) { return t.id; });
  var STYLE_KEY = 'cineaura:style', MODE_KEY = 'cineaura:theme';
  var okS = function (v) { return VALID.indexOf(v) !== -1; };
  var okM = function (v) { return v === 'day' || v === 'night'; };
  var read = function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } };
  var save = function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} };
  var del  = function (k) { try { localStorage.removeItem(k); } catch (e) {} };

  function boot() {
    var root = document.documentElement;
    var s = read(STYLE_KEY), m = read(MODE_KEY);
    if (s && okS(s)) root.setAttribute('data-style', s);
    else if (s) del(STYLE_KEY);
    else if (!root.getAttribute('data-style')) root.setAttribute('data-style', 'default');

    if (m && okM(m)) root.setAttribute('data-theme', m);
    else if (m) del(MODE_KEY);
    else if (!root.getAttribute('data-theme')) {
      try { root.setAttribute('data-theme', matchMedia('(prefers-color-scheme: light)').matches ? 'day' : 'night'); }
      catch (e) { root.setAttribute('data-theme', 'night'); }
    }

    var hdrBtn = document.getElementById('themeBtn');
    function syncHdr() {
      if (!hdrBtn) return;
      var day = root.getAttribute('data-theme') === 'day';
      hdrBtn.textContent = day ? '☾' : '☀︎';
      hdrBtn.title = day ? 'التبديل إلى الوضع الليلي' : 'التبديل إلى الوضع النهاري';
    }
    syncHdr();
    if (hdrBtn) {
      hdrBtn.onclick = function () {
        var next = root.getAttribute('data-theme') === 'day' ? 'night' : 'day';
        root.setAttribute('data-theme', next);
        save(MODE_KEY, next);
        syncHdr();
        syncUI();
      };
    }

    var frag = document.createElement('div');
    frag.innerHTML =
      '<button type="button" id="artheme-btn" aria-label="تغيير المظهر" aria-expanded="false" aria-controls="artheme-panel">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
          '<circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/>' +
          '<circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/>' +
          '<circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/>' +
          '<circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/>' +
          '<path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/>' +
        '</svg>' +
        '<span class="at-dot" aria-hidden="true"></span>' +
      '</button>' +
      '<div id="artheme-panel" role="dialog" aria-label="إعدادات المظهر">' +
        '<div class="at-head"><h3>المظهر</h3><button type="button" class="at-close" aria-label="إغلاق">&times;</button></div>' +
        '<div class="at-mode" role="radiogroup" aria-label="وضع الألوان">' +
          '<button type="button" role="radio" data-mode="day" aria-checked="false">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>' +
            'نهاري</button>' +
          '<button type="button" role="radio" data-mode="night" aria-checked="false">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>' +
            'ليلي</button>' +
        '</div>' +
        '<div class="at-grid" role="radiogroup" aria-label="نمط الثيم"></div>' +
        '<div class="at-foot">' +
          '<button type="button" class="at-reset">إعادة تعيين</button>' +
          '<span class="at-cur"></span>' +
        '</div>' +
      '</div>';
    while (frag.firstChild) document.body.appendChild(frag.firstChild);

    var btn = document.getElementById('artheme-btn');
    var panel = document.getElementById('artheme-panel');
    var grid = panel.querySelector('.at-grid');

    THEMES.forEach(function (t) {
      var card = document.createElement('button');
      card.type = 'button'; card.className = 'at-card';
      card.setAttribute('role', 'radio');
      card.setAttribute('aria-checked', 'false');
      card.dataset.style = t.id;
      card.style.setProperty('--at-accent', t.accent);
      card.innerHTML =
        '<span class="at-prev" aria-hidden="true">' +
          '<span class="at-prev-bar">' +
            '<span class="at-prev-dot"></span><span class="at-prev-dot"></span><span class="at-prev-dot"></span>' +
          '</span>' +
          '<span class="at-prev-body">Aa</span>' +
        '</span>' +
        '<span class="at-name"></span>';
      card.querySelector('.at-name').textContent = t.name;
      grid.appendChild(card);
    });

    function curS() { return root.getAttribute('data-style') || 'default'; }
    function curM() { return root.getAttribute('data-theme') || 'night'; }

    function syncUI() {
      var s = curS(), m = curM();
      grid.querySelectorAll('.at-card').forEach(function (c) {
        c.setAttribute('aria-checked', c.dataset.style === s ? 'true' : 'false');
      });
      panel.querySelectorAll('.at-mode button').forEach(function (b) {
        b.setAttribute('aria-checked', b.dataset.mode === m ? 'true' : 'false');
      });
      var t = THEMES.filter(function (x) { return x.id === s; })[0];
      var dot = btn.querySelector('.at-dot');
      if (t && dot) dot.style.background = t.accent;
      var cur = panel.querySelector('.at-cur');
      if (cur) cur.textContent = 'الحالي: ' + (t ? t.name : 'CineAura') + ' · ' + (m === 'day' ? 'نهاري' : 'ليلي');
      syncHdr();
    }

    function applyStyle(id) {
      if (!okS(id)) return;
      root.setAttribute('data-style', id);
      save(STYLE_KEY, id);
      syncUI();
    }
    function applyMode(mode) {
      if (!okM(mode)) return;
      root.setAttribute('data-theme', mode);
      save(MODE_KEY, mode);
      syncUI();
    }
    function resetAll() {
      del(STYLE_KEY); del(MODE_KEY);
      root.setAttribute('data-style', 'default');
      root.setAttribute('data-theme', 'night');
      syncUI();
    }

    grid.addEventListener('click', function (e) {
      var card = e.target.closest('.at-card');
      if (card) applyStyle(card.dataset.style);
    });
    panel.querySelector('.at-mode').addEventListener('click', function (e) {
      var b = e.target.closest('button[data-mode]');
      if (b) applyMode(b.dataset.mode);
    });
    panel.querySelector('.at-reset').addEventListener('click', resetAll);

    var open = false;
    function openP()  { open = true;  panel.classList.add('open');  btn.setAttribute('aria-expanded', 'true');  syncUI(); }
    function closeP() { open = false; panel.classList.remove('open'); btn.setAttribute('aria-expanded', 'false'); }
    btn.addEventListener('click', function () { open ? closeP() : openP(); });
    panel.querySelector('.at-close').addEventListener('click', closeP);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && open) closeP(); });
    document.addEventListener('click', function (e) {
      if (!open) return;
      if (panel.contains(e.target) || btn.contains(e.target)) return;
      closeP();
    });

    syncUI();

    window.CineAuraTheme = {
      set: applyStyle, setMode: applyMode, reset: resetAll,
      list: THEMES.slice(),
      current: function () { return { style: curS(), mode: curM() }; }
    };
  }

  try { boot(); } catch (err) { console.error('[artheme] init failed:', err); }
})();
</script>

<!DOCTYPE html>
<html lang="ar" dir="rtl" data-style="default" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مشاهدة الفيديوهات — CineAura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Outfit:wght@400;600;750;800&display=swap" rel="stylesheet">
<style>
/* ═════════════ BASE ═════════════ */
:root{
  --cyan:#01b4e4; --green:#90cea1; --green-ink:#90cea1;
  --text:#f4fbff; --muted:#9bb0c2;
  --line:rgba(145,196,220,.16);
  --sans:"Outfit","Cairo","Segoe UI",sans-serif;
  --ar:"Cairo","Outfit",sans-serif;
  --surface:rgba(9,22,36,.62); --hdr:rgba(7,18,30,.9);
  --input:rgba(4,14,24,.55); --sub:rgba(255,255,255,.05);
  --red:#ff6b6b; --amber:#f5a623;
  --shadow:0 24px 80px rgba(0,0,0,.42);
  --bg:linear-gradient(180deg,#08131e,#070f18 46%,#0a1826);
  --radius:16px; --radius-sm:12px;
}
html[data-theme="day"]{
  --text:#0d253f; --muted:#4a6578; --line:rgba(13,37,63,.12);
  --surface:rgba(255,255,255,.86); --hdr:rgba(255,255,255,.94);
  --input:rgba(255,255,255,.95); --sub:rgba(13,37,63,.05);
  --red:#d93025; --amber:#b06000;
  --shadow:0 18px 48px rgba(13,37,63,.1);
  --bg:linear-gradient(180deg,#f4f8fb,#e8f1f6 48%,#dceaf3);
}
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%;padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{
  min-height:100%;background:var(--bg);background-attachment:fixed;
  color:var(--text);font-family:var(--ar);font-size:15px;line-height:1.7;
  padding:calc(84px + env(safe-area-inset-top)) 16px 60px;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(520px 320px at 85% 6%,rgba(1,180,228,.14),transparent 70%),
    radial-gradient(480px 300px at 10% 90%,rgba(144,206,161,.10),transparent 70%);
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
input[type=text],input[type=search]{
  width:100%;background:var(--input);border:1px solid var(--line);
  border-radius:999px;padding:10px 16px;outline:none;color-scheme:dark;
}
html[data-theme="day"] input{color-scheme:light}
input:focus{border-color:rgba(1,180,228,.55);box-shadow:0 0 0 4px rgba(1,180,228,.12)}
.ic{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:middle}
.ic-fill{fill:currentColor;stroke:none}
/* ═════════════ HEADER ═════════════ */
.header{
  position:fixed;top:calc(14px + env(safe-area-inset-top,0px));
  inset-inline:12px;z-index:30;max-width:1500px;margin:auto;
}
.header-inner{
  display:flex;align-items:center;gap:12px;padding:10px 14px;
  border:1px solid var(--line);border-radius:var(--radius);
  background:var(--hdr);backdrop-filter:blur(22px) saturate(150%);
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.08);
}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none;color:inherit;flex:none}
.logo-mark{
  width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(160deg,rgba(1,180,228,.28),rgba(144,206,161,.12));
  border:1px solid rgba(1,180,228,.35);
}
.logo-mark svg{width:14px;height:14px;fill:var(--green)}
.logo-word{font-family:var(--sans);font-weight:750;font-size:18px;letter-spacing:-.04em}
.logo-word span{
  background:linear-gradient(90deg,var(--cyan),var(--green-ink));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.search-wrap{
  flex:1;max-width:620px;margin:0 auto;position:relative;
  display:flex;align-items:center;
}
.search-wrap .ic-search{
  position:absolute;inset-inline-start:14px;width:16px;height:16px;
  color:var(--muted);pointer-events:none;
}
.search-wrap input{padding-inline-start:40px;padding-inline-end:38px}
.search-wrap .clear-btn{
  position:absolute;inset-inline-end:10px;width:26px;height:26px;
  border-radius:50%;display:grid;place-items:center;
  color:var(--muted);background:var(--sub);
}
.search-wrap .clear-btn:hover{color:var(--text)}
.search-wrap .clear-btn .ic{width:14px;height:14px}
.btn-icon{
  width:38px;height:38px;border-radius:12px;
  border:1px solid var(--line);background:var(--sub);
  display:grid;place-items:center;font-size:16px;
  transition:.15s;flex:none;
}
.btn-icon:hover{border-color:rgba(1,180,228,.5);background:rgba(1,180,228,.08)}
.user-chip{
  display:flex;align-items:center;gap:8px;padding:5px 12px 5px 6px;
  border-radius:999px;border:1px solid var(--line);background:var(--sub);
  flex:none;font-size:13px;font-weight:600;
}
.user-avatar{
  width:28px;height:28px;border-radius:50%;
  background:linear-gradient(135deg,var(--cyan),var(--green-ink));
  display:grid;place-items:center;color:#fff;font-size:12px;font-weight:800;
}
/* ═════════════ BUTTONS ═════════════ */
.btn{
  border:1px solid var(--line);background:var(--sub);
  border-radius:10px;padding:8px 16px;
  font-weight:600;font-size:13.5px;transition:.18s;
}
.btn:hover{border-color:rgba(1,180,228,.5);background:rgba(1,180,228,.08)}
.btn-sm{padding:5px 12px;font-size:12.5px;border-radius:9px}
.btn-primary{
  background:linear-gradient(90deg,#01b4e4,#2ec7ea 48%,#90cea1 160%);
  color:#032541;border:0;box-shadow:0 8px 24px rgba(1,180,228,.22);
}
.btn-primary:hover:not(:disabled){box-shadow:0 12px 30px rgba(1,180,228,.34)}
/* ═════════════ BROWSE VIEW ═════════════ */
.browse{max-width:1500px;margin:0 auto;position:relative;z-index:1}
.browse-hero{text-align:center;padding:16px 0 36px}
.browse-hero h1{
  font-size:clamp(24px,4vw,38px);font-weight:800;letter-spacing:-.02em;
  margin-bottom:8px;
  background:linear-gradient(90deg,var(--cyan),var(--green-ink));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.browse-hero p{color:var(--muted);font-size:15px;max-width:560px;margin:0 auto}
/* Categories */
.category{margin-bottom:42px}
.category-head{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;margin-bottom:14px;
}
.cat-title-group{display:flex;align-items:center;gap:10px;min-width:0}
.cat-badge{
  width:36px;height:36px;border-radius:10px;
  display:grid;place-items:center;color:#fff;flex:none;
}
.cat-badge .ic{width:18px;height:18px;stroke-width:2.2}
.cat-title-group h2{font-size:20px;font-weight:700;letter-spacing:-.02em}
.cat-count{
  font-size:11.5px;color:var(--muted);background:var(--sub);
  padding:2px 10px;border-radius:999px;flex:none;font-weight:600;
}
.cat-tools{display:flex;gap:6px;align-items:center;flex:none}
.carousel-controls{display:flex;gap:6px}
.carousel-btn{
  width:34px;height:34px;border-radius:50%;
  border:1px solid var(--line);background:var(--sub);
  display:grid;place-items:center;color:var(--muted);
  transition:.15s;
}
.carousel-btn:hover{background:var(--surface);color:var(--text);border-color:var(--cyan)}
.carousel-btn .ic{width:16px;height:16px}
/* Carousel */
.carousel{position:relative}
.carousel-track{
  display:flex;gap:16px;
  overflow-x:auto;overflow-y:hidden;
  scroll-snap-type:x mandatory;
  padding-bottom:10px;
  scrollbar-width:thin;scrollbar-color:var(--line) transparent;
  -webkit-overflow-scrolling:touch;
}
.carousel-track::-webkit-scrollbar{height:8px}
.carousel-track::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.carousel-track::-webkit-scrollbar-track{background:transparent}
/* Video card */
.video-card{
  flex:0 0 285px;scroll-snap-align:start;
  cursor:pointer;border-radius:var(--radius-sm);
  transition:transform .18s;
  outline-offset:4px;
}
.video-card:hover{transform:translateY(-3px)}
.card-thumb{
  aspect-ratio:16/9;border-radius:var(--radius-sm);overflow:hidden;
  position:relative;background:var(--sub);border:1px solid var(--line);
}
.thumb-gradient{
  width:100%;height:100%;position:relative;
  display:grid;place-items:center;
  background:
    radial-gradient(circle at 30% 20%,color-mix(in srgb,var(--c2) 55%,transparent),transparent 58%),
    linear-gradient(135deg,var(--c1),var(--c2));
}
.thumb-gradient::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(45deg,rgba(255,255,255,.035) 0 2px,transparent 2px 12px);
}
.thumb-letter{
  font-family:var(--sans);font-size:54px;font-weight:800;
  color:rgba(255,255,255,.92);
  text-shadow:0 4px 24px rgba(0,0,0,.45);
  z-index:1;
}
.thumb-duration{
  position:absolute;bottom:6px;inset-inline-start:6px;z-index:2;
  background:rgba(0,0,0,.78);color:#fff;
  font-size:11px;font-weight:700;padding:2px 6px;border-radius:4px;
  font-variant-numeric:tabular-nums;
}
.rank-badge{
  position:absolute;top:6px;inset-inline-end:6px;z-index:2;
  background:linear-gradient(135deg,#f5a623,#ff6b6b);
  color:#fff;font-size:11px;font-weight:800;
  padding:2px 8px;border-radius:999px;
  box-shadow:0 2px 10px rgba(0,0,0,.3);
}
.card-play-overlay{
  position:absolute;inset:0;z-index:1;
  display:grid;place-items:center;
  background:rgba(0,0,0,.3);
  opacity:0;transition:.2s;
}
.card-play-overlay .ic{width:46px;height:46px;fill:#fff;stroke:none;opacity:.95;filter:drop-shadow(0 4px 16px rgba(0,0,0,.5))}
.video-card:hover .card-play-overlay{opacity:1}
/* Card info */
.card-title{
  font-size:14.5px;font-weight:700;line-height:1.4;
  margin:10px 0 6px;min-height:2.8em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;
}
.card-stats{
  display:flex;gap:10px;flex-wrap:wrap;
  font-size:12px;color:var(--muted);margin-bottom:6px;
}
.stat{display:inline-flex;align-items:center;gap:4px}
.stat .ic{width:13px;height:13px}
.card-pub{
  display:flex;align-items:center;gap:6px;
  font-size:12px;color:var(--muted);
}
.mini-avatar{
  width:20px;height:20px;border-radius:50%;
  display:grid;place-items:center;flex:none;
  font-size:10px;font-weight:800;color:#fff;
}
.card-pub-name{font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:120px}
.card-date{margin-inline-start:auto;white-space:nowrap;font-size:11.5px}
/* Expanded */
.category.expanded .carousel-track{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  overflow:visible;scroll-snap-type:none;
}
.category.expanded .video-card{flex:none;width:auto}
.category.expanded .carousel-controls{display:none}
/* Search results */
.results-head{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;margin-bottom:20px;flex-wrap:wrap;
}
.results-head h2{font-size:20px;font-weight:700}
.results-head h2 em{color:var(--cyan);font-style:normal}
.results-count{color:var(--muted);font-size:13px}
.results-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:22px 18px;
}
.results-grid .video-card{width:auto;flex:none}
.empty-state{
  text-align:center;padding:60px 20px;color:var(--muted);
}
.empty-state .ic{width:56px;height:56px;opacity:.4;margin-bottom:14px}
.empty-state h3{color:var(--text);font-size:18px;margin-bottom:6px;font-weight:700}
/* ═════════════ WATCH VIEW ═════════════ */
.watch-wrap{
  max-width:1500px;margin:0 auto;position:relative;z-index:1;
  display:grid;grid-template-columns:minmax(0,1fr) 380px;
  gap:26px;align-items:start;
}
.watch-main{min-width:0}
.back-btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:8px 14px;border-radius:10px;
  border:1px solid var(--line);background:var(--sub);
  font-size:13px;font-weight:600;margin-bottom:16px;
  transition:.15s;
}
.back-btn:hover{border-color:var(--cyan);color:var(--cyan)}
.back-btn .ic{width:15px;height:15px;transform:scaleX(-1)}
/* Player */
.player-wrap{
  aspect-ratio:16/9;border-radius:var(--radius);
  overflow:hidden;background:#000;
  border:1px solid var(--line);
  box-shadow:0 20px 60px rgba(0,0,0,.4);
}
.player-wrap iframe{width:100%;height:100%;border:0;display:block}
/* Title + meta */
.watch-title{
  font-size:clamp(19px,2.4vw,26px);line-height:1.35;
  font-weight:800;margin:18px 0 8px;letter-spacing:-.01em;
}
.watch-meta{
  display:flex;gap:8px 16px;flex-wrap:wrap;
  color:var(--muted);font-size:13.5px;
  margin-bottom:14px;align-items:center;
}
.watch-meta .stat{font-weight:600}
.watch-meta .stat .ic{width:15px;height:15px}
/* Actions */
.watch-actions{
  display:flex;gap:8px;flex-wrap:wrap;
  padding:14px 0;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  margin-bottom:18px;
}
.action-btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:9px 18px;border-radius:999px;
  border:1px solid var(--line);background:var(--sub);
  font-weight:700;font-size:13.5px;
  transition:.15s;
}
.action-btn .ic{width:16px;height:16px}
.action-btn:hover{background:var(--surface);border-color:var(--cyan)}
.action-btn.active{
  background:color-mix(in srgb,var(--cyan) 15%,transparent);
  border-color:var(--cyan);color:var(--cyan);
}
.action-btn.danger:hover{border-color:var(--red);color:var(--red)}
.action-btn.dislike.active{
  background:color-mix(in srgb,var(--red) 12%,transparent);
  border-color:var(--red);color:var(--red);
}
/* Description */
.watch-desc{
  background:var(--sub);border-radius:var(--radius-sm);
  padding:16px 18px;margin-bottom:20px;
  font-size:14px;line-height:1.9;white-space:pre-wrap;
  border:1px solid var(--line);
}
/* Publisher */
.pub-card{
  display:flex;gap:14px;padding:18px;
  background:var(--surface);
  border:1px solid var(--line);border-radius:var(--radius);
  margin-bottom:22px;
}
.pub-avatar{
  width:60px;height:60px;border-radius:50%;
  display:grid;place-items:center;flex:none;
  font-size:24px;font-weight:800;color:#fff;
  box-shadow:0 8px 24px rgba(0,0,0,.25);
}
.pub-main{flex:1;min-width:0}
.pub-name-row{display:flex;align-items:center;gap:10px;margin-bottom:4px;flex-wrap:wrap}
.pub-name{font-weight:800;font-size:16px}
.pub-level{
  font-size:11px;font-weight:800;letter-spacing:.03em;
  padding:2px 10px;border-radius:999px;
  background:color-mix(in srgb,var(--cyan) 15%,transparent);
  color:var(--cyan);
  border:1px solid color-mix(in srgb,var(--cyan) 32%,transparent);
}
.pub-bio{font-size:13px;color:var(--muted);line-height:1.7;margin-bottom:10px}
.pub-links{display:flex;gap:8px;flex-wrap:wrap}
.pub-links a{
  display:inline-flex;align-items:center;gap:5px;
  font-size:12px;font-weight:600;
  padding:5px 12px;border-radius:999px;
  background:var(--sub);border:1px solid var(--line);
  color:var(--text);text-decoration:none;
  transition:.15s;
}
.pub-links a:hover{border-color:var(--cyan);color:var(--cyan)}
.pub-links a .ic{width:13px;height:13px}
/* More from publisher */
.more-from{margin-bottom:26px}
.more-from h2{font-size:16px;font-weight:700;margin-bottom:12px}
.more-from-track{
  display:flex;gap:12px;
  overflow-x:auto;padding-bottom:10px;
  scroll-snap-type:x mandatory;
  scrollbar-width:thin;scrollbar-color:var(--line) transparent;
}
.more-from-track::-webkit-scrollbar{height:8px}
.more-from-track::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.mini-card{
  flex:0 0 200px;scroll-snap-align:start;
  cursor:pointer;border-radius:10px;
  transition:.15s;
}
.mini-card:hover{transform:translateY(-2px)}
.mini-card .card-thumb{aspect-ratio:16/9;border-radius:10px}
.mini-card .thumb-letter{font-size:36px}
.mini-card .card-title{font-size:13px;margin:8px 0 4px;min-height:2.6em}
.mini-card .card-meta{font-size:11.5px;color:var(--muted)}
/* Comments */
.comments{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.comments-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:16px;flex-wrap:wrap;gap:10px;
}
.comments-head h2{font-size:17px;font-weight:800}
.comments-head h2 span{color:var(--muted);font-weight:600;font-size:14px;margin-inline-start:6px}
.comment-form{display:flex;gap:10px;align-items:center;margin-bottom:20px}
.comment-form input{
  flex:1;background:var(--input);border:1px solid var(--line);
  border-radius:999px;padding:10px 16px;
}
.comment-form button{
  padding:10px 20px;border-radius:999px;
  background:var(--cyan);color:#fff;font-weight:700;font-size:13px;
  transition:.15s;
}
.comment-form button:hover{filter:brightness(.92)}
.avatar{
  width:40px;height:40px;border-radius:50%;
  display:grid;place-items:center;flex:none;
  font-weight:800;color:#fff;font-size:15px;
}
.avatar-sm{width:28px;height:28px;font-size:11.5px}
.avatar-you{background:linear-gradient(135deg,var(--cyan),var(--green-ink))}
.comment{
  display:flex;gap:12px;padding:16px 0;
  border-bottom:1px solid var(--line);
}
.comment:last-child{border-bottom:0}
.comment-body{flex:1;min-width:0}
.comment-head{display:flex;gap:8px;align-items:center;margin-bottom:4px;flex-wrap:wrap}
.comment-head b{font-size:13.5px;font-weight:700}
.comment-time{font-size:12px;color:var(--muted)}
.comment-text{font-size:14px;line-height:1.75;margin-bottom:8px;word-wrap:break-word}
.comment-actions{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.vote-btn,.text-btn{
  display:inline-flex;align-items:center;gap:5px;
  padding:5px 11px;border-radius:999px;
  border:1px solid transparent;background:transparent;
  color:var(--muted);font-size:12.5px;font-weight:600;
  transition:.15s;
}
.vote-btn .ic{width:13px;height:13px}
.vote-btn:hover{background:var(--sub);color:var(--text)}
.vote-btn.active{
  background:color-mix(in srgb,var(--cyan) 15%,transparent);
  color:var(--cyan);
  border-color:color-mix(in srgb,var(--cyan) 35%,transparent);
}
.text-btn:hover{color:var(--cyan)}
.replies{
  margin-top:12px;padding-inline-start:14px;
  border-inline-start:2px solid var(--line);
  display:grid;gap:12px;
}
.reply{display:flex;gap:10px}
.reply-form{display:flex;gap:8px;margin-top:10px}
.reply-form input{
  flex:1;border-radius:999px;padding:7px 14px;
  background:var(--input);border:1px solid var(--line);font-size:13px;
}
.reply-form button{
  padding:7px 16px;border-radius:999px;
  background:var(--cyan);color:#fff;font-weight:700;font-size:12.5px;
}
/* Sidebar related */
.watch-side{
  position:sticky;
  top:calc(88px + env(safe-area-inset-top,0px));
  display:grid;gap:10px;
}
.side-title{font-size:15px;font-weight:800;margin-bottom:4px}
.related-list{display:grid;gap:6px}
.related-item{
  display:flex;gap:10px;cursor:pointer;
  padding:6px;border-radius:var(--radius-sm);
  transition:.15s;
}
.related-item:hover{background:var(--sub)}
.related-thumb{
  width:150px;aspect-ratio:16/9;border-radius:8px;overflow:hidden;
  position:relative;flex:none;border:1px solid var(--line);
}
.related-thumb .thumb-letter{font-size:28px}
.related-thumb .thumb-duration{font-size:10px;padding:1px 5px}
.related-info{flex:1;min-width:0;padding-top:2px}
.related-info h3{
  font-size:13px;font-weight:700;line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;margin-bottom:4px;
}

/* ═══════════════════════════════════════════════════════════════
   UTILITIES
   ═══════════════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function hash(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}
function rng(seed) {
  let s = seed;
  return function() {
    s |= 0; s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function fmtNum(n) {
  if (n >= 1e6) { const v = n/1e6; return (v >= 10 ? Math.round(v) : v.toFixed(1)).toString().replace(/\.0$/,'') + ' مليون'; }
  if (n >= 1e3) { const v = n/1e3; return (v >= 10 ? Math.round(v) : v.toFixed(1)).toString().replace(/\.0$/,'') + ' ألف'; }
  return String(Math.round(n));
}
function fmtDuration(sec) {
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  return h > 0
    ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
    : `${m}:${String(s).padStart(2,'0')}`;
}
function timeAgo(ts) {
  const diff = Date.now() - ts;
  const mins = Math.floor(diff/60000);
  if (mins < 1) return 'الآن';
  if (mins < 60) return `منذ ${mins} دقيقة`;
  const hours = Math.floor(mins/60);
  if (hours < 24) return hours === 1 ? 'منذ ساعة' : hours === 2 ? 'منذ ساعتين' : `منذ ${hours} ساعات`;
  const days = Math.floor(hours/24);
  if (days < 7) return days === 1 ? 'منذ يوم' : days === 2 ? 'منذ يومين' : `منذ ${days} أيام`;
  const weeks = Math.floor(days/7);
  if (days < 30) return weeks === 1 ? 'منذ أسبوع' : weeks === 2 ? 'منذ أسبوعين' : `منذ ${weeks} أسابيع`;
  const months = Math.floor(days/30);
  if (days < 365) return months === 1 ? 'منذ شهر' : months === 2 ? 'منذ شهرين' : `منذ ${months} أشهر`;
  const years = Math.floor(days/365);
  return years === 1 ? 'منذ سنة' : years === 2 ? 'منذ سنتين' : `منذ ${years} سنوات`;
}
function iconSvg(name, cls = 'ic') {
  return `<svg class="${cls}"><use href="#i-${name}"/></svg>`;
}
function toast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('on'), 2400);
}

/* ═══════════════════════════════════════════════════════════════
   DATA GENERATION
   ═══════════════════════════════════════════════════════════════ */
function makeTitles(templates, subjects, count) {
  const out = [];
  for (let i = 0; i < count; i++) {
    const t = templates[i % templates.length];
    const s = subjects[Math.floor(i / templates.length) % subjects.length];
    out.push(t.replace('{X}', s));
  }
  return out;
}

function buildVideos() {
  const all = [];
  let gid = 0;

  CATEGORY_DEFS.forEach(cat => {
    const titles = makeTitles(cat.templates, cat.subjects, 50);
    const local = [];

    titles.forEach((title, i) => {
      const seed = hash(cat.id + ':' + i + ':' + title);
      const r = rng(seed);

      const pub = PUBLISHERS[Math.floor(r() * PUBLISHERS.length)];
      // Views (watch-time minutes) — decreasing trend, most popular first
      const baseViews = 3_200_000;
      const views = Math.max(45_000, Math.round(baseViews * Math.pow(0.935, i) * (0.85 + r() * 0.3)));
      const likes = Math.round(views / (32 + r() * 22));
      const dislikes = Math.max(1, Math.round(likes * (0.025 + r() * 0.055)));
      const daysAgo = Math.floor(r() * 700);
      const date = Date.now() - daysAgo * 86400000;
      const duration = Math.floor(140 + r() * 1600);
      const downloadable = r() < 0.42;

      local.push({
        id: 'v' + (gid++),
        catId: cat.id,
        cat,
        title,
        publisher: pub,
        views, likes, dislikes,
        date, duration, downloadable,
        comments: null
      });
    });

    // Ensure most-popular first
    local.sort((a, b) => b.views - a.views);
    local.forEach((v, idx) => { v.rank = idx; });
    all.push(...local);
  });

  return all;
}

CATEGORY_DEFS.forEach(c => { VIDEOS_BY_CAT[c.id] = ALL_VIDEOS.filter(v => v.catId === c.id); });
const VIDEO_MAP = new Map(ALL_VIDEOS.map(v => [v.id, v]));

const PUBLISHER_INFO = new Map();
function getPublisherInfo(pub) {
  if (!PUBLISHER_INFO.has(pub.name)) {
    const r = rng(hash('pub:' + pub.name));
    const level = 3 + Math.floor(r() * 8);
    const bio = PUB_BIOS[Math.floor(r() * PUB_BIOS.length)];
    const links = [
      { name: 'YouTube', icon: 'play' },
      { name: 'X', icon: 'message' },
      { name: 'Instagram', icon: 'star' },
      { name: 'الموقع', icon: 'link' }
    ];
    PUBLISHER_INFO.set(pub.name, { level, bio, links });
  }
  return PUBLISHER_INFO.get(pub.name);
}

function buildDescription(video) {
  const r = rng(hash('desc:' + video.id));
  const lines = [
    `في هذا الفيديو، نقدّم لك «${video.title}».`,
    DESC_PARTS[Math.floor(r() * DESC_PARTS.length)],
    DESC_PARTS[Math.floor(r() * DESC_PARTS.length)],
    `⏱️ مدة الفيديو: ${fmtDuration(video.duration)} — ${fmtNum(video.views)} دقيقة مشاهدة.`,
    'لا تنسَ الاشتراك في القناة وتفعيل جرس التنبيهات لمتابعة كل جديد.',
    ARTICLE_DESC_EXTRAS[Math.floor(r() * ARTICLE_DESC_EXTRAS.length)]
  ];
  return lines.join('\n\n');
}

/* ═══════════════════════════════════════════════════════════════
   STATE
   ═══════════════════════════════════════════════════════════════ */
const state = {
  view: 'browse',
  search: '',
  currentVideoId: null,
  votes: {},          // videoId -> 1 | -1 | 0
  commentVotes: {},   // commentId -> 1 | -1 | 0
  browseScrollY: 0
};

/* ═══════════════════════════════════════════════════════════════
   RENDER — BROWSE
   ═══════════════════════════════════════════════════════════════ */
function renderCard(v) {
  const initial = v.title.charAt(0);
  const rank = v.rank < 3 ? `<span class="rank-badge">#${v.rank + 1}</span>` : '';
  return `
    <article class="video-card" data-video-id="${v.id}" tabindex="0" role="button" aria-label="${esc(v.title)}">
      <div class="card-thumb">
        <div class="thumb-gradient" style="--c1:${v.cat.c1};--c2:${v.cat.c2}">
          <span class="thumb-letter">${esc(initial)}</span>
        </div>
        <span class="thumb-duration">${fmtDuration(v.duration)}</span>
        ${rank}
        <div class="card-play-overlay">${iconSvg('play')}</div>
      </div>
      <h3 class="card-title">${esc(v.title)}</h3>
      <div class="card-stats">
        <span class="stat">${iconSvg('eye')}${fmtNum(v.views)} دقيقة</span>
        <span class="stat">${iconSvg('like','ic ic-fill')}${fmtNum(v.likes)}</span>
        <span class="stat">${iconSvg('dislike','ic ic-fill')}${fmtNum(v.dislikes)}</span>
      </div>
      <div class="card-pub">
        <span class="mini-avatar" style="background:${v.publisher.color}">${esc(v.publisher.initial)}</span>
        <span class="card-pub-name">${esc(v.publisher.name)}</span>
        <span class="card-date">${timeAgo(v.date)}</span>
      </div>
    </article>
  `;
}

function renderMiniCard(v) {
  return `
    <article class="mini-card" data-video-id="${v.id}" tabindex="0" role="button" aria-label="${esc(v.title)}">
      <div class="card-thumb">
        <div class="thumb-gradient" style="--c1:${v.cat.c1};--c2:${v.cat.c2}">
          <span class="thumb-letter">${esc(v.title.charAt(0))}</span>
        </div>
        <span class="thumb-duration">${fmtDuration(v.duration)}</span>
      </div>
      <h3 class="card-title">${esc(v.title)}</h3>
      <div class="card-meta">${fmtNum(v.views)} دقيقة · ${timeAgo(v.date)}</div>
    </article>
  `;
}

function renderCategorySection(cat) {
  const vids = VIDEOS_BY_CAT[cat.id];
  return `
    <section class="category" data-cat="${cat.id}">
      <div class="category-head">
        <div class="cat-title-group">
          <span class="cat-badge" style="background:${cat.c2}">${iconSvg(cat.icon)}</span>
          <h2>${esc(cat.name)}</h2>
          <span class="cat-count">${vids.length} فيديو</span>
        </div>
        <div class="cat-tools">
          <button class="btn btn-sm expand-btn" data-expand="${cat.id}">عرض الكل</button>
          <div class="carousel-controls">
            <button class="carousel-btn" data-dir="-1" aria-label="السابق">${iconSvg('chev-r')}</button>
            <button class="carousel-btn" data-dir="1" aria-label="التالي">${iconSvg('chev-l')}</button>
          </div>
        </div>
      </div>
      <div class="carousel">
        <div class="carousel-track">
          ${vids.map(renderCard).join('')}
        </div>
      </div>
    </section>
  `;
}

function renderBrowse() {
  const container = $('categoriesContainer');
  const q = state.search.trim().toLowerCase();

  if (q) {
    const results = ALL_VIDEOS.filter(v =>
      v.title.toLowerCase().includes(q) ||
      v.publisher.name.toLowerCase().includes(q) ||
      v.cat.name.toLowerCase().includes(q)
    ).sort((a, b) => b.views - a.views);

    if (!results.length) {
      container.innerHTML = `
        <div class="empty-state">
          ${iconSvg('search','ic')}
          <h3>لا توجد نتائج</h3>
          <p>لم نعثر على فيديو يطابق «${esc(state.search)}». جرّب كلمة أخرى.</p>
        </div>`;
      return;
    }

    container.innerHTML = `
      <div class="results-head">
        <h2>نتائج البحث عن «<em>${esc(state.search)}</em>»</h2>
        <span class="results-count">${results.length} نتيجة</span>
      </div>
      <div class="results-grid">
        ${results.map(renderCard).join('')}
      </div>`;
    return;
  }

  container.innerHTML = CATEGORY_DEFS.map(renderCategorySection).join('');
}

/* ═══════════════════════════════════════════════════════════════
   RENDER — WATCH

function playerSrcdoc(video) {

  const title = esc(video.title);
  return `<!DOCTYPE html><html dir="rtl"><head><meta charset="utf-8"><style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,${c1},${c2});font-family:system-ui,-apple-system,sans-serif;color:#fff;overflow:hidden;position:relative}
    body::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.04) 0 2px,transparent 2px 14px);pointer-events:none}
    .play{width:96px;height:96px;border-radius:50%;background:rgba(0,0,0,.55);backdrop-filter:blur(10px);display:grid;place-items:center;box-shadow:0 20px 60px rgba(0,0,0,.5);cursor:pointer;transition:.2s;z-index:1}
    .play:hover{transform:scale(1.06);background:rgba(0,0,0,.72)}
    .play svg{width:40px;height:40px;fill:#fff;margin-left:5px}
    .title{position:absolute;bottom:22px;left:24px;right:24px;font-size:15px;font-weight:600;text-align:center;text-shadow:0 2px 12px rgba(0,0,0,.7);z-index:1;line-height:1.4}
    .note{position:absolute;top:14px;right:14px;font-size:11px;background:rgba(0,0,0,.45);padding:4px 10px;border-radius:999px;z-index:1;letter-spacing:.02em}
    .note::before{content:'● ';color:#4ade80}
  </style></head><body>
    <div class="note">معاينة تجريبية</div>
    <div class="play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
    <div class="title">${title}</div>
  </body></html>`;
}

function updateActionButtons(video) {
  const vote = state.votes[video.id] || 0;
  const likes = video.likes + (vote === 1 ? 1 : 0);
  const dislikes = video.dislikes + (vote === -1 ? 1 : 0);
  $('likeBtn').classList.toggle('active', vote === 1);
  $('dislikeBtn').classList.toggle('active', vote === -1);
  $('likeCount').textContent = fmtNum(likes);
  $('dislikeCount').textContent = fmtNum(dislikes);
}

function renderPublisher(video) {
  const info = getPublisherInfo(video.publisher);
  const links = info.links.map(l =>
    `<a href="#" onclick="event.preventDefault();toast('سيتم فتح ${esc(l.name)}');return false;">${iconSvg(l.icon)}${esc(l.name)}</a>`
  ).join('');
  return `
    <div class="pub-avatar" style="background:linear-gradient(135deg,${video.publisher.color},color-mix(in srgb,${video.publisher.color} 60%,#000))">${esc(video.publisher.initial)}</div>
    <div class="pub-main">
      <div class="pub-name-row">
        <span class="pub-name">${esc(video.publisher.name)}</span>
        <span class="pub-level">LV ${info.level}</span>
      </div>
      <p class="pub-bio">${esc(info.bio)}</p>
      <div class="pub-links">${links}</div>
    </div>
  `;
}

function renderMoreFrom(video) {
  const more = ALL_VIDEOS
    .filter(v => v.id !== video.id && v.publisher.name === video.publisher.name)
    .sort((a, b) => b.views - a.views)
    .slice(0, 10);
  if (!more.length) return '';
  return `
    <h2>المزيد من ${esc(video.publisher.name)}</h2>
    <div class="more-from-track">${more.map(renderMiniCard).join('')}</div>
  `;
}

function renderRelated(video) {
  const related = VIDEOS_BY_CAT[video.catId]
    .filter(v => v.id !== video.id)
    .slice(0, 12);
  return related.map(v => `
    <article class="related-item" data-video-id="${v.id}" tabindex="0" role="button" aria-label="${esc(v.title)}">
      <div class="related-thumb">
        <div class="thumb-gradient" style="--c1:${v.cat.c1};--c2:${v.cat.c2}">
          <span class="thumb-letter">${esc(v.title.charAt(0))}</span>
        </div>
        <span class="thumb-duration">${fmtDuration(v.duration)}</span>
      </div>
      <div class="related-info">
        <h3>${esc(v.title)}</h3>
        <div class="related-pub">${esc(v.publisher.name)}</div>
        <div class="related-meta">${fmtNum(v.views)} دقيقة · ${timeAgo(v.date)}</div>
      </div>
    </article>
  `).join('');
}

function generateComments(video) {
  const r = rng(hash('comments:' + video.id));
  const count = 4 + Math.floor(r() * 4);
  const comments = [];
  for (let i = 0; i < count; i++) {
    const user = COMMENT_USERS[Math.floor(r() * COMMENT_USERS.length)];
    const text = COMMENT_TEXTS[Math.floor(r() * COMMENT_TEXTS.length)];
    const daysAgo = Math.floor(r() * 45);
    const agrees = Math.floor(r() * 240);
    const disagrees = Math.floor(r() * 35);
    const replies = [];
    if (r() < 0.35) {
      const ru = COMMENT_USERS[Math.floor(r() * COMMENT_USERS.length)];
      replies.push({
        id: video.id + '-r' + i,
        user: ru,
        text: REPLY_TEXTS[Math.floor(r() * REPLY_TEXTS.length)],
        daysAgo: Math.max(0, daysAgo - Math.floor(r() * 4) - 1)
      });
    }
    comments.push({
      id: video.id + '-c' + i,
      user, text, daysAgo, agrees, disagrees, replies
    });
  }
  return comments;
}

function getComments(video) {
  if (!video.comments) video.comments = generateComments(video);
  return video.comments;
}

function renderComment(c) {
  const vote = state.commentVotes[c.id] || 0;
  const agrees = c.agrees + (vote === 1 ? 1 : 0);
  const disagrees = c.disagrees + (vote === -1 ? 1 : 0);
  const repliesHtml = c.replies.map(r => `
    <div class="reply">
      <span class="avatar avatar-sm" style="background:${r.user.color}">${esc(r.user.initial)}</span>
      <div style="flex:1;min-width:0">
        <div class="comment-head">
          <b>${esc(r.user.name)}</b>
          <span class="comment-time">${timeAgo(Date.now() - r.daysAgo * 86400000)}</span>
        </div>
        <p class="comment-text">${esc(r.text)}</p>
      </div>
    </div>
  `).join('');
  return `
    <article class="comment" data-comment-id="${c.id}">
      <span class="avatar" style="background:${c.user.color}">${esc(c.user.initial)}</span>
      <div class="comment-body">
        <div class="comment-head">
          <b>${esc(c.user.name)}</b>
          <span class="comment-time">${timeAgo(Date.now() - c.daysAgo * 86400000)}</span>
        </div>
        <p class="comment-text">${esc(c.text)}</p>
        <div class="comment-actions">
          <button class="vote-btn ${vote === 1 ? 'active' : ''}" data-vote="1">
            ${iconSvg('like','ic ic-fill')} اتفق <span>${fmtNum(agrees)}</span>
          </button>
          <button class="vote-btn ${vote === -1 ? 'active' : ''}" data-vote="-1">
            ${iconSvg('dislike','ic ic-fill')} لا أتفق <span>${fmtNum(disagrees)}</span>
          </button>
          <button class="text-btn" data-action="reply">رد</button>
          <button class="text-btn" data-action="report">إبلاغ</button>
        </div>
        ${c.replies.length ? `<div class="replies">${repliesHtml}</div>` : ''}
        <form class="reply-form" hidden>
          <input type="text" placeholder="اكتب ردًا على ${esc(c.user.name)}…" maxlength="500">
          <button type="submit">رد</button>
        </form>
      </div>
    </article>
  `;
}

function renderComments(video) {
  const comments = getComments(video);
  return `
    <div class="comments-head">
      <h2>التعليقات <span>(${comments.length})</span></h2>
    </div>
    <form class="comment-form" id="commentForm">
      <span class="avatar avatar-you">أ</span>
      <input type="text" id="commentInput" placeholder="أضف تعليقًا…" maxlength="1000" autocomplete="off">
      <button type="submit">نشر</button>
    </form>
    <div class="comment-list" id="commentList">
      ${comments.map(renderComment).join('')}
    </div>
  `;
}

function renderWatch(video) {
  // Player
  $('playerFrame').srcdoc = playerSrcdoc(video);

  // Title
  $('watchTitle').textContent = video.title;

  // Meta
  $('watchMeta').innerHTML = `
    <span class="stat">${iconSvg('eye')}${fmtNum(video.views)} دقيقة مشاهدة</span>
    <span class="stat">${iconSvg('clock')}${fmtDuration(video.duration)}</span>
    <span class="stat">${iconSvg('film')}${esc(video.cat.name)}</span>
    <span class="stat">${timeAgo(video.date)}</span>
  `;

  // Actions
  updateActionButtons(video);
  $('downloadBtn').hidden = !video.downloadable;

  // Description
  $('watchDescription').textContent = buildDescription(video);

  // Publisher
  $('publisherCard').innerHTML = renderPublisher(video);

  // More from publisher
  $('moreFrom').innerHTML = renderMoreFrom(video);

  // Comments
  $('comments').innerHTML = renderComments(video);

  // Related
  $('relatedList').innerHTML = renderRelated(video);
}

/* ═══════════════════════════════════════════════════════════════
   NAVIGATION / ROUTING
   ═══════════════════════════════════════════════════════════════ */
function showBrowse() {
  state.view = 'browse';
  $('browseView').hidden = false;
  $('watchView').hidden = true;
  document.title = 'مشاهدة الفيديوهات — CineAura';
  renderBrowse();
  requestAnimationFrame(() => window.scrollTo(0, state.browseScrollY));
}

function showWatch(video) {
  if (state.view === 'browse') state.browseScrollY = window.scrollY;
  state.view = 'watch';
  state.currentVideoId = video.id;
  $('browseView').hidden = true;
  $('watchView').hidden = false;
  document.title = `${video.title} — CineAura`;
  renderWatch(video);
  window.scrollTo(0, 0);
}

function route() {
  const h = location.hash || '';
  if (h.startsWith('#watch/')) {
    const id = h.slice(7);
    const video = VIDEO_MAP.get(id);
    if (video) { showWatch(video); return; }
  }
  showBrowse();
}

/* ═══════════════════════════════════════════════════════════════
   EVENT HANDLERS
   ═══════════════════════════════════════════════════════════════ */
// Global delegated clicks
document.addEventListener('click', e => {
  // 1) Video card / related / mini card → navigate
  const card = e.target.closest('[data-video-id]');
  if (card && !e.target.closest('.carousel-btn, .expand-btn')) {
    e.preventDefault();
    if (state.view === 'browse') state.browseScrollY = window.scrollY;
    location.hash = '#watch/' + card.dataset.videoId;
    return;
  }

  // 2) Carousel controls
  const carBtn = e.target.closest('.carousel-btn');
  if (carBtn) {
    const section = carBtn.closest('.category');
    const track = section.querySelector('.carousel-track');
    const amount = track.clientWidth * 0.85;
    const dir = +carBtn.dataset.dir; // 1 = next (toward left in RTL), -1 = prev
    const isRTL = getComputedStyle(track).direction === 'rtl';
    track.scrollBy({ left: isRTL ? -dir * amount : dir * amount, behavior: 'smooth' });
    return;
  }

  // 3) Expand / collapse category
  const expBtn = e.target.closest('.expand-btn');
  if (expBtn) {
    const section = expBtn.closest('.category');
    const expanded = section.classList.toggle('expanded');
    expBtn.textContent = expanded ? 'طي' : 'عرض الكل';
    return;
  }

  // 4) Comment vote buttons
  const voteBtn = e.target.closest('.vote-btn');
  if (voteBtn) {
    const commentEl = voteBtn.closest('.comment');
    if (!commentEl) return;
    const cid = commentEl.dataset.commentId;
    const val = +voteBtn.dataset.vote;
    state.commentVotes[cid] = state.commentVotes[cid] === val ? 0 : val;
    reRenderComment(cid);
    return;
  }

  // 5) Comment action buttons (reply / report)
  const actBtn = e.target.closest('[data-action]');
  if (actBtn) {
    const action = actBtn.dataset.action;
    if (action === 'reply') {
      const form = actBtn.closest('.comment').querySelector('.reply-form');
      form.hidden = !form.hidden;
      if (!form.hidden) form.querySelector('input').focus();
    } else if (action === 'report') {
      toast('تم إرسال إبلاغك إلى المراجعين ✓');
    }
    return;
  }

  // 6) Back button
  if (e.target.closest('#backBtn')) {
    location.hash = '#browse';
    return;
  }

  // 7) Like / dislike
  if (e.target.closest('#likeBtn')) {
    const id = state.currentVideoId;
    if (!id) return;
    const cur = state.votes[id] || 0;
    state.votes[id] = cur === 1 ? 0 : 1;
    updateActionButtons(VIDEO_MAP.get(id));
    return;
  }
  if (e.target.closest('#dislikeBtn')) {
    const id = state.currentVideoId;
    if (!id) return;
    const cur = state.votes[id] || 0;
    state.votes[id] = cur === -1 ? 0 : -1;
    updateActionButtons(VIDEO_MAP.get(id));
    return;
  }

  // 8) Share
  if (e.target.closest('#shareBtn')) {
    const url = location.href;
    const done = () => toast('تم نسخ رابط الفيديو ✓');
    if (navigator.clipboard?.writeText) {
      navigator.clipboard.writeText(url).then(done).catch(() => toast('تعذّر النسخ'));
    } else {
      done();
    }
    return;
  }

  // 9) Download
  if (e.target.closest('#downloadBtn')) {
    toast('بدأ تحضير ملف التحميل…');
    return;
  }

  // 10) Report video
  if (e.target.closest('#reportBtn')) {
    toast('تم إرسال إبلاغك عن الفيديو إلى المراجعين ✓');
    return;
  }
});

// Keyboard activation for cards
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') {
    const card = e.target.closest('[data-video-id]');
    if (card && e.target === card) {
      e.preventDefault();
      if (state.view === 'browse') state.browseScrollY = window.scrollY;
      location.hash = '#watch/' + card.dataset.videoId;
    }
  }
});

// Comment form + reply form submissions
document.addEventListener('submit', e => {
  // Main comment form
  if (e.target.id === 'commentForm') {
    e.preventDefault();
    const video = VIDEO_MAP.get(state.currentVideoId);
    if (!video) return;
    const input = $('commentInput');
    const text = input.value.trim();
    if (!text) return;
    const comments = getComments(video);
    comments.unshift({
      id: video.id + '-c' + Date.now(),
      user: { name: 'أنت', initial: 'أ', color: '#01b4e4' },
      text,
      daysAgo: 0,
      agrees: 0,
      disagrees: 0,
      replies: []
    });
    input.value = '';
    $('commentList').innerHTML = comments.map(renderComment).join('');
    toast('تم نشر تعليقك ✓');
    return;
  }

  // Reply form
  if (e.target.classList.contains('reply-form')) {
    e.preventDefault();
    const form = e.target;
    const input = form.querySelector('input');
    const text = input.value.trim();
    if (!text) return;
    const commentEl = form.closest('.comment');
    const cid = commentEl.dataset.commentId;
    const video = VIDEO_MAP.get(state.currentVideoId);
    if (!video) return;
    const c = getComments(video).find(x => x.id === cid);
    if (!c) return;
    c.replies.push({
      id: cid + '-r' + Date.now(),
      user: { name: 'أنت', initial: 'أ', color: '#01b4e4' },
      text,
      daysAgo: 0
    });
    input.value = '';
    reRenderComment(cid);
    toast('تمت إضافة ردك ✓');
  }
});

function reRenderComment(cid) {
  const video = VIDEO_MAP.get(state.currentVideoId);
  if (!video) return;
  const c = getComments(video).find(x => x.id === cid);
  if (!c) return;
  const el = document.querySelector(`.comment[data-comment-id="${cid}"]`);
  if (!el) return;
  const temp = document.createElement('div');
  temp.innerHTML = renderComment(c);
  el.replaceWith(temp.firstElementChild);
}

/* ═══════════════════════════════════════════════════════════════
   SEARCH
   ═══════════════════════════════════════════════════════════════ */
const searchInput = $('searchInput');
const searchClear = $('searchClear');

let searchTimer = null;
searchInput.addEventListener('input', () => {
  const val = searchInput.value;
  searchClear.hidden = !val;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    state.search = val.trim();
    if (state.view !== 'browse') {
      location.hash = '#browse';
    } else {
      renderBrowse();
      window.scrollTo(0, 0);
    }
  }, 180);
});
searchClear.addEventListener('click', () => {
  searchInput.value = '';
  searchClear.hidden = true;
  state.search = '';
  if (state.view !== 'browse') location.hash = '#browse';
  else { renderBrowse(); window.scrollTo(0, 0); }
  searchInput.focus();
});

// Keyboard shortcut: "/" focuses search
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== searchInput &&
      !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) {
    e.preventDefault();
    searchInput.focus();
  }
});

/* ═══════════════════════════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════════════════════════ */
window.addEventListener('hashchange', route);
route();
</script>

<!-- ═══════════════════════════════════════════════════════════════
     THEME SYSTEM
     ═══════════════════════════════════════════════════════════════ -->
<script id="artheme-js">
(function () {
  'use strict';
  if (window.__arthemeInited) return;
  window.__arthemeInited = true;

  try {
    var qs = new URLSearchParams(location.search);
    if (qs.get('reset-theme') === '1') {
      try { localStorage.removeItem('cineaura:style'); } catch (e) {}
      try { localStorage.removeItem('cineaura:theme'); } catch (e) {}
      qs.delete('reset-theme');
      var clean = location.pathname + (qs.toString() ? '?' + qs.toString() : '') + location.hash;
      location.replace(clean); return;
    }
  } catch (e) {}

  var THEMES = [
    { id:'default',   name:'CineAura',   accent:'#01b4e4' },
    { id:'facebook',  name:'Facebook',   accent:'#1877f2' },
    { id:'youtube',   name:'YouTube',    accent:'#ff0000' },
    { id:'instagram', name:'Instagram',  accent:'#d62976' },
    { id:'netflix',   name:'Netflix',    accent:'#e50914' },
    { id:'prime',     name:'Prime',      accent:'#00a8e1' },
    { id:'appletv',   name:'Apple TV+',  accent:'#2997ff' },
    { id:'win7',      name:'Windows 7',  accent:'#2a7bd8' },
    { id:'win8',      name:'Windows 8',  accent:'#0078d7' },
    { id:'win10',     name:'Windows 10', accent:'#0078d4' },
    { id:'win11',     name:'Windows 11', accent:'#0067c0' },
    { id:'macos',     name:'macOS',      accent:'#007aff' },
    { id:'android',   name:'Android',    accent:'#3ddc84' },
    { id:'ios',       name:'iOS',        accent:'#007aff' }
  ];
  var VALID = THEMES.map(function (t) { return t.id; });
  var STYLE_KEY = 'cineaura:style', MODE_KEY = 'cineaura:theme';
  var okS = function (v) { return VALID.indexOf(v) !== -1; };
  var okM = function (v) { return v === 'day' || v === 'night'; };
  var read = function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } };
  var save = function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} };
  var del  = function (k) { try { localStorage.removeItem(k); } catch (e) {} };

  function boot() {
    var root = document.documentElement;
    var s = read(STYLE_KEY), m = read(MODE_KEY);
    if (s && okS(s)) root.setAttribute('data-style', s);
    else if (s) del(STYLE_KEY);
    else if (!root.getAttribute('data-style')) root.setAttribute('data-style', 'default');

    if (m && okM(m)) root.setAttribute('data-theme', m);
    else if (m) del(MODE_KEY);
    else if (!root.getAttribute('data-theme')) {
      try { root.setAttribute('data-theme', matchMedia('(prefers-color-scheme: light)').matches ? 'day' : 'night'); }
      catch (e) { root.setAttribute('data-theme', 'night'); }
    }

    var hdrBtn = document.getElementById('themeBtn');
    function syncHdr() {
      if (!hdrBtn) return;
      var day = root.getAttribute('data-theme') === 'day';
      hdrBtn.textContent = day ? '☾' : '☀︎';
      hdrBtn.title = day ? 'التبديل إلى الوضع الليلي' : 'التبديل إلى الوضع النهاري';
    }
    syncHdr();
    if (hdrBtn) {
      hdrBtn.onclick = function () {
        var next = root.getAttribute('data-theme') === 'day' ? 'night' : 'day';
        root.setAttribute('data-theme', next);
        save(MODE_KEY, next);
        syncHdr();
        syncUI();
      };
    }

    var frag = document.createElement('div');
    frag.innerHTML =
      '<button type="button" id="artheme-btn" aria-label="تغيير المظهر" aria-expanded="false" aria-controls="artheme-panel">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
          '<circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/>' +
          '<circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/>' +
          '<circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/>' +
          '<circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/>' +
          '<path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/>' +
        '</svg>' +
        '<span class="at-dot" aria-hidden="true"></span>' +
      '</button>' +
      '<div id="artheme-panel" role="dialog" aria-label="إعدادات المظهر">' +
        '<div class="at-head"><h3>المظهر</h3><button type="button" class="at-close" aria-label="إغلاق">&times;</button></div>' +
        '<div class="at-mode" role="radiogroup" aria-label="وضع الألوان">' +
          '<button type="button" role="radio" data-mode="day" aria-checked="false">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>' +
            'نهاري</button>' +
          '<button type="button" role="radio" data-mode="night" aria-checked="false">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>' +
            'ليلي</button>' +
        '</div>' +
        '<div class="at-grid" role="radiogroup" aria-label="نمط الثيم"></div>' +
        '<div class="at-foot">' +
          '<button type="button" class="at-reset">إعادة تعيين</button>' +
          '<span class="at-cur"></span>' +
        '</div>' +
      '</div>';
    while (frag.firstChild) document.body.appendChild(frag.firstChild);

    var btn = document.getElementById('artheme-btn');
    var panel = document.getElementById('artheme-panel');
    var grid = panel.querySelector('.at-grid');

    THEMES.forEach(function (t) {
      var card = document.createElement('button');
      card.type = 'button'; card.className = 'at-card';
      card.setAttribute('role', 'radio');
      card.setAttribute('aria-checked', 'false');
      card.dataset.style = t.id;
      card.style.setProperty('--at-accent', t.accent);
      card.innerHTML =
        '<span class="at-prev" aria-hidden="true">' +
          '<span class="at-prev-bar">' +
            '<span class="at-prev-dot"></span><span class="at-prev-dot"></span><span class="at-prev-dot"></span>' +
          '</span>' +
          '<span class="at-prev-body">Aa</span>' +
        '</span>' +
        '<span class="at-name"></span>';
      card.querySelector('.at-name').textContent = t.name;
      grid.appendChild(card);
    });

    function curS() { return root.getAttribute('data-style') || 'default'; }
    function curM() { return root.getAttribute('data-theme') || 'night'; }

    function syncUI() {
      var s = curS(), m = curM();
      grid.querySelectorAll('.at-card').forEach(function (c) {
        c.setAttribute('aria-checked', c.dataset.style === s ? 'true' : 'false');
      });
      panel.querySelectorAll('.at-mode button').forEach(function (b) {
        b.setAttribute('aria-checked', b.dataset.mode === m ? 'true' : 'false');
      });
      var t = THEMES.filter(function (x) { return x.id === s; })[0];
      var dot = btn.querySelector('.at-dot');
      if (t && dot) dot.style.background = t.accent;
      var cur = panel.querySelector('.at-cur');
      if (cur) cur.textContent = 'الحالي: ' + (t ? t.name : 'CineAura') + ' · ' + (m === 'day' ? 'نهاري' : 'ليلي');
      syncHdr();
    }

    function applyStyle(id) {
      if (!okS(id)) return;
      root.setAttribute('data-style', id);
      save(STYLE_KEY, id);
      syncUI();
    }
    function applyMode(mode) {
      if (!okM(mode)) return;
      root.setAttribute('data-theme', mode);
      save(MODE_KEY, mode);
      syncUI();
    }
    function resetAll() {
      del(STYLE_KEY); del(MODE_KEY);
      root.setAttribute('data-style', 'default');
      root.setAttribute('data-theme', 'night');
      syncUI();
    }

    grid.addEventListener('click', function (e) {
      var card = e.target.closest('.at-card');
      if (card) applyStyle(card.dataset.style);
    });
    panel.querySelector('.at-mode').addEventListener('click', function (e) {
      var b = e.target.closest('button[data-mode]');
      if (b) applyMode(b.dataset.mode);
    });
    panel.querySelector('.at-reset').addEventListener('click', resetAll);

    var open = false;
    function openP()  { open = true;  panel.classList.add('open');  btn.setAttribute('aria-expanded', 'true');  syncUI(); }
    function closeP() { open = false; panel.classList.remove('open'); btn.setAttribute('aria-expanded', 'false'); }
    btn.addEventListener('click', function () { open ? closeP() : openP(); });
    panel.querySelector('.at-close').addEventListener('click', closeP);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && open) closeP(); });
    document.addEventListener('click', function (e) {
      if (!open) return;
      if (panel.contains(e.target) || btn.contains(e.target)) return;
      closeP();
    });

    syncUI();

    window.CineAuraTheme = {
      set: applyStyle, setMode: applyMode, reset: resetAll,
      list: THEMES.slice(),
      current: function () { return { style: curS(), mode: curM() }; }
    };
  }

  try { boot(); } catch (err) { console.error('[artheme] init failed:', err); }
})();
</script>
